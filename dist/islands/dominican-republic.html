formal education for Dominican women was virtually non-existent, limited to basic literacy and domestic skills [1]. Ureña recognized that the nation could never achieve true progress or democratic stability while half of its population remained disenfranchised and uneducated [3].\n\nIn 1879, the Puerto Rican educator and philosopher [Eugenio María de Hostos](/profiles/eugenio-hostos) arrived in the Dominican Republic. Hostos initiated a radical reform of the country’s educational system, championing a scientific, secular, and positivist approach to pedagogy [5]. Ureña found in Hostos a kindred spirit, and she enthusiastically embraced his ideas [2]. On November 3, 1881, with the support of Hostos and her husband, she founded the *Instituto de Señoritas* (Young Ladies' Institute) in Santo Domingo [4].\n\n![Salomé Ureña de Henríquez Portrait](https://upload.wikimedia.org/wikipedia/commons/1/18/Salom%C3%A9_Ure%C3%B1a_de_Henr%C3%ADquez.jpg)\n\nThe *Instituto de Señoritas* was the first institution of higher education for women in the Dominican Republic [1]. The curriculum was revolutionary, focusing on mathematics, natural sciences, history, geography, literature, and pedagogy, rather than the traditional domestic arts [2]. Ureña sought to prepare women not just to be better wives and mothers, but to be independent thinkers, professionals, and citizens.\n\nThe school faced significant opposition from conservative sectors of society and the Catholic Church, which viewed secular female education as a threat to traditional family structures and religious authority. Despite these challenges, Ureña’s dedication kept the school open. The crowning achievement of the Institute came in 1887, when it celebrated the graduation of its first six normal school teachers: Leonor M. Feltz, Altagracia Henríquez Perdomo, Luisa Ozema Pellerano, Mercedes Laura Aguiar, and Ureña’s own sister, Ramona Ureña [4]. This event marked a watershed moment in Dominican history, establishing teaching as a respectable profession for women and creating a network of educated female leaders who would spread modern pedagogy throughout the country [3].\n\n#### Declining Health, Exile, and Final Years (1893–1897)\nThe relentless demands of running the *Instituto de Señoritas*, raising her children, and participating in public life took a severe toll on Ureña’s health. She had long suffered from respiratory issues, and by the early 1890s, she had contracted tuberculosis [2]. In 1893, facing failing health and financial difficulties, she was forced to close the Institute, a decision that caused her deep sorrow [4].\n\nIn search of a healthier climate, Ureña traveled to Puerto Rico, where her husband was pursuing medical work. She spent several years on the neighboring island, resting and corresponding with her family and friends. Despite her physical weakness, she continued to write and monitor the progress of her former students, who had taken up her educational mantle in Santo Domingo.\n\nSensing that her death was near, Ureña returned to her beloved Santo Domingo in 1896. She passed away on March 6, 1897, at the young age of forty-six [2]. Her death was met with national mourning. The Dominican government ordered a state funeral, and her body was buried in the Church of the Mercedes, later moved to the National Pantheon of the Dominican Republic, where she rests alongside the founding fathers of the nation.\n\n#### Legacy and Lasting Impact\nSalomé Ureña’s legacy is woven into the very fabric of Dominican national identity. She is celebrated not only as a poet of exquisite lyrical beauty but also as the mother of Dominican feminism and modern education [1]. In recognition of her impact, her birthday, October 21, is celebrated annually in the Dominican Republic as National Poets' Day.\n\nNumerous educational institutions bear her name, most notably the *Instituto Superior de Formación Docente Salomé Ureña* (ISFODOSU), the country’s premier teacher-training university [3]. Her life and work continue to inspire generations of Caribbean writers and educators. In her poetry, she envisioned a nation of peace, progress, and intellectual light; in her educational work, she built the foundation to make that vision a reality."])</script><script>self.__next_f.push([1,"24:[\"$\",\"$L6\",\"d7a11141-d2b3-40df-aee3-5a12fa66001b\",{\"href\":\"/profiles/salome-urena\",\"className\":\"group flex flex-col bg-white border border-navy/5 shadow-sm hover:shadow-xl transition-all duration-500\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative aspect-[4/5] overflow-hidden\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/9/9f/Salom%C3%A9_Ure%C3%B1a_de_Henr%C3%ADquez.jpg\",\"alt\":\"Salomé Ureña\",\"className\":\"object-cover w-full h-full grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700\"}]}],[\"$\",\"div\",null,{\"className\":\"p-6\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"font-serif text-xl text-navy mb-2 group-hover:text-gold transition-colors\",\"children\":\"Salomé Ureña\"}],[\"$\",\"p\",null,{\"className\":\"text-navy/60 text-xs line-clamp-3 leading-relaxed mb-4\",\"children\":\"$30\"}],\"$L31\"]}]]}]\n25:[\"$\",\"$L6\",\"9644e8e0-be09-4cc0-ba4e-f537dafed5d7\",{\"href\":\"/profiles/mirabal-sisters\",\"className\":\"group flex flex-col bg-white border border-navy/5 shadow-sm hover:shadow-xl transition-all duration-500\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative aspect-[4/5] overflow-hidden\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/4/4e/Hermanas_Mirabal.jpg\",\"alt\":\"The Mirabal Sisters\",\"className\":\"object-cover w-full h-full grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700\"}]}],[\"$\",\"div\",null,{\"className\":\"p-6\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"font-serif text-xl text-navy mb-2 group-hover:text-gold transition-colors\
