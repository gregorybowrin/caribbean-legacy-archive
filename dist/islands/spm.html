nes were not financial burdens to be subsidized, but strategic ecological and economic assets for the entire French Republic.\n\nOne of her primary, long-term legislative focuses was the complex legal push for the extension of the continental shelf for Saint Pierre and Miquelon. This was a highly intricate legal and diplomatic effort aimed at securing future resource rights and economic opportunities in the seabed stretching beyond the standard EEZ. The effort required intense, persistent negotiation with both the French central government and international maritime bodies, showcasing Claireaux's tenacity, diplomatic skill, and unwavering commitment to the archipelago's sovereign interests.\n\n### President of the National Council of the Sea and Littoral\n\nHer exceptional expertise and impassioned advocacy did not go unnoticed at the highest echelons of the French government. In 2014, Claireaux was appointed President of the bureau of the *Conseil national de la mer et des littoraux* (National Council of the Sea and Littoral, CNML), a highly influential advisory body tasked with shaping France's comprehensive national strategy for the sea and coastline. Validating her effective leadership, she was overwhelmingly re-elected to this critical position in 2016 for an additional six-year term.\n\n\u003e \"The sea does not divide our islands from the metropolis; rather, it connects us to a larger, shared ecological destiny that we must actively protect.\"\n\nUnder her steadfast guidance, the CNML tackled a wide array of pressing modern issues, prominently including the urgent ecological transition of maritime industries, the innovative development of renewable marine energy sources, and the rigorous protection of vulnerable marine biodiversity. Claireaux argued passionately that overseas territories like Saint Pierre and Miquelon were not merely peripheral outposts, but were actively on the front lines of global climate change. Therefore, she insisted, they should be empowered as pioneers in the burgeoning \"blue economy.\" She successfully elevated the national discourse around sustainable maritime practices, ensuring that the unique, localized challenges and vast potentials of island communities were permanently integrated into overarching national policy frameworks.\n\n### Legacy and Late Career\n\nIn 2017, dynamically aligning with the rapidly shifting political tides across France, Claireaux joined Emmanuel Macron's centrist *La République En Marche* (LREM) movement. However, later that same year, she faced a difficult political headwind and was defeated in her bid for re-election to the Senate by [Stéphane Artano](/profiles/stephane-artano). Despite this national-level setback, she remained deeply committed to her local community and continued to serve actively as the Mayor of Saint-Pierre until May 25, 2020.\n\nKarine Claireaux's enduring legacy is defined by her steadfast, lifelong dedication to her island home and her uniquely visionary approach to modern maritime governance. She meticulously navigated Saint-Pierre through one of its most turbulent and difficult economic periods in history, successfully redefining its identity and economic role within the French Republic. Today, she is widely remembered not just as a prominent local politician, but as a pioneering architect of sustainable island development, a formidable defender of the cultural and ecological heritage of Saint Pierre and Miquelon, and a powerful voice for the ocean in French national politics."])</script><script>self.__next_f.push([1,"21:[\"$\",\"$L6\",\"d7ce4a5c-e347-4ba5-9ef3-b0c0ae1f77c8\",{\"href\":\"/profiles/karine-claireaux\",\"className\":\"group flex flex-col bg-white border border-navy/5 shadow-sm hover:shadow-xl transition-all duration-500\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative aspect-[4/5] overflow-hidden\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/8/8d/Karine_Claireaux_2015_%28cropped%29.jpg\",\"alt\":\"Karine Claireaux\",\"className\":\"object-cover w-full h-full grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700\"}]}],[\"$\",\"div\",null,{\"className\":\"p-6\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"font-serif text-xl text-navy mb-2 group-hover:text-gold transition-colors\",\"children\":\"Karine Claireaux\"}],[\"$\",\"p\",null,{\"className\":\"text-navy/60 text-xs line-clamp-3 leading-relaxed mb-4\",\"children\":\"$2f\"}],\"$L30\"]}]]}]\n31:T33c2,"])</script><script>self.__next_f.push([1,"# Marc Plantegenest: A Pillar of Saint-Pierre and Miquelon\n\nMarc Plantegenest (1943–2026) was a towering figure in the political landscape of Saint-Pierre and Miquelon, France’s last remaining foothold in North America. Over a career spanning more than four decades, he served in nearly every major elected office available to a resident of the archipelago, including Deputy, Senator, Mayor of Saint-Pierre, and President of the General Council. His tenure was defined by a fierce commitment to the economic and political autonomy of the islands, particularly during periods of intense crisis such as the collapse of the cod fishery and the prolonged maritime border disputes with Canada. Through his pragmatic leadership and steadfast dedication, Plantegenest shaped the modern institutional framework of Saint-Pierre and Miquelon, ensuring its survival and cultural continuity in the face of profound geopolitical challenges. His advocacy for overseas autonomy often drew parallels with other prominent leaders in the French Overseas departments, such as Martinique's [Aimé Césaire](/profiles/aime-cesaire), who similarly fought for a distinct identity within the French Republic.\n\n### Early Life, Education, and the Maritime Tradition\n\nBorn on June 11, 1943, in Saint-Pierre, the bustling capital of the archipelago, Marc Plantegenest grew up steeped in the rich maritime heritage of the islands. Saint-Pierre and Miquelon, located just off the coast of Newfoundland, has always been inextricably linked to the sea. The archipelago was settled by French, Basque, Norman, and Breton fishermen, whose lives were dictated by the rhythms of the North Atlantic and the seasonal migrations of cod. Plantegenest’s early years were shaped by this environment, where the ocean was both the primary source of livelihood and a constant reminder of the islands' isolation from metropolitan France.\n\nGrowing up in the post-war era, Plantegenest witnessed the slow modernization of the islands. The local economy was almost entirely monochromatic, driven by the industrial fishing fleets that departed the harbor for the Grand Banks. Before dedicating his life to public service, Plantegenest worked as a civil servant in the local administration and also spent time working on cargo ships. This maritime experience provided him with a profound understanding of the everyday struggles faced by the local population. He witnessed firsthand the harsh conditions of the fishing industry, the dangers faced by the sailors, and the precarious nature of an economy completely dependent on a single marine resource.\n\n\u003e \"The sea is not merely our boundary; it is our history, our sustenance, and our destiny. To understand Saint-Pierre and Miquelon, one must first look to the ocean, for it is the ocean that has shaped our character.\"\n\nThese early experiences forged his political consciousness. He developed a deep-seated determination to diversify and protect the local economy, recognizing that reliance on cod was an economic vulnerability. Furthermore, his background as a civil servant equipped him with an intricate knowledge of the administrative complexities governing the relationship between the distant archipelago and the highly centralized French state in Paris.\n\n![Port of Saint-Pierre](https://upload.wikimedia.org/wikipedia/commons/4/4e/Saint-Pierre_et_Miquelon_-_Saint-Pierre.jpg)\n*The port of Saint-Pierre, the political and economic heart of the archipelago, whose future Plantegenest sought to secure.*\n\n### Historical Context: Saint-Pierre and Miquelon in Transition\n\nTo fully appreciate Plantegenest’s political contributions, one must understand the unique and often turbulent history of Saint-Pierre and Miquelon in the late 20th century. Following World War II, the islands transitioned from a colony to an Overseas Territory (Territoire d'outre-mer or TOM) in 1946. This status provided a degree of autonomy but also left the archipelago vulnerable to the shifting political priorities of Paris.\n\nIn 1976, the islands were reclassified as an Overseas Department (Département d'outre-mer or DOM), a move intended to integrate them more closely with France and provide access to European economic funds. However, this status proved ill-suited to the islands' unique economic and geographic realities. The strict application of metropolitan French laws to a tiny archipelago located in North America created widespread dissatisfaction, administrative friction, and a sense of alienation among the local population. It was akin to forcing a square peg into a round hole, ignoring the proximity to Canada and the specific needs of a small island community.\n\nIt was during this period of administrative flux that Plantegenest emerged as a prominent political voice. He recognized that the standard departmental model, designed for much larger and more populous overseas territories, stifled local initiative. His early political philosophy centered on finding a bespoke institutional framework that would grant the islands greater self-governance while maintaining their vital connection and financial support from the French Republic.\n\n### Rise to Political Prominence on the National Stage\n\nMarc Plantegenest’s formal entry into national politics occurred in 1978 when he was elected as the Deputy representing Saint-Pierre and Miquelon in the French National Assembly. Serving a critical term until 1981, he used this high-profile platform to advocate fiercely for the islands' interests in the corridors of power in Paris. He was known for his articulate and impassioned speeches, in which he repeatedly emphasized the strategic importance of the archipelago as France's only North American presence and the urgent need for targeted economic development.\n\nIn 1981, as the political winds in France shifted with the election of President François Mitterrand, Plantegenest transitioned to the upper house of the French Parliament, winning a hard-fought election as a Senator. His tenure in the Senate, which lasted from 1981 to 1986, coincided with a critical period of decentralization in French politics. The socialist government was open to restructuring regional powers, and Plantegenest seized this historic opportunity.\n\nHe worked tirelessly to push for legislative changes that would address the failures of the DOM status. His efforts, alongside other local leaders, culminated in the islands being reclassified as a Territorial Collectivity (Collectivité territoriale) in 1985. This new status struck a vital balance, providing the local government with enhanced powers over taxation, customs, urban planning, and economic development—precisely the kind of tailored autonomy Plantegenest had championed for years.\n\n### The Cod Crisis and the Fight for Economic Survival\n\nPerhaps the most defining and arduous chapter of Plantegenest’s career was his leadership during the devastating cod crisis of the late 1980s and early 1990s. Assuming the role of President of the General Council in 1984 (a position he held until 1994), he found himself at the epicenter of a bitter and protracted maritime border dispute between France and Canada, widely referred to as the \"Cod War.\"\n\nThe dispute centered on the delineation of the Exclusive Economic Zone (EEZ) surrounding Saint-Pierre and Miquelon. As both nations sought to assert control over the incredibly rich, though depleting, fishing grounds of the Grand Banks, tensions escalated dramatically. Canadian authorities began arresting French trawlers, and diplomatic relations frayed. The local fishing industry, the lifeblood of Saint-Pierre and Miquelon, was severely impacted by quotas and uncertainty.\n\n\u003e \"We are a small community, but our rights and our dignity cannot be traded away on the altar of international diplomacy. We must fight for every nautical mile, for it represents the very survival of our people and the legacy of our ancestors.\"\n\nThe situation reached a devastating climax in 1992 when an international arbitration tribunal based in New York drastically reduced the French EEZ around the islands. The ruling granted Saint-Pierre and Miquelon a narrow 200-nautical-mile corridor to international waters but severely curtailed their historical fishing rights in the broader, most productive areas of the Gulf of St. Lawrence and the Grand Banks. The decision was a catastrophic blow to the local economy, which had already been reeling from decades of overfishing and the impending Canadian moratorium on northern cod.\n\nIn the wake of this economic catastrophe, Plantegenest demonstrated remarkable resilience and strategic vision. He recognized that the archipelago could no longer rely solely on the traditional, industrial cod fishery. The era of the Grand Banks schooners and massive trawlers was over. Under his leadership, the General Council initiated a painful but absolutely necessary process of economic restructuring and diversification.\n\nHe spearheaded efforts to develop alternative industries, focusing heavily on niche tourism, highlighting the islands' unique French culture in North America. He championed aquaculture, the development of the local service sector, and sought to modernize the port infrastructure to attract new maritime business. Crucially, he aggressively negotiated extensive financial compensation and structural adjustment packages with the French state. These funds were vital to support displaced fishermen, fund early retirement, and create retraining programs for the youth. Although the transition was fraught with anxiety and political challenges, Plantegenest’s steadfast leadership prevented a total economic collapse and laid the groundwork for a more sustainable, diversified future.\n\n### Tenure as Mayor and Continued Institutional Reform\n\nAfter a decade of grueling leadership, Plantegenest stepped down as President of the General Council in 1994, but he remained deeply committed to public service. In December 1998, he shifted his focus to municipal governance and was elected Mayor of Saint-Pierre, serving until March 2001. As mayor, he brought his vast administrative experience to bear on local issues, focusing on urban renewal, infrastructure development, and improving the daily quality of life for the residents of the capital. He modernized municipal services, invested in public spaces, and initiated cultural programs that celebrated the islands' unique heritage.\n\nHowever, the call of broader territorial leadership proved too strong. In 2000, Plantegenest returned to the helm of the local government, once again serving as President of the General Council (which would later evolve into the Territorial Council) until 2005. During this second term, he continued his long-term project of economic diversification.\n\nMore importantly, he focused heavily on regional integration. He recognized that while Saint-Pierre and Miquelon was undeniably French in culture and administration, its geographic reality demanded closer economic, logistical, and cultural ties with the neighboring Canadian provinces—specifically Newfoundland and Labrador, Nova Scotia, and Quebec. He actively promoted cross-border cooperation in areas such as transportation, education exchange programs, and healthcare access, arguing that isolationism was the enemy of progress.\n\nHis expertise, deep institutional memory, and statesmanship were recognized once again in 2016, long after his formal retirement from elected office. Recognizing his unparalleled understanding of the territory's needs, the French Minister of Overseas Territories appointed him, along with a select group of experts, to coordinate proposals for the potential statutory evolution of Saint-Pierre and Miquelon's institutions. His final official contributions were instrumental in shaping the ongoing dialogue about the archipelago's constitutional relationship with the French Republic, ensuring that any future changes would respect the unique identity of the islands.\n\n### Legacy and Passing\n\nMarc Plantegenest passed away on May 6, 2026, at the age of 82, in the town of his birth, Saint-Pierre. His death marked the end of an era for the archipelago. Tributes poured in from across the political spectrum, both locally and in metropolitan France, reflecting the widespread respect he commanded. The French Senate formally acknowledged his passing, observing a moment of solemn tribute in honor of his decades of service to the Republic and to his island home.\n\nHis legacy is indelibly etched into the modern fabric of Saint-Pierre and Miquelon. He is remembered not merely as a prolific politician, but as a visionary statesman who navigated his homeland through its most perilous economic and existential crises of the 20th century. By championing a unique institutional status, driving painful but necessary economic diversification, and advocating for regional integration, he ensured that this small, isolated outpost of French culture could not only survive the collapse of its traditional economy but find a new, resilient path forward in the 21st century. His life and career stand as an enduring testament to the power of dedicated, pragmatic local leadership in the face of overwhelming global and environmental forces."])</script><script>self.__next_f.push([1,"22:[\"$\",\"$L6\",\"eb95fa84-eca8-4cfe-b35e-6c4f3b89cd8f\",{\"href\":\"/profiles/marc-plantegenest\",\"className\":\"group flex flex-col bg-white border border-navy/5 shadow-sm hover:shadow-xl transition-all duration-500\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative aspect-[4/5] overflow-hidden\",\"children\":[\"$\",\"img\",null,{\"src\":null,\"alt\":\"Marc Plantegenest\",\"className\":\"object-cover w-full h-full grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700\"}]}],[\"$\",\"div\",null,{\"className\":\"p-6\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"font-serif text-xl text-navy mb-2 group-hover:text-gold transition-colors\",\"children\":\"Marc Plantegenest\"}],[\"$\",\"p\",null,{\"className\":\"text-navy/60 text-xs line-clamp-3 leading-relaxed mb-4\",\"children\":\"$31\"}],\"$L32\"]}]]}]\n23:[\"$\",\"$L6\",\"1aea5783-f905-4784-8e7e-629be0481584\",{\"href\":\"/profiles/paul-lebailly\",\"className\":\"group flex flex-col bg-white border border-navy/5 shadow-sm hover:shadow-xl transition-all duration-500\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative aspect-[4/5] overflow-hidden\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/a/a9/St%C3%A9phane_Lenormand%2C_President_of_the_Territorial_Council_of_Saint-Pierre-et-Miquelon_-_2017_%28cropped%29.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail_unscaled\",\"alt\":\"Paul Lebailly\",\"className\":\"object-cover w-full h-full grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700\"}]}],[\"$\",\"div\",null,{\"className\":\"p-6\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"font-serif text-xl text-navy mb-2 group-hover:text-gold transition-colors\",\"children\":\"Paul Lebailly\"}],[\"$\",\"p\",null,{\"className\":\"text-navy/60 text-xs line-clamp-3 leading-relaxed mb-4\",\"children\":\"A long-serving Mayor and urban development leader.\"}],[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest font-bold text-navy group-hover:text-gold transition-colors\",\"children\":\"View Profile →\"}]]}]]}]\n33:T2129,"])</script><script>self.__next_f.push([1,"## Introduction\nNestled in the cold, fog-shrouded waters of the North Atlantic, the French archipelago of Saint Pierre and Miquelon has long been defined by its relationship with the sea. For centuries, the islands were the epicenter of the *grande pêche* (the Great Fishery), drawing fleets of brave sailors to harvest the abundant cod stocks of the Grand Banks. As the 20th century drew to a close, this centuries-old way of life faced an existential crisis due to the collapse of cod populations. Amidst this period of profound economic and cultural transition, Yvon Detcheverry emerged not only as a crucial civic leader but as an essential cultural guardian and de facto maritime historian for the community of Miquelon-Langlade. Through his roles as a dedicated educator, college director, and two-time mayor, Detcheverry championed the preservation of the islands' seafaring traditions, ensuring that the legacy of the Great Fishery would not be lost to the tides of modernization.\n\n![Miquelon-Langlade coastline](https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Miquelon_-_Le_Cap.jpg/800px-Miquelon_-_Le_Cap.jpg)\n\n## The Archipelago's Seafaring Roots\nTo understand the impact of Yvon Detcheverry, one must first understand the historical weight of the *grande pêche*. For generations, Saint Pierre and Miquelon served as the vital forward operating base for French fishing fleets in North America. The industry involved thousands of sailors, known affectionately and respectfully as *terre-neuvas* or *terre-neuviers*, who traveled from continental France and the archipelago itself to work in some of the most dangerous and turbulent waters on Earth. \n\nThe Great Fishery was an industrial marvel of its time, but it exacted a heavy toll in human lives. The men faced freezing temperatures, blinding fog, and ferocious Atlantic storms. The islands provided a strategic location for drying, processing, and trading the massive cod catch before it was shipped back to Europe. The entire culture of Saint Pierre and Miquelon—its songs, its vocabulary, its architecture, and its calendar—was dictated by the rhythms of the fishing seasons. When the cod stocks plummeted in the late 20th century, culminating in the devastating 1992 cod moratorium, the islands lost not just their primary economic engine, but the very core of their identity. It was in this fragile cultural landscape that Detcheverry's life work gained its most profound significance.\n\n## Early Life and Educational Career\nBorn into a community deeply intertwined with the sea, Yvon Detcheverry grew up listening to the tales of the *dory* men and the majestic schooners that once filled the harbors of Miquelon. The Detcheverry name is a cornerstone of Miquelon's civic history; the family has produced several prominent local leaders, including [Denis Detcheverry](/profiles/denis-detcheverry) and [Franck Detcheverry](/profiles/franck-detcheverry), both of whom also served as mayors of the commune. \n\nYvon, however, distinguished himself early on through his deep commitment to education and local history. Before his prominent political career, he served as a college director (principal) in Miquelon [1]. In this capacity, he was responsible for shaping the minds of the island's youth during a period when the traditional paths of entering the fishery were rapidly closing. Detcheverry recognized that if the younger generation could no longer participate in the *grande pêche*, they at least needed to understand the sacrifices and triumphs of their ancestors. \n\n\u003e \"To forget the sea is to forget who we are. Our ancestors built this community on the shifting waves, and it is our duty to anchor their memories in the minds of our children.\"\n\nAs an educator, Detcheverry functioned as a maritime historian in the most practical sense. He integrated local history into the communal consciousness, supporting genealogical research, local archives, and historical preservation projects. He ensured that the stories of the *Société des Œuvres de Mer*—which operated hospital ships like the *Saint-Yves* to provide medical and moral support to the fishermen—and the vital radio services like \"Radio Morue,\" were passed down [2].\n\n## Political Leadership: Mayor of Miquelon-Langlade\nYvon Detcheverry’s passion for his community naturally led him into the realm of local politics. He served two distinct and critical terms as the mayor of Miquelon-Langlade: first from 1977 to 1983, and later from 1996 to 2001 [3]. \n\nHis first term in the late 1970s and early 1980s was marked by efforts to modernize Miquelon's infrastructure while maintaining its unique, rustic charm. However, it was his second term (1996–2001) that truly defined his legacy as a guardian of the island's heritage. Detcheverry took office shortly after the cod moratorium had entirely decimated the local economy. The commune of Miquelon-Langlade, which includes the village of Miquelon and the connected, largely seasonal island of Langlade, was struggling to redefine itself. \n\nDuring this tumultuous period, Mayor Detcheverry faced the monumental task of guiding his constituents through an agonizing economic transition. He understood that economic diversification—whether through tourism, agriculture, or alternative fisheries—could only succeed if the community's pride and historical identity remained intact. Detcheverry actively supported municipal initiatives to preserve maritime artifacts, document oral histories, and maintain the historical sites of Miquelon village. He worked tirelessly to ensure that the transition away from the Great Fishery did not result in the erasure of the *terre-neuviers* from the public sphere.\n\n![Historic map of Saint Pierre and Miquelon](https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Saint_Pierre_and_Miquelon_map.png/800px-Saint_Pierre_and_Miquelon_map.png)\n\n## Preserving the Legacy of the Great Fishery\nWhile academic historians may publish volumes in university presses, Yvon Detcheverry’s brand of maritime history was lived, breathed, and actively preserved on the ground. He recognized that the history of the Great Fishery was not merely a series of dates and tonnage statistics, but a deeply human narrative of survival, camaraderie, and tragedy. \n\n\u003e \"The true history of the *grande pêche* is written in the saltwater that runs in the veins of the people of Miquelon.\"\n\nUnder his leadership and influence, community archives and local heritage groups found a steadfast ally. Detcheverry encouraged the collection of old photographs, ship logs, and personal correspondence from the fishing era. He was known for his active participation in local social and historical circles, frequently contributing his own memories and familial knowledge to genealogical and historical discussions. His support for the natural history and environmental conservation of the islands also reflected his holistic view of Miquelon's heritage—understanding that the land, the sea, and the people were inextricably linked.\n\nFurthermore, Detcheverry's tenure emphasized the importance of Miquelon-Langlade's unique geographical features, such as the *Isthme de Langlade* (the sand dunes connecting the two islands), which holds the wrecks of numerous ships that fell victim to the treacherous waters. By promoting the historical significance of these sites, he helped lay the groundwork for eco-tourism and heritage tourism, providing a new economic lifeline for the island while honoring its maritime past.\n\n## Legacy as a Cultural Guardian\nToday, Yvon Detcheverry is remembered not just as an administrator or an educator, but as a stabilizing force during one of the most volatile periods in Saint Pierre and Miquelon's history. When the cod disappeared and the schooners rotted at their moorings, it was leaders like Detcheverry who ensured that the spirit of the *terre-neuvas* endured. \n\nHis dual legacy—as a shaper of young minds in the classroom and a steady hand at the municipal helm—cemented his status as a cultural guardian. By integrating the harsh, beautiful truths of the Great Fishery into the educational and civic fabric of Miquelon, Yvon Detcheverry ensured that future generations of the archipelago will always know the price their ancestors paid to build a life on the edge of the Atlantic. His life is a testament to the fact that history is not only preserved in museums, but in the enduring pride and collective memory of a community."])</script><script>self.__next_f.push([1,"24:[\"$\",\"$L6\",\"8ebf3ae6-0418-4224-84c3-526730352d86\",{\"href\":\"/profiles/yvon-detcheverry\",\"className\":\"group flex flex-col bg-white border border-navy/5 shadow-sm hover:shadow-xl transition-all duration-500\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative aspect-[4/5] overflow-hidden\",\"children\":[\"$\",\"img\",null,{\"src\":null,\"alt\":\"Yvon Detcheverry\",\"className\":\"object-cover w-full h-full grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700\"}]}],[\"$\",\"div\",null,{\"className\":\"p-6\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"font-serif text-xl text-navy mb-2 group-hover:text-gold transition-colors\",\"children\":\"Yvon Detcheverry\"}],[\"$\",\"p\",null,{\"className\":\"text-navy/60 text-xs line-clamp-3 leading-relaxed mb-4\",\"children\":\"$33\"}],\"$L34\"]}]]}]\n"])</script><script>self.__next_f.push([1,"26:[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest font-bold text-navy group-hover:text-gold transition-colors\",\"children\":\"View Profile →\"}]\n28:[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest font-bold text-navy group-hover:text-gold transition-colors\",\"children\":\"View Profile →\"}]\n2a:[\"$\",\"span\",null,{\"className\":\"tex
