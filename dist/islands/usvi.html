artial law was declared. Over the course of the next few weeks, the rebellion was systematically suppressed. Hundreds of laborers were arrested, and dozens were summarily executed by firing squad.\n\nMathilda McBean, along with the other primary Queens, was arrested in late October 1878 [4]. The colonial authorities, recognizing the deep influence of these women, conducted extensive trials to determine the ringleaders of the revolt. The trials revealed the highly organized nature of the uprising and the central role played by the Queens. Mathilda and her co-conspirators were originally sentenced to death for their participation in the rebellion and arson [6]. However, the Danish Crown, wary of creating martyrs and facing international scrutiny, commuted the death sentences to life imprisonment with hard labor [1].\n\nIn 1882, Queen Mathilda, [Queen Mary](/profiles/queen-mary), and [Queen Agnes](/profiles/queen-agnes) were extradited to Denmark to serve their sentences [3]. They were incarcerated in the Christianshavn Women's Prison (*Kvindefængslet*) in Copenhagen [1]. The transition from the tropical climate of St. Croix to the damp, freezing cells of Copenhagen was incredibly harsh [6]. Despite the physical toll, historical records from the prison note that the Crucian women maintained a dignified and resilient demeanor, refusing to be broken by their captors.\n\n### Return and Final Years\n\nIn the late 1880s, facing growing public pressure in Denmark and persistent unrest in the Virgin Islands, the Danish government decided to commute the sentences of the surviving Fireburn leaders. In 1889, Queen Mathilda, along with [Queen Mary](/profiles/queen-mary) and [Queen Agnes](/profiles/queen-agnes), was allowed to return to St. Croix [3].\n\nUpon their return, they were met as heroes by the local population. However, the colonial authorities kept them under close surveillance, restricting their movement and preventing them from participating in any further labor organizing [1]. Mathilda McBean spent her remaining years in relative obscurity, working in agricultural labor but revered by her community as a living legend of the struggle for freedom. She passed away around 1899, marking the end of a life dedicated to the fight against colonial oppression.\n\n### Legacy and Commemoration\n\nThe legacy of Queen Mathilda and the Fireburn remains a cornerstone of the cultural identity of the U.S. Virgin Islands. In the decades following the revolt, the story of the Queens was kept alive through oral traditions, folk songs, and annual commemorations on Contract Day (October 1st).\n\nIn the 20th century, as the Virgin Islands witnessed the rise of modern civil rights leaders like [David Hamilton Jackson](/profiles/hamilton-jackson), the Fireburn was recognized as the foundational event in the island's labor movement. Modern political and civic leaders, including Governors [Alexander Farrelly](/profiles/alexander-farrelly) and [Cyril E. King](/profiles/cyril-king), have repeatedly highlighted the historical debt the territory owes to the 1878 rebels. Furthermore, cultural figures such as the musician [Alton Augustus Adams](/profiles/alton-adams) drew inspiration from the spirit of resistance that these Queens embodied. The \"Three Queens Fountain,\" a bronze monument located at Blackbeard's Castle in Charlotte Amalie, St. Thomas, stands as a permanent tribute to Queen Mathilda, [Queen Mary](/profiles/queen-mary), and [Queen Agnes](/profiles/queen-agnes) [7]. In recent years, the collaborative monument *I Am Queen Mary*, created by artists La Vaughn Belle and Jeannette Ehlers in Copenhagen, has further elevated the global recognition of these women, connecting the history of St. Croix to the broader dialogue on Danish colonial legacy and the African diaspora. Queen Mathilda's life serves as an enduring reminder that the fight for labor rights and human dignity is often led by the most marginalized, whose courage can shake the foundations of colonial power."])</script><script>self.__next_f.push([1,"24:[\"$\",\"$L6\",\"6308fdf3-8818-4403-8edd-05c62e91e809\",{\"href\":\"/profiles/queen-mathilda\",\"className\":\"group flex flex-col bg-white border border-navy/5 shadow-sm hover:shadow-xl transition-all duration-500\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative aspect-[4/5] overflow-hidden\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Luxembourg_-_La_Reine_Mathilde.jpg/960px-Luxembourg_-_La_Reine_Mathilde.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"alt\":\"Queen Mathilda\",\"className\":\"object-cover w-full h-full grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700\"}]}],[\"$\",\"div\",null,{\"className\":\"p-6\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"font-serif text-xl text-navy mb-2 group-hover:text-gold transition-colors\",\"children\":\"Queen Mathilda\"}],[\"$\",\"p\",null,{\"className\":\"text-navy/60 text-xs line-clamp-3 leading-relaxed mb-4\",\"children\":\"$30\"}],\"$L31\"]}]]}]\n25:[\"$\",\"$L6\",\"1b53f65f-4bf8-4f11-adc9-2f90e6e140a3\",{\"href\":\"/profiles/rothschild-francis\",\"className\":\"group flex flex-col bg-white border border-navy/5 shadow-sm hover:shadow-xl transition-all duration-500\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative aspect-[4/5] overflow-hidden\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/5/5c/Rothschild_Francis.png\",\"alt\":\"Rothschild Francis\",\"className\":\"object-cover w-full h-full grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700\"}]}],[\"$\",\"div\",null,{\"className\":\"p-6\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"font-serif text-xl text-navy mb-2 group-hover:text-gold transition-colors\",\"children\":\"Rothschild Francis\"}],[\"$\",\"p\",null,{\"className\":\"text-navy/60 text-xs line-clamp-3 leading-relaxed mb-4\",\"children\":\"A pivotal labor leader and civil rights activist.\"}],[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest font-bold text-navy group-hover:text-gold transition-colors\",\"children\":\"View Profile →\"}]]}]]}]\n"])</script><script>self.__next_f.push([1,"27:[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest font-bold text-navy group-hover:text-gold transition-colors\",\"children\":\"View Profile →\"}]\n29:[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest font-bold text-navy group-hover:text-gold transition-colors\",\"children\":\"View Profile →\"}]\n2b:[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest font-bold text-navy group-hover:text-gold transition-colors\",\"children\":\"View Profile →\"}]\n2d:[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest font-bold text-navy group-hover:text-gold transition-colors\",\"children\":\"View Profile →\"}]\n2f:[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest font-bold text-navy group-hover:text-gold transition-colors\",\"children\":\"View Profile →\"}]\n31:[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest font-bold text-navy group-hover:text-gold transition-colors\",\"children\":\"View Profile →\"}]\n"])</script></body></html>
