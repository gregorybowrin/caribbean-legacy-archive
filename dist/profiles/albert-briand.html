ey\":\"1hopcy\"}],[\"path\",{\"d\":\"M3 10h18\",\"key\":\"8toen8\"}]],\"className\":\"lucide-calendar h-4 w-4 text-gold mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Life Dates\"}],[\"$\",\"span\",null,{\"className\":\"text-sm font-semibold\",\"children\":[1908,\" – \",1965]}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M12 7v14\",\"key\":\"1akyts\"}],[\"path\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\",\"key\":\"ruj8y\"}]],\"className\":\"lucide-book-open h-4 w-4 text-navy/60 mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Areas of Influence\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2 mt-1\",\"children\":[[\"$\",\"$L6\",\"0\",{\"href\":\"/areas/politics\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Politics\"}],\"$L1b\"]}]]}]]}]]}]]}]]}],\"$L1c\"]}]}]]}]\n"])</script><script>self.__next_f.push([1,":HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/Saint-Pierre_and_Miquelon_on_the_globe_%28Americas_centered%29.svg/480px-Saint-Pierre_and_Miquelon_on_the_globe_%28Americas_centered%29.svg.png\",\"image\"]\n1b:[\"$\",\"$L6\",\"1\",{\"href\":\"/areas/history\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"History\"}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Albert Briand\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"A Territory at the Edge of Two Worlds\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[\"To understand \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Albert Joseph Briand\"}],\" is first to understand the singular world in which he was born and lived: \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"Saint-Pierre and Miquelon\"}],\", a tiny French archipelago clinging to the southwestern coast of Newfoundland, Canada, some twenty-five kilometres off the Grand Banks. Comprising the larger island of Miquelon-Langlade and the smaller but more densely inhabited Saint-Pierre, the territory is a geographical anomaly — a fragment of France planted in the North Atlantic, separated from metropolitan Paris by more than five thousand kilometres of ocean, yet retaining the language, law, currency, and cultural identity of the French republic with fierce tenacity.\"]}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":[\"The islands' history stretches back to the great age of Basque and Breton fishing fleets in the sixteenth century, when European mariners first discovered the extraordinary abundance of Atlantic cod on the Grand Banks. The Briand family itself embodied this deep rootedness: their earliest documented ancestors in Saint-Pierre dated to \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"1765\"}],\" [1], placing them among the archipelago's oldest settler families — men who had crossed the Atlantic in wooden vessels to pull cod from icy waters and build a French civilization at the very edge of the New World.\"]}],\"\\n\",[\"$\",\"p\",\"p-2\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/Saint-Pierre_and_Miquelon_on_the_globe_%28Americas_centered%29.svg/480px-Saint-Pierre_and_Miquelon_on_the_globe_%28Americas_centered%29.svg.png\",\"alt\":\"Map showing the location of Saint-Pierre and Miquelon in the North Atlantic, near Newfoundland\"}]}],\"\\n\",[\"$\",\"h3\",\"h3-1\",{\"children\":\"Early Life: Born Into Commerce and Cod\"}],\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\"]}]]}],\"$L36\",\"$L37\",false]}],\"$L38\"]}]\n"])</script><script>self.__next_f.push([1,"39:I[62682,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n3a:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Coat_of_arms_of_Saint-Pierre_and_Miquelon.svg/200px-Coat_of_arms_of_Saint-Pierre_and_Miquelon.svg.png\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1d:[\"$\",\"p\",\"p-3\",{\"children\":[\"Albert Joseph Briand was born on \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"August 5, 1909\"}],\", in the town of Saint-Pierre — the territorial capital, a compact settlement of colourful wooden houses clustered around a natural harbour that had served French fishermen for centuries. His birth year placed him at a moment when the cod economy that had sustained the islands for three centuries was beginning to show the first signs of the long, slow decline that would eventually reshape the archipelago entirely.\"]}]\n1e:[\"$\",\"p\",\"p-4\",{\"children\":\"The Saint-Pierre into which he was born was a merchant town first and foremost. The islands had virtually no agricultural land — Miquelon's marshy interior could sustain some sheep, but Saint-Pierre itself was essentially bare rock — and so the entire social and economic order revolved around the sea: catching cod, salting it, drying it, and shipping it to Catholic markets in southern Europe and the Caribbean. The merchant class, of which the Briand family was a part, occupied the commanding heights of this economy. They were the intermediaries between the fishermen who hauled the catch and the international markets that consumed it — factors of production who also served as bankers, employers, and landlords in the tight-knit island community.\"}]\n1f:[\"$\",\"p\",\"p-5\",{\"children\":[\"Albert Briand grew up within this world, absorbing its rhythms, its hierarchies, and its assumptions. He was educated in the local French system — the islands maintained French curricula and sent their most promising students to mainland France for higher education — and emerged as a young man of commercial acumen and civic ambition. By early adulthood he had established himself as a \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"merchant and businessman\"}],\", carrying forward the family's trading traditions while also developing a broader interest in public affairs.\"]}]\n20:[\"$\",\"h3\",\"h3-2\",{\"children\":\"The Pen and the Public Square: L'Écho des Îles\"}]\n21:[\"$\",\"p\",\"p-6\",{\"children\":[\"Beyond commerce, Briand possessed an intellectual dimension that found its outlet in journalism. He became the \",[\"$\",\"strong\",\"strong-0\",{\"children\":[\"editor of \",[\"$\",\"em\",\"em-0\",{\"children\":\"L'Écho des Îles Saint-Pierre-et-Miquelon\"}]]}],\" [1] [3], the territory's weekly publication and one of its primary organs of public discourse. In a community of only a few thousand souls, the newspaper editor was far more than a journalist — he was a shaper of opinion, a community archivist, and a political actor whose choices of coverage and commentary could tilt local debates. Through the pages of \",[\"$\",\"em\",\"em-0\",{\"children\":\"L'Écho des Îles\"}],\", Briand engaged with the full range of island concerns: the state of the fishing industry, relations with the metropolitan French government, the social welfare of workers and their families, and the complex political currents that periodically swept through the tiny territory.\"]}]\n22:[\"$\",\"p\",\"p-7\",{\"children\":\"This role as public intellectual positioned Briand squarely in the arena of local governance, and he would transition naturally from the press to formal political service.\"}]\n23:[\"$\",\"h3\",\"h3-3\",{\"children\":\"War,"])</script><script>self.__next_f.push([1," Occupation, and Political Peril\"}]\n24:[\"$\",\"p\",\"p-8\",{\"children\":[\"The defining crisis of Albert Briand's middle years arrived with the catastrophe of the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Second World War\"}],\". When France fell to Nazi Germany in June 1940, its overseas territories were placed in an agonizing position: to whom did they owe their allegiance — the Vichy regime that had assumed nominal governance of unoccupied France, or the Free French movement of General \",[\"$\",\"$L39\",\"a-0\",{\"slug\":\"charles-de-gaulle\",\"href\":\"/profiles/charles-de-gaulle\",\"children\":\"Charles de Gaulle\"}],\" operating from London?\"]}]\n25:[\"$\",\"p\",\"p-9\",{\"children\":[\"Saint-Pierre and Miquelon initially remained under the administrative authority associated with Vichy, a source of considerable anxiety to both Canada and the United States, who feared the islands' radio transmitters might be used to broadcast weather and convoy information to German submarines operating in the North Atlantic. The situation was resolved dramatically on \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"December 24, 1941\"}],\", when Free French naval forces under Admiral Émile Muselier seized the islands in a swift operation — an event that became known as the \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"\\\"St. Pierre Affair\\\"\"}],\" and generated a brief but sharp diplomatic storm between de Gaulle, President Roosevelt, and Prime Minister Churchill over the propriety of acting without Allied consent.\"]}]\n26:[\"$\",\"p\",\"p-10\",{\"children\":[\"The islands' population overwhelmingly welcomed liberation by the Free French. But for members of Saint-Pierre's established merchant and administrative elite who had been associated with the previous order, the transition brought personal danger. Albert Briand and his brother-in-law, the prominent figure \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Henri Claireaux\"}],\", were among those whose political positioning during the Vichy period drew scrutiny from the new Free French authorities. In \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"January 1944\"}],\", both men were \",[\"$\",\"strong\",\"strong-2\",{\"children\":\"arrested\"}],\" on charges related to their perceived \",[\"$\",\"strong\",\"strong-3\",{\"children\":\"anti-Gaullist\"}],\" stance [1] — a designation that in the febrile political climate of wartime France and its territories could carry severe consequences.\"]}]\n27:[\"$\",\"p\",\"p-11\",{\"children\":[\"The precise details of their detention and its resolution remain partially obscured in the historical record, though both men survived the war and re-emerged into public life. The experience, however, left an indelible mark on Briand's understanding of political power and its fragility — and likely contributed to the complexity of his subsequent relationship with his former brother-in-law Claireaux, with whom he would eventually become a \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"political adversary\"}],\" [1] despite their familial connection.\"]}]\n28:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[\"$\",\"em\",\"em-0\",{\"children\":\"In the small world of Saint-Pierre, political divisions cut across the deepest personal bonds — family connections offered no immunity from the ideological fractures of a world at war.\"}]}],\"\\n\"]}]\n29:[\"$\",\"h3\",\"h3-4\",{\"children\":\"Post-War Reconstruction and the Conseil Général\"}]\n2a:[\"$\",\"p\",\"p-12\",{\"children\":[\"The post-war settlement transformed the legal and political status of Saint-Pierre and Miquelon. Under the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Constitution of the Fourth Republic\"}],\" in \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"1946\"}],\", the islands were elevated from the status of colony to that of an \",[\"$\",\"strong\",\"strong-2\",{\"children\":\"overseas territory\"}],\" (\",[\"$\",\"em\",\"em-0\",{\"children\":\"territoire d'outre-mer\"}],\"), a change that granted the archipelago representation in the French National Assembly for the first time. This constitutional evolution opened new possibilities for political participation, and Albert Briand was well-positioned to exploit them.\"]}]\n2b:[\"$\",\"p\",\"p-13\",{\"child"])</script><script>self.__next_f.push([1,"ren\":[\"He rose to become a central figure in the territory's local governance, serving as \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"President of the Conseil Général\"}],\" (General Council) — the islands' primary legislative and administrative body — for two separate periods: from \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"February 1952 to November 1956\"}],\", and again from \",[\"$\",\"strong\",\"strong-2\",{\"children\":\"November 1964 to October 1966\"}],\" [3] [4]. These were years of significant transition for Saint-Pierre and Miquelon. The traditional cod fishery, which had sustained the islands for centuries, was undergoing industrialization — the first trawlers arrived in 1952, the same year Briand assumed his first presidency of the Conseil Général — and the French government was channelling increasing subsidies into the territory to prop up an economy that could no longer sustain itself through fishing alone.\"]}]\n2c:[\"$\",\"p\",\"p-14\",{\"children\":\"As president of the Conseil Général, Briand navigated these economic pressures while also overseeing the social infrastructure of the territory — its schools, its public services, its infrastructure — in a period when French metropolitan investment was transforming the physical landscape of Saint-Pierre. His role required not only administrative competence but skill as a broker between the territorial government and Paris, a task that demanded both a deep understanding of local needs and a sophisticated appreciation of metropolitan French political culture.\"}]\n2d:[\"$\",\"p\",\"p-15\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Coat_of_arms_of_Saint-Pierre_and_Miquelon.svg/200px-Coat_of_arms_of_Saint-Pierre_and_Miquelon.svg.png\",\"alt\":\"Coat of arms of Saint-Pierre and Miquelon, the French territory whose political life Albert Briand served for over two decades\"}]}]\n2e:[\"$\",\"h3\",\"h3-5\",{\"children\":\"Deputy to the National Assembly: Saint-Pierre's Voice in Paris\"}]\n2f:[\"$\",\"p\",\"p-16\",{\"children\":[\"The pinnacle of Albert Briand's public career came in \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"1962\"}],\", when he was elected as a \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"deputy to the French National Assembly\"}],\", representing Saint-Pierre and Miquelon [2]. He served in this capacity from 1962 until his death in 1966, becoming one of the overseas territory's most prominent voices in the corridors of Parisian power during the early years of the \",[\"$\",\"strong\",\"strong-2\",{\"children\":\"Fifth Republic\"}],\" — de Gaulle's new constitutional order, which had replaced the Fourth Republic in 1958.\"]}]\n30:[\"$\",\"p\",\"p-17\",{\"children\":\"The timing is notable for its historical irony. Briand, who had once been arrested for anti-Gaullist sympathies, now served as a deputy during the very presidency of de Gaulle himself. France's Fifth Republic was a dramatically centralized executive system that considerably reduced the role of the legislature compared to its predecessor, but the office of deputy remained symbolically vital for overseas territories like Saint-Pierre and Miquelon, whose interests could easily be ignored in the calculations of a metropolitan government focused on continental European affairs.\"}]\n31:[\"$\",\"p\",\"p-18\",{\"children\":[\"As deputy, Briand used his parliamentary platform to advocate for the fishing industry, for continued metropolitan investment in territorial infrastructure, and for the specific social and economic needs of one of France's most remote and smallest overseas constituencies. He served this role until his sudden death from a \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"heart attack on May 29, 1966\"}],\", in Saint-Pierre [2] — dying, as he had been born, in the town that had framed his entire existence.\"]}]\n32:[\"$\",\"blockquote\",\"blockquote-1\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[\"$\",\"em\",\"em-0\",{\"children\":\"\\\"Rue Albert Briand\\\" — a central street in Saint-Pierre — stands today as a quiet but permanent testimony to a man whose life was intertwined with the fate of that small archipelago.\"}]}],\"\\n\"]}]\n33:[\""])</script><script>self.__next_f.push([1,"$\",\"h3\",\"h3-6\",{\"children\":\"Legacy and Historical Assessment\"}]\n34:[\"$\",\"p\",\"p-19\",{\"children\":\"Albert Briand's life resists easy heroic narrative. He was a product of his class and his era — a merchant-politician whose public career unfolded against the backdrop of catastrophic world war, colonial transformation, and the slow structural decline of the industry that had given his islands their reason for being. His wartime arrest as an anti-Gaullist complicates any simple reading of his story, as does his later service during the Gaullist Fifth Republic. He was a man who contained contradictions, as most historically complex figures do.\"}]\n35:[\"$\",\"p\",\"p-20\",{\"children\":[\"What is beyond dispute is his sustained commitment to the governance and welfare of Saint-Pierre and Miquelon across more than two decades of public service. As editor of \",[\"$\",\"em\",\"em-0\",{\"children\":\"L'Écho des Îles\"}],\", as President of the Conseil Général (twice), and as deputy to the National Assembly, he gave voice to a tiny, remote community that might otherwise have remained invisible to the metropole. His family name — rooted in the archipelago since 1765 — remains part of the living geography of Saint-Pierre to this day, inscribed in the street that bears his memory in the heart of the town he served.\"]}]\n36:[\"$\",\"$L3a\",null,{\"title\":\"Learn about the legacy of Albert Briand\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/albert-briand\"}]\n3b:T4be,Albert Briand made lasting contributions to the governance and civic life of Saint-Pierre and Miquelon across three distinct domains. As editor of *L'Écho des Îles Saint-Pierre-et-Miquelon*, he shaped public discourse in the territory for years, serving as a vital conduit of information and opinion in one of France's most isolated overseas communities. As President of the Conseil Général during two periods (1952–1956 and 1964–1966), he oversaw the territory's local administration during a pivotal era of economic transition — from artisanal cod fishing to industrial trawling and increasing dependence on French metropolitan subsidies — managing the social and infrastructural investments that accompanied this shift. As a deputy to the French National Assembly (1962–1966), he gave Saint-Pierre and Miquelon a parliamentary voice in Paris during the early Fifth Republic, advocating for the fishing industry and the specific needs of a remote, small-population territory. His family's 260-year presence in the archipelago and his own multi-decade public career left an enduring mark on the islands' political culture, commemorated in the naming of Rue Albert Briand in the town of Saint-Pierre.37:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"$3b\"}]]}]\n"])</script><script>self.__next_f.push([1,"38:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"alt\":\"A.W. \\\"Art\\\" Saunders\",\"className\":\"w-full h-full object-cover\"}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"font-serif text-lg text-navy line-clamp-1\",\"children\":\"A.W. \\\"Art\\\" Saunders\"}],[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40\",\"children\":\"Turks \u0026 Caicos Islands\"}]]}]]}],[\"$\",\"$L6\",\"c0c62444-53a6-4e76-beb3-50dff472d653\",{\"href\":\"/profiles/adelaide-bernabela\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children
