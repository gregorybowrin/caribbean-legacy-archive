,{\"width\":\"18\",\"height\":\"18\",\"x\":\"3\",\"y\":\"4\",\"rx\":\"2\",\"key\":\"1hopcy\"}],[\"path\",{\"d\":\"M3 10h18\",\"key\":\"8toen8\"}]],\"className\":\"lucide-calendar h-4 w-4 text-gold mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Life Dates\"}],[\"$\",\"span\",null,{\"className\":\"text-sm font-semibold\",\"children\":[1922,\" – \",1944]}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M12 7v14\",\"key\":\"1akyts\"}],[\"path\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\",\"key\":\"ruj8y\"}]],\"className\":\"lucide-book-open h-4 w-4 text-navy/60 mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Areas of Influence\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2 mt-1\",\"children\":[[\"$\",\"$L6\",\"0\",{\"href\":\"/areas/history\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"History\"}],\"$L1b\"]}]]}]]}]]}]]}]]}],\"$L1c\"]}]}]]}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"$L6\",\"1\",{\"href\":\"/areas/civil-rights\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Civil Rights\"}]\n1d:T42d,, was an Aruban patriot, resistance fighter, and national hero who gave his life fighting against the Nazi occupation of the Netherlands during World War II [1]. Operating deep within the Dutch underground at a time when the swastika flew over Continental Europe, Ecury defied totalitarian fascism through daring acts of armed sabotage, weapons transport, the rescue of downed Allied pilots, and the protection of persecuted civilians and Jews living in hiding [2]. His dark complexion made him exceptionally conspicuous in wartime Holland, yet he refused to retreat to safety, repeatedly choosing frontline resistance over self-preservation. When finally betrayed by a collaborator in November 1944, he endured vicious Gestapo interrogation without breaking, going to his death before a German firing squad at the age of twenty-two with unwavering dignity. Today, Ecury stands as the foremost symbol of Aruban heroism, an immortal testament to the vital contributions of Afro-Caribbean people in the global struggle for human liberation and democratic sovereignty [3]."])</script><script>self.__next_f.push([1,"1c:[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Boy Ecury\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Introduction: The Caribbean Martyr of the Dutch Resistance\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[\"Segundo Jorge Adelberto Ecury (April 23, 1922 – November 6, 1944), universally known to history as \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Boy Ecury\"}],\"$1d\"]}],\"\\n\",[\"$\",\"h3\",\"h3-1\",{\"children\":\"Early Life and Aristocratic Roots in Oranjestad\"}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":\"Boy Ecury was born on April 23, 1922, in the historic Rancho neighborhood of Oranjestad, the capital of Aruba [1]. He was the seventh of thirteen children born to Nicasio Segundo \\\"Dundun\\\" Ecury and Ana Paulina Wilhelmina Ernst (affectionately known as Annie) [4]. The Ecury family was among the most prominent, prosperous, and socially distinguished Catholic merchant dynasties on the island [1]. Dundun Ecury was a visionary entrepreneur and civic leader who operated thriving trading ventures, automotive dealerships, and commercial real estate, earning widespread respect across the Dutch Caribbean [4].\"}],\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\",\"\\n\",\"$L37\",\"\\n\",\"$L38\",\"\\n\",\"$L39\",\"\\n\",\"$L3a\",\"\\n\",\"$L3b\",\"\\n\",\"$L3c\",\"\\n\",\"$L3d\",\"\\n\",\"$L3e\",\"\\n\",\"$L3f\",\"\\n\",\"$L40\",\"\\n\",\"$L41\",\"\\n\",\"$L42\",\"\\n\",\"$L43\",\"\\n\",\"$L44\",\"\\n\",\"$L45\",\"\\n\",\"$L46\",\"\\n\",\"$L47\",\"\\n\",\"$L48\"]}]]}],\"$L49\",\"$L4a\",false]}],\"$L4b\"]}]\n"])</script><script>self.__next_f.push([1,"4c:I[62682,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n4e:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/f/f6/Flag_of_Aruba.svg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1e:[\"$\",\"p\",\"p-2\",{\"children\":[\"The family estate in Rancho—a magnificent architectural complex blending neoclassical Dutch colonial architecture with Caribbean verandas and inner courtyards—served as a vibrant hub of intellectual discourse, familial solidarity, and cultural celebration [5]. Decades later, this historic family residence would be painstakingly restored and established as the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"National Archaeological Museum Aruba\"}],\" (\",[\"$\",\"em\",\"em-0\",{\"children\":\"Museo Arqueologico Nacional Aruba\"}],\"), permanently cementing the Ecury family name into the physical landscape of the capital [5].\"]}]\n1f:[\"$\",\"p\",\"p-3\",{\"children\":[\"Boy grew up surrounded by a large, close-knit, and exceptionally gifted circle of siblings, including his younger sister \",[\"$\",\"$L4c\",\"a-0\",{\"slug\":\"nydia-ecury\",\"href\":\"/profiles/nydia-ecury\",\"children\":\"Nydia Ecury\"}],\", who would later rise to international prominence as a groundbreaking poet, playwright, actress, and cultural champion of Papiamentu [6]. From an early age, Boy demonstrated a magnetic, charismatic personality, a deep moral compass shaped by his Catholic upbringing, and a fierce athletic spirit [7]. He was a competitive swimmer, a skilled equestrian, and an adventurous youth known for his innate generosity and irrepressible defense of anyone suffering unfair treatment [4].\"]}]\n20:[\"$\",\"p\",\"p-4\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/a/a9/Segundo_%28Boy%29_Ecury_%281922-1944%29.jpg\",\"alt\":\"Segundo 'Boy' Ecury (1922–1944), Dutch resistance hero from Aruba\"}]}]\n21:[\"$\",\"h3\",\"h3-2\",{\"children\":\"Transatlantic Education: The St. Louis Institute in Oudenbosch\"}]\n22:[\"$\",\"p\",\"p-5\",{\"children\":[\"Recognizing Boy's sharp intellect and leadership abilities, his father determined that he should pursue higher studies in the mother country. In 1937, at the age of fifteen, Boy sailed across the Atlantic Ocean with his brother to the Netherlands [1]. He enrolled as a boarding student at the prestigious \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Instituut Saint-Louis\"}],\" (St. Louis Institute) in Oudenbosch, a Catholic boarding school in the southern province of North Brabant operated by the Brothers of the Immaculate Conception of the Blessed Virgin Mary [4].\"]}]\n23:[\"$\",\"p\",\"p-6\",{\"children\":[\"Instituut Saint-Louis was celebrated throughout the Dutch-speaking world for its academic rigor, moral discipline, and extensive commercial curriculum [7]. Boy excelled in his studies, particularly in modern languages and commerce, earning his official business diploma (\",[\"$\",\"em\",\"em-0\",{\"children\":\"Handelsdiploma\"}],\") in early 1940 [1]. Beyond academics, he was a star athlete and an exceptionally popular figure on campus, admired by faculty and peers for his stylish dress, polished manners, and infectious wit [4].\"]}]\n24:[\"$\",\"p\",\"p-7\",{\"children\":\"Nevertheless, living in late-1930s provincial Holland presented steep social hurdles. As one of the few Black individuals residing in North Brabant, Boy encountered persistent racial curiosity and prejudice [2]. Rather than withdrawing or succumbing to bitterness, he met prejudice with commanding self-respect and athletic excellence, winning over classmates and forming enduring friendships [7]. It was during these student ye"])</script><script>self.__next_f.push([1,"ars that he met Luis de Lannoy, a fellow Dutch Caribbean student from Curaçao studying at the Catholic Economic University in nearby Tilburg [1]. Bound by their shared Caribbean identity, native language, and mutual worldview, Ecury and De Lannoy formed a brotherhood that would soon be tested in the crucible of war [8].\"}]\n25:[\"$\",\"h3\",\"h3-3\",{\"children\":\"The Shadow of Blitzkrieg and the Call to Arms\"}]\n26:[\"$\",\"p\",\"p-8\",{\"children\":\"On May 10, 1940, Nazi Germany launched a brutal, unprovoked invasion of the neutral Kingdom of the Netherlands [1]. Within days, the Luftwaffe obliterated the historic heart of Rotterdam in a devastating terror bombing, forcing the Dutch armed forces to capitulate to avoid further annihilation [2]. Queen Wilhelmina and the Dutch government-in-exile fled to London. In Aruba, the war transformed the island overnight into a vital strategic asset for the Allied cause, as its massive Lago Oil and Transport Company refinery supplied critical high-octane aviation fuel to the Royal Air Force during the Battle of Britain [9].\"}]\n27:[\"$\",\"p\",\"p-9\",{\"children\":[\"For Boy Ecury, the sudden invasion was a profound personal and geopolitical catastrophe. Transatlantic commercial shipping was abruptly severed, cutting off communication and financial wire transfers from his family in Oranjestad [4]. He was stranded in occupied Europe with no legal means of returning home. More significantly, Boy was appalled by the barbaric reality of the Nazi new order: the swift dismantling of Dutch democratic institutions, the introduction of discriminatory anti-Jewish decrees, the looting of national resources, and the arbitrary roundups of Dutch youth for forced labor (\",[\"$\",\"em\",\"em-0\",{\"children\":\"Arbeitseinsatz\"}],\") in German munitions factories [2].\"]}]\n28:[\"$\",\"p\",\"p-10\",{\"children\":\"Faced with the choice between docile compliance and clandestine rebellion, Boy did not hesitate. His Aruban upbringing, steeped in pride, freedom, and deep Catholic ethics, rendered passivity unthinkable [7]. Alongside his friend Luis de Lannoy, he made the perilous decision to join the Dutch underground resistance, dedicating his life and freedom to the liberation of the Netherlands [1].\"}]\n29:[\"$\",\"p\",\"p-11\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/f/f6/Flag_of_Aruba.svg\",\"alt\":\"The national flag of Aruba, symbolizing the island's enduring pride and freedom\"}]}]\n2a:[\"$\",\"h3\",\"h3-4\",{\"children\":\"Underground Warfare: Sabotage, Intelligence, and Papiamento Encryption\"}]\n2b:[\"$\",\"p\",\"p-12\",{\"children\":[\"Operating initially out of Tilburg and the neighboring town of Oisterwijk in North Brabant, Ecury linked up with local resistance cells affiliated with the \",[\"$\",\"em\",\"em-0\",{\"children\":\"Raad van Verzet\"}],\" (Council of Resistance or RVV) [10]. Ecury’s contributions to the underground were both audacious and technically sophisticated [1]. He was instrumental in manufacturing homemade incendiary phosphorus devices and improvised explosive timed charges [4]. Using these explosives, Boy and his comrades carried out devastating sabotage missions against German military infrastructure, setting fire to German Wehrmacht truck convoys, blowing up fuel storage depots, and severing critical telephone and telegraph communication lines [10].\"]}]\n2c:[\"$\",\"p\",\"p-13\",{\"children\":\"On multiple occasions, Boy participated in the derailment of German troop transports and military supply trains carrying heavy equipment toward the Atlantic Wall [1]. In addition to kinetic sabotage, he was deeply involved in weapons smuggling, transporting revolvers, Sten submachine guns, and ammunition beneath his coat through streets patrolled by armed German Feldgendarmerie [4]. He conducted reconnaissance missions, meticulously documenting the coordinates of German anti-aircraft batteries and coastal fortifications for transmission via clandestine radio operators to the Dutch government-in-exile and British intelligence in London [7].\"}]\n2d:[\"$\",\"p\",\"p-14\",{\"children\":[\"Boy also played an indispensable humanitarian role in "])</script><script>self.__next_f.push([1,"the underground network [2]. He participated in armed raids on municipal distribution offices to seize ration cards (\",[\"$\",\"em\",\"em-0\",{\"children\":\"distributiebonnen\"}],\") and blank identity papers, distributing them to Jews, political dissidents, and young Dutchmen living illegally in hiding (\",[\"$\",\"em\",\"em-1\",{\"children\":\"onderduikers\"}],\") [10]. He escorted Allied airmen whose planes had been shot down over the Low Countries, guiding them between secret safehouses and connecting them to clandestine escape lines leading south through Belgium and occupied France toward neutral Spain [4].\"]}]\n2e:[\"$\",\"p\",\"p-15\",{\"children\":[\"During these covert operations, Boy and Luis de Lannoy possessed a unique, impenetrable weapon: their mother tongue, Papiamento [8]. In crowded tramcars, railway waiting rooms, and public squares teeming with German soldiers and Dutch Nazi informants (\",[\"$\",\"em\",\"em-0\",{\"children\":\"NSB-ers\"}],\"), the two comrades openly discussed underground missions, drop locations, and security warnings in Papiamento [8]. The occupier’s intelligence officers were completely unable to decipher the creole language, mistaking it for an incomprehensible foreign dialect, allowing Boy and Luis to communicate with impunity in plain sight [8].\"]}]\n2f:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"In the lion's mouth, Boy Ecury fought with a courage that defied all earthly logic. His weapon was not merely the revolver in his pocket or the bomb on the railway track, but an unbreakable moral flame that no fascist occupier could extinguish.\\\" [7]\"}],\"\\n\"]}]\n30:[\"$\",\"h3\",\"h3-5\",{\"children\":\"The Conspicuous Rebel and the Net Closes\"}]\n31:[\"$\",\"p\",\"p-16\",{\"children\":[\"By 1944, the German occupation had descended into its most desperate and brutal phase. As Allied armies landed in Normandy and advanced toward Belgium, Nazi security services—including the \",[\"$\",\"em\",\"em-0\",{\"children\":\"Sicherheitspolizei\"}],\" (SiPo) and \",[\"$\",\"em\",\"em-1\",{\"children\":\"Sicherheitsdienst\"}],\" (SD)—unleashed a ferocious campaign of terror across the occupied Netherlands [2]. For Boy Ecury, the operational environment became unimaginably hazardous [4].\"]}]\n32:[\"$\",\"p\",\"p-17\",{\"children\":[\"Standing over six feet tall, exceptionally handsome, athletic, and possessed of dark Afro-Caribbean skin, Boy was impossible to blend into a crowd in a wartime Dutch city [1]. While other resistance fighters could disappear into a street crowd or alter their appearance with forged papers, Boy was recognized immediately wherever he went [4]. His comrades repeatedly begged him to go into deep hiding (\",[\"$\",\"em\",\"em-0\",{\"children\":\"onderduiken\"}],\") in a remote rural farmhouse until the imminent Allied liberation [7]. Boy categorically refused. He viewed hiding as an act of cowardice when his brothers-in-arms were risking their lives daily [4]. Instead, he continually changed aliases and relocated between underground safehouses in Oisterwijk, Delft, Rotterdam, and The Hague, operating as a core shock-trooper in the \",[\"$\",\"em\",\"em-1\",{\"children\":\"Landelijke Knokploegen\"}],\" (National Assault Groups or KP) [10].\"]}]\n33:[\"$\",\"p\",\"p-18\",{\"children\":\"In February 1944, catastrophe struck when his dearest friend and operational partner, Luis de Lannoy, was arrested by the Gestapo in Tilburg [1]. Shattered but resolute, Boy refused to abandon his friend. Demonstrating legendary audacity, Boy scouted the German prison and devised an armed raid to break De Lannoy out of his cell [1]. The rescue plan was foiled at the eleventh hour when German authorities abruptly reinforced the garrison and transferred De Lannoy to another detention facility in Utrecht [4]. Miraculously, De Lannoy survived brutal interrogations and remained imprisoned until the end of the war, but Boy was now operating without his trusted partner, haunted by the tightening net around him [8].\"}]\n34:[\"$\",\"h3\",\"h3-6\",{\"children\":\"Betrayal by Kees Bitter and the Oranjehotel\"}]\n35:[\"$\",\"p\",\"p-19\",{\"children\":[\"By the autumn of 1944, the Dutch underground in South Holland w"])</script><script>self.__next_f.push([1,"as severely compromised from within by one of the most infamous traitors in Dutch wartime history: Kees Bitter [11]. Bitter was a former member of the resistance who had been captured by the Sicherheitsdienst in Rotterdam [11]. Under threat of torture and execution, Bitter chose total collaboration, becoming a high-level \",[\"$\",\"em\",\"em-0\",{\"children\":\"Vertrauensmann\"}],\" (V-man or confidential informant) for the Gestapo [11]. Armed with intimate insider knowledge of resistance safe houses, drop locations, and passwords, Bitter systematically betrayed dozens of his former comrades to the Nazi executioners [11].\"]}]\n36:[\"$\",\"p\",\"p-20\",{\"children\":\"Bitter learned of Boy Ecury's presence and activities within the The Hague and Rotterdam Knokploegen cells [4]. On the morning of Sunday, November 5, 1944, Boy Ecury traveled through Rotterdam to attend Mass at the Saint Elisabeth Parish (H. Elisabeth Church) [1]. Boy was a devout Catholic whose faith provided him with immense spiritual solace amid the horrors of the occupation [4].\"}]\n37:[\"$\",\"p\",\"p-21\",{\"children\":\"As Boy stepped out of the church into the grey autumn air, he was ambushed by a waiting detachment of armed SD agents and German military police, directed to the exact location by Kees Bitter [1]. Boy was carrying concealed handguns and resistance materials in his overcoat [4]. Before he could draw his weapon, he was surrounded, overpowered, and wrestled to the pavement [1].\"}]\n38:[\"$\",\"p\",\"p-22\",{\"children\":[\"Boy was immediately transported under armed escort to the notorious Scheveningen penal prison on the outskirts of The Hague, widely known among the Dutch populace as the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"\\\"Oranjehotel\\\"\"}],\" (Orange Hotel) because so many patriots loyal to the House of Orange were locked inside its walls [12]. Boy was thrown into a concrete cell and subjected to grueling, violent interrogations by Gestapo and SD inquisitors [12]. The German officers were desperate to dismantle the KP networks operating in The Hague and Rotterdam before the Allied advance, and they subjected the young Aruban to severe physical torture [4].\"]}]\n39:[\"$\",\"p\",\"p-23\",{\"children\":\"Despite intense suffering, Boy Ecury remained utterly unshakeable. He refused to divulge a single name, address, code word, or weapons depot [1]. When his interrogators demanded that he confess and save himself by collaborating, Boy threw his defiance directly into their faces [4]. According to historical accounts preserved by fellow prisoners and his family, Boy declared:\"}]\n3a:[\"$\",\"blockquote\",\"blockquote-1\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"In the house of my father, there is no place for traitors.\\\" — Boy Ecury [4]\"}],\"\\n\"]}]\n3b:[\"$\",\"h3\",\"h3-7\",{\"children\":\"Execution on the Waalsdorpervlakte\"}]\n3c:[\"$\",\"p\",\"p-24\",{\"children\":\"Recognizing that no amount of torture would break his spirit, the German military court issued a swift summary death sentence [1]. Early the next morning, on Monday, November 6, 1944—less than twenty-four hours after his capture—Boy Ecury was led out of his cell in the Oranjehotel [12].\"}]\n3d:[\"$\",\"p\",\"p-25\",{\"children\":[\"He was taken into the windswept, barren sand dunes of the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Waalsdorpervlakte\"}],\", located in the Meijendel nature reserve north of The Hague [13]. The Waalsdorpervlakte served as the primary secret killing field for the Nazi security apparatus in the western Netherlands; between 1940 and 1945, over 250 Dutch resistance fighters, patriots, and hostages were executed by firing squads in these desolate dunes and dumped into unmarked mass graves [13].\"]}]\n3e:[\"$\",\"p\",\"p-26\",{\"children\":[\"As he was placed before the German firing squad, Boy Ecury maintained total poise and tranquility [4]. In a farewell letter to his loved ones, he conveyed his deep inner peace and religious conviction, expressing that he had performed noble and necessary work for humanity and that he would face his executioners \\\"with a smile on my lips\\\" (\",[\"$\",\"em\",\"em-0\",{\"children\":\"met een glimlach op de lippen\""])</script><script>self.__next_f.push([1,"}],\") [4]. He was executed by firing squad on the morning of November 6, 1944. He was just twenty-two years old [1].\"]}]\n3f:[\"$\",\"p\",\"p-27\",{\"children\":\"The betrayal of Boy Ecury and his comrades did not go unpunished. In January 1945, members of the Dutch underground tracked down the traitor Kees Bitter to a safehouse in Rotterdam; after a clandestine tribunal confirmed his treason, the resistance executed Bitter by poison and shooting, dumping his body into the peat waters of the Rotte river to eliminate any future threat of treachery [11].\"}]\n40:[\"$\",\"h3\",\"h3-8\",{\"children\":\"Repatriation, State Honors, and Eternal Memory\"}]\n41:[\"$\",\"p\",\"p-28\",{\"children\":\"In May 1945, the Netherlands was finally liberated by Canadian and Allied forces, bringing an end to the nightmare of Nazi occupation [2]. When news of Boy’s execution reached Aruba, the island was plunged into profound mourning, accompanied by immense communal pride in his extraordinary valor [4].\"}]\n42:[\"$\",\"p\",\"p-29\",{\"children\":\"In 1947, Dundun Ecury embarked on a solemn journey from Aruba to the Netherlands to recover his beloved son’s remains [1]. Working with Dutch forensic authorities and the Red Cross, Dundun traveled to the dunes of the Waalsdorpervlakte, where the mass graves were being excavated and the martyrs identified [4]. Dundun personally identified Boy’s remains, had his son’s body exhumed, and arranged for his repatriation across the ocean [1].\"}]\n43:[\"$\",\"p\",\"p-30\",{\"children\":[\"Boy Ecury’s body was transported home aboard a Dutch naval vessel, the \",[\"$\",\"em\",\"em-0\",{\"children\":\"Hr. Ms. Van Speijk\"}],\", receiving full military honors upon arrival in Aruban waters [4]. In April 1947, Aruba witnessed the largest and most emotional state funeral in its modern history [1]. Thousands of Aruban citizens, government officials, school children, and Dutch military detachments lined the streets of Oranjestad as a horse-drawn military caisson carried Boy’s flag-draped casket to the Catholic cemetery in Rancho, where he was laid to rest with full military honors [4].\"]}]\n44:[\"$\",\"p\",\"p-31\",{\"children\":\"In the decades following his sacrifice, Boy Ecury was immortalized across the Kingdom of the Netherlands and the Caribbean [1]:\"}]\n"])</script><script>self.__next_f.push([1,"45:[\"$\",\"ul\",\"ul-0\",{\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":[\"In 1984, the Dutch government posthumously conferred upon him the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Verzetsherdenkingskruis\"}],\" (Resistance Memorial Cross), the highest decoration for anti-Nazi underground resistance [1].\"]}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"In 1949, a majestic bronze statue of Boy Ecury was unveiled along Lloyd G. Smith Boulevard in Oranjestad by his grieving mother Annie and Governor Peters, standing today as a national landmark [14].\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":[\"A central public park in the capital was christened \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Parke Boy Ecury\"}],\", hosting national remembrance ceremonies every year on May 4 (National Remembrance Day / \",[\"$\",\"em\",\"em-0\",{\"children\":\"Dodeherdenking\"}],\") [14].\"]}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":[\"Dutch municipalities, recognizing his pivotal sacrifice, named streets in his honor, including \",[\"$\",\"em\",\"em-0\",{\"children\":\"Boy Ecurystraat\"}],\" in Amsterdam, Rotterdam, The Hague, Tilburg, and Oisterwijk [10].\"]}],\"\\n\",[\"$\",\"li\",\"li-4\",{\"children\":[\"His nephew, the author and filmmaker Ted Schouten, published the definitive biography \",[\"$\",\"em\",\"em-0\",{\"children\":\"Boy Ecury, een Antilliaanse jongen in het verzet\"}],\" in 1985 and produced an acclaimed documentary celebrating his life [4].\"]}],\"\\n\",[\"$\",\"li\",\"li-5\",{\"children\":[\"In 2003, legendary Dutch filmmaker Frans Weisz directed the feature film \",[\"$\",\"em\",\"em-0\",{\"children\":\"Boy Ecury\"}],\", starring Steve Leysner, which won multiple Golden Calf awards at the Netherlands Film Festival and introduced his story to a new generation [15].\"]}],\"\\n\"]}]\n"])</script><script>self.__next_f.push([1,"46:[\"$\",\"p\",\"p-32\",{\"children\":[\"Boy Ecury’s life and martyrdom shattered colonial stereotypes of passive colonial subjects [3]. He proved that the defense of human freedom knows no geographic, ethnic, or racial boundaries. Alongside cultural titans like \",[\"$\",\"$L4c\",\"a-0\",{\"slug\":\"nydia-ecury\",\"href\":\"/profiles/nydia-ecury\",\"children\":\"Nydia Ecury\"}],\" and \",[\"$\",\"$L4c\",\"a-1\",{\"slug\":\"rufo-wever\",\"href\":\"/profiles/rufo-wever\",\"children\":\"Rufo Wever\"}],\", and political icons like \",[\"$\",\"$L4c\",\"a-2\",{\"slug\":\"betico-croes\",\"href\":\"/profiles/betico-croes\",\"children\":\"Betico Croes\"}],\" and \",[\"$\",\"$L4c\",\"a-3\",{\"slug\":\"shon-a-eman\",\"href\":\"/profiles/shon-a-eman\",\"children\":\"Jan Hendrik Albert \\\"Shon A\\\" Eman\"}],\", Boy Ecury remains an eternal beacon of Aruban dignity, whose ultimate sacrifice illuminated the darkest hours of modern human history [3].\"]}]\n47:[\"$\",\"h3\",\"h3-9\",{\"children\":\"References\"}]\n4d:T44e,, Zutphen: Walburg Pers, 1985 / 2003.\n[5] National Archaeological Museum Aruba (MANA), \"The Historic Ecury Family Complex in Oranjestad.\"\n[6] Rutgers, Wim, \"De Caribische jeugdliteratuur van Nydia Ecury,\" Werkgroep Caraïbische Letteren.\n[7] Government of Aruba (Gobierno di Aruba), \"Boy Ecury: Heroe di nos Pais,\" Official Historical Archives.\n[8] Through Their Eyes War Memorial Foundation, \"Luis de Lannoy and Boy Ecury: Resistance in Papiamento.\"\n[9] Lago Colony Historical Archives, \"The Defense of Aruba and the Lago Refinery in World War II.\"\n[10] Erfgoed Brabant / Geheugen van Tilburg, \"Verzetsgroepen in Oisterwijk en Tilburg: De rol van Boy Ecury.\"\n[11] Oorlogsbronnen, \"Het verraad van Kees Bitter en de val van de Knokploegen.\"\n[12] Nationaal Monument Oranjehotel, \"Gevangenen van het Oranjehotel: Segundo Jorge Adelberto Ecury.\"\n[13] Erepeloton Waalsdorpervlakte, \"De Gevallenen op de Waalsdorpervlakte 1940–1945.\"\n[14] VisitAruba Historical Monuments, \"Monuments of Oranjestad: The Boy Ecury Memorial.\"\n[15] Nederlands Film Festival (NFF), \"Boy Ecury (2003) - Directed by Frans Weisz.\"48:[\"$\",\"p\",\"p-33\",{\"children\":[\"[1] Wikipedia Contributors, \\\"Boy Ecury,\\\" Wikipedia, The Free Encyclopedia.\\n[2] Verzetsmuseum Amsterdam, \\\"De Tweede Wereldoorlog en de Nederlandse Antillen.\\\"\\n[3] Oostindie, Gert, \",[\"$\",\"em\",\"em-0\",{\"children\":\"Het paradijs overzee: De 'Nederlandse' Caraïben en Nederland\"}],\", Amsterdam: Bert Bakker.\\n[4] Schouten, Ted, \",[\"$\",\"em\",\"em-1\",{\"children\":\"Boy Ecury, een Antilliaanse jongen in het verzet\"}],\"$4d\"]}]\n49:[\"$\",\"$L4e\",null,{\"title\":\"Learn about the legacy of Boy Ecury\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/boy-ecury\"}]\n4f:T57b,"])</script><script>self.__next_f.push([1,"Boy Ecury made profound and historic contributions to both the Dutch anti-Nazi resistance during World War II and the national consciousness of Aruba. Operating at immense personal risk as a conspicuous Afro-Caribbean youth in occupied Europe, Ecury executed daring sabotage operations against German military rail lines, fuel dumps, and troop transports, while simultaneously smuggling arms, gathering tactical military intelligence, and manufacturing explosive devices for the *Raad van Verzet* and *Landelijke Knokploegen*. His vital humanitarian work in procuring forged documents and ration cards saved dozens of Jewish families and political dissidents from deportation, while his clandestine network guided downed Allied aviators along escape lines back to freedom.\n\nHis enduring legacy transcends military action; Ecury's supreme sacrifice at the age of twenty-two—enduring Gestapo torture at the Oranjehotel without betraying a single comrade before facing a firing squad on the Waalsdorpervlakte—elevated him into a foundational symbol of Caribbean valor, moral integrity, and anti-fascist commitment. His posthumous repatriation with full military honors in 1947 galvanized Aruban national pride, proving that Caribbean people played a direct, courageous role in the liberation of Europe and cementing his status as Aruba's premier national hero and an immortal icon of universal freedom."])</script><script>self.__next_f.push([1,"4a:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"$4f\"}]]}]\n"])</script><script>self.__next_f.push([1,"4b:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"alt\":\"A.W. \\\"Art\\\" Saunders\",\"className\":\"w-full h-full object-cover\"}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"font-serif text-lg text-navy line-clamp-1\",\"children\":\"A.W. \\\"Art\\\" Saunders\"}],[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40\",\"children\":\"Turks \u0026 Caicos Islands\"}]]}]]}],[\"$ cury\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Caribbean Legacy Archive\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"https://upload.wikimedia.org/wikipedia/commons/a/a9/Segundo_%28Boy%29_Ecury_%281922-1944%29.jpg\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Boy Ecury\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"profile\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Boy Ecury\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"### Introduction: The Caribbean Martyr of the Dutch Resistance\\n\\nSegundo Jorge Adelberto Ecury (April 23, 1922 – November 6, 1944), universally know...\"}],[\"$\",\"meta\",\"15\",{\"name\":\"twitter:image\",\"content\":\"https://upload.wikimedia.org/wikipedia/commons/a/a9/Segundo_%28Boy%29_Ecury_%281922-1944%29.jpg\"}],[\"$\",\"link\",\"16\",{\"rel\":\"icon\",\"href\":\"/favicon.ico?favicon.2vob68tjqpejf.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"$L50\",\"17\",{}]]\n"])</script></body></html>
