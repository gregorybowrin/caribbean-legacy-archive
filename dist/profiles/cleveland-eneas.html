\"height\":\"18\",\"x\":\"3\",\"y\":\"4\",\"rx\":\"2\",\"key\":\"1hopcy\"}],[\"path\",{\"d\":\"M3 10h18\",\"key\":\"8toen8\"}]],\"className\":\"lucide-calendar h-4 w-4 text-gold mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Life Dates\"}],[\"$\",\"span\",null,{\"className\":\"text-sm font-semibold\",\"children\":[1913,\" – \",1994]}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M12 7v14\",\"key\":\"1akyts\"}],[\"path\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\",\"key\":\"ruj8y\"}]],\"className\":\"lucide-book-open h-4 w-4 text-navy/60 mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Areas of Influence\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2 mt-1\",\"children\":[\"$L1b\",\"$L1c\"]}]]}]]}]]}]]}]]}],\"$L1d\"]}]}]]}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"$L6\",\"0\",{\"href\":\"/areas/literature\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Literature\"}]\n1c:[\"$\",\"$L6\",\"1\",{\"href\":\"/areas/culture\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Culture\"}]\n"])</script><script>self.__next_f.push([1,"1d:[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Dr. Cleveland Eneas\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Introduction\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[\"Dr. Cleveland Wilmore Eneas Sr. (July 5, 1915 – 1995) was a pioneering Bahamian dentist, author, senator, and cultural historian whose multi-faceted career and literary works left an enduring mark on the social, cultural, and political landscape of The Bahamas. As the first Black Bahamian dentist and the country's first Dental Registrar, Eneas broke through racial barriers in a colonial society dominated by a white minority elite. His dental practice in Nassau became a cornerstone of the community, offering professional care and mentorship to generations. Beyond his clinical achievements, Eneas was a profound cultural advocate who dedicated much of his life to documenting and celebrating the African heritage of the Bahamian people. His landmark 1976 book, \",[\"$\",\"em\",\"em-0\",{\"children\":\"Bain Town\"}],\", is a seminal work of Caribbean historical literature, offering a rich, first-hand account of the Yoruba ancestry and community life in one of Nassau’s historic \\\"Over-the-Hill\\\" settlements. Through his writing, public service as a senator, and leadership in civic organizations like the Kiwanis Club, Eneas championed the dignity, self-reliance, and cultural pride of Black Bahamians, ensuring that their history would be written by their own hands.\"]}],\"\\n\",[\"$\",\"h3\",\"h3-1\",{\"children\":\"The Yoruba Ancestry and Bain Town\"}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":\"To understand the life and work of Cleveland Eneas, one must look to his deep ancestral roots in West Africa. His great-grandfather, Briton Eneas, was born in Yorubaland (in modern-day Nigeria) around the year 1818 [1]. At the age of twelve, Briton was kidnapped by slave traders and loaded onto a vessel destined for the plantations of the Americas. However, the transatlantic slave trade had been declared illegal by the British Parliament in 1807, and the British Royal Navy's West Africa Squadron actively patrolled the Atlantic to intercept illicit slave ships.\"}],\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\",\"\\n\",\"$L37\",\"\\n\",\"$L38\",\"\\n\",\"$L39\",\"\\n\",\"$L3a\",\"\\n\",\"$L3b\"]}]]}],\"$L3c\",\"$L3d\",false]}],\"$L3e\"]}]\n"])</script><script>self.__next_f.push([1,"3f:I[62682,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n40:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/e/ea/Ceiba_Nassau_1900.jpg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/9/93/Flag_of_the_Bahamas.svg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1e:[\"$\",\"p\",\"p-2\",{\"children\":\"The ship carrying Briton was captured by a British cruiser, and the liberated Africans on board were brought to Nassau, the capital of the Bahamian colony, around 1831 [1]. Under the colonial administration's apprenticeship system, these \\\"liberated Africans\\\" were bound to local employers for a set period to learn a trade and integrate into the colonial society. Briton was apprenticed and eventually settled in the area south of Nassau's ridge, which came to be known as Bain Town (named after Charles H. Bain, a local landowner).\"}]\n1f:[\"$\",\"p\",\"p-3\",{\"children\":[\"Bain Town and the adjacent Grants Town were populated by thousands of liberated Africans from various ethnic groups, including the Yoruba, Congo, and Ebo (Igbo). Among these, the Yoruba community was particularly strong and cohesive. They established self-governing friendly societies, lodges, and rotating savings systems known as \",[\"$\",\"em\",\"em-0\",{\"children\":\"Asue\"}],\" (derived from the Yoruba \",[\"$\",\"em\",\"em-1\",{\"children\":\"esusu\"}],\") to support one another in times of illness, death, or economic hardship [2]. They maintained their language, religious traditions (often syncretized with Christian denominations), and cultural customs.\"]}]\n20:[\"$\",\"p\",\"p-4\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/e/ea/Ceiba_Nassau_1900.jpg\",\"alt\":\"A historic silk cotton tree in Nassau, photographed in 1900, representing the historic landscape of Bain Town where Dr. Cleveland Eneas Sr. was born and raised.\"}]}]\n21:[\"$\",\"p\",\"p-5\",{\"children\":\"Briton Eneas married Amelia Butten, and they had one son [1]. This son eventually fathered nine sons, one of whom was William Wilmore V. Eneas (W.V. Eneas), who became a prominent minister and Bishop in the Church of God in The Bahamas [1]. Cleveland Wilmore Eneas was born to Bishop W.V. Eneas and his wife, Arabella Ferguson-Eneas, on July 5, 1915, in the heart of Bain Town [3]. Growing up in this vibrant neighborhood, Cleveland was immersed in the oral histories, cultural pride, and communal solidarity of the Yoruba descendants.\"}]\n22:[\"$\",\"h3\",\"h3-2\",{\"children\":\"Youth, Education, and Tuskegee Institute\"}]\n23:[\"$\",\"p\",\"p-6\",{\"children\":\"Cleveland Eneas, affectionately known as \\\"Cleve,\\\" began his education in the public schools of Nassau, attending the Boys Central School, Western Senior, and the historic Government High School [3]. As a young man coming of age in the 1920s and 1930s, Eneas experienced the strict social stratification of colonial Bahamas, where secondary education was a privilege reserved for a select few, and career paths for ambitious Black youths were severely restricted.\"}]\n24:[\"$\",\"p\",\"p-7\",{\"children\":\"Recognizing his academic promise, his family supported his move to the United States at the age of sixteen to pursue higher education [3]. In 1931, Eneas enrolled at the Tuskegee Institute in Alabama, the world-renowned historically Black institution founded by Booker T. Washington. Tuskegee's educational philosophy emphasized self-reliance, vocational proficiency, and academic excellence.\"}]\n25:[\"$\",\"p\",\"p-8\",{\"children\":\"At Tuskegee, Eneas:\"}]\n26:[\"$\",\"ul\",\"ul-0\",{\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"child"])</script><script>self.__next_f.push([1,"ren\":\"Completed his high school education.\"}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":\"Trained in the trade of printing, which instilled in him a lifelong appreciation for the written word and publishing.\"}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":\"Studied the violin, developing a passion for classical music.\"}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":\"Earned a Bachelor of Science (B.S.) degree in 1937 [3].\"}],\"\\n\"]}]\n27:[\"$\",\"p\",\"p-9\",{\"children\":\"The experience of living in the American South during the height of the Jim Crow era of racial segregation profoundly shaped Eneas's worldview, reinforcing his commitment to racial solidarity and social justice.\"}]\n28:[\"$\",\"h3\",\"h3-3\",{\"children\":\"Meharry Medical College and Academic Career\"}]\n29:[\"$\",\"p\",\"p-10\",{\"children\":\"Following his graduation from Tuskegee, Eneas was accepted into Meharry Medical College in Nashville, Tennessee, one of the premier institutions for training Black medical and dental professionals in the United States. He graduated in 1941 with a Doctor of Dental Surgery (D.D.S.) degree [3]. Instead of immediately returning home, Dr. Eneas joined the faculty at Meharry, where he taught gross anatomy and oral surgery for five years, gaining valuable academic and clinical experience [3].\"}]\n2a:[\"$\",\"h3\",\"h3-4\",{\"children\":\"Pioneering Dental Practice in a Segregated Bahamas\"}]\n2b:[\"$\",\"p\",\"p-11\",{\"children\":\"In 1947, Dr. Eneas returned to Nassau to establish his professional practice [3]. The Bahamas in 1947 was a colony on the brink of significant political change, but it was still dominated by a small, white mercantile elite known as the \\\"Bay Street Boys,\\\" who controlled the legislature through the United Bahamian Party (UBP). The medical and dental professions were exclusively white, and Black Bahamians had virtually no access to dental care from practitioners of their own race.\"}]\n2c:[\"$\",\"p\",\"p-12\",{\"children\":\"Dr. Eneas's return was a historic milestone: he became the first Black Bahamian dentist to practice in the colony [3]. He set up his private clinic in Nassau, providing high-quality dental care to the Black majority who had long been marginalized. His presence was a powerful symbol of professional achievement and Black capability. The colonial government also appointed him as the country's first Dental Registrar, placing him in charge of the official register of licensed dental practitioners in the islands [3].\"}]\n2d:[\"$\",\"p\",\"p-13\",{\"children\":\"For decades, Dr. Eneas operated his practice, mentoring younger Bahamians who wished to enter the medical and dental fields. His son, Cleveland W. Eneas Jr. (known as \\\"Fritzi\\\"), would eventually graduate from Meharry Medical College in 1969 and join his father's practice, continuing the family's dental legacy [4].\"}]\n2e:[\"$\",\"h3\",\"h3-5\",{\"children\":\"Senate Service and Civic Leadership\"}]\n2f:[\"$\",\"p\",\"p-14\",{\"children\":\"Dr. Eneas was a firm believer in civic duty and community development. He was a charter member of the Kiwanis Club of Nassau, which was founded in 1962 as the first Kiwanis club established outside of the United States and Canada [5]. He served as the club's President from 1969 to 1970 and later as a Lieutenant Governor of the organization, promoting community service and youth development [5].\"}]\n30:[\"$\",\"p\",\"p-15\",{\"children\":\"He was also deeply involved in the economic empowerment of Black Bahamians. He served on the board of directors of the People's Penny Savings Bank Limited, an institution founded by Black leaders to provide savings and loan services to citizens who were routinely denied credit by the white-controlled commercial banks [3].\"}]\n31:[\"$\",\"p\",\"p-16\",{\"children\":[\"Politically, Eneas was appointed to the Senate, the Upper Chamber of the Bahamian Parliament, where he contributed to the legislative process during the transition to Majority Rule in 1967 and national independence in 1973 under the Progressive Liberal Party (PLP) led by \",[\"$\",\"$L3f\",\"a-0\",{\"slug\":\"lynden-pindling\",\"href\":\"/profiles/lynden-pindling\",\"children\":\"Lynden Pindling\"}],\". He also served on various school boards and "])</script><script>self.__next_f.push([1,"public committees, advocating for educational reforms and the expansion of secondary schooling.\"]}]\n32:[\"$\",\"h3\",\"h3-6\",{\"children\":\"Literary Contribution and Cultural Historiography\"}]\n33:[\"$\",\"p\",\"p-17\",{\"children\":\"In the latter part of his life, Dr. Eneas turned his attention to writing, producing several books that secured his reputation as one of the Bahamas' foremost cultural historians and storytellers.\"}]\n34:[\"$\",\"p\",\"p-18\",{\"children\":[\"His most significant work, \",[\"$\",\"em\",\"em-0\",{\"children\":\"Bain Town\"}],\", was published in 1976 [6]. The book is a rich blend of family memoir, community history, and ethnographic study:\"]}]\n35:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"Bain Town was a place of love, where we looked out for one another, and where our African roots were not a source of shame, but a foundation of our strength.\\\" [6]\"}],\"\\n\"]}]\n36:[\"$\",\"p\",\"p-19\",{\"children\":[\"In \",[\"$\",\"em\",\"em-0\",{\"children\":\"Bain Town\"}],\", Eneas documented the survival of Yoruba language, religious beliefs, and social organizations in Nassau. He described the neighborhood's cooperative economic systems, such as the \",[\"$\",\"em\",\"em-1\",{\"children\":\"Asue\"}],\", and the vital role of the local churches and lodges in maintaining social order and providing mutual aid. The book challenged the dominant colonial historical narratives that ignored or dismissed the African heritage of the Bahamian majority.\"]}]\n37:[\"$\",\"p\",\"p-20\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/9/93/Flag_of_the_Bahamas.svg\",\"alt\":\"The National Flag of the Bahamas, representing the independent nation Dr. Eneas helped build through his civic and professional leadership.\"}]}]\n38:[\"$\",\"p\",\"p-21\",{\"children\":[\"His second book, \",[\"$\",\"em\",\"em-0\",{\"children\":\"Tuskegee Ra! Ra!\"}],\", published in 1982, was an autobiographical account of his years at the Tuskegee Institute, describing the humor, challenges, and triumphs of his youth in the American South [3]. In 1990, he published \",[\"$\",\"em\",\"em-1\",{\"children\":\"Let The Church Roll On\"}],\", which detailed the religious traditions and social history of the Church of God and other non-conformist denominations in The Bahamas [3].\"]}]\n39:[\"$\",\"h3\",\"h3-7\",{\"children\":\"Family Legacy and Lasting Recognition\"}]\n3a:[\"$\",\"p\",\"p-22\",{\"children\":\"Dr. Cleveland Eneas Sr. passed away in Nassau in 1995 at the age of eighty [2]. His death marked the end of a long life dedicated to the advancement of his people. He was married to Muriel Frazier Eneas, a distinguished educator and retired headmistress of the Government High School [3]. Together, they raised three children who all achieved prominence in the medical field: Dr. Cleveland \\\"Fritzi\\\" Eneas Jr. (dentist), Dr. Judson Frazier Eneas (nephrologist who established the first dialysis unit in the Bahamas), and Dr. Agreta Eneas-Carey (family physician) [5].\"}]\n3b:[\"$\",\"p\",\"p-23\",{\"children\":[\"In 1998, the Bahamian government honored his lifetime of service by renaming the East Street Primary School in Nassau to the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Cleveland Eneas Primary School\"}],\" [3]. Today, his writings remain essential reading for anyone seeking to understand the African roots of Bahamian society, and his life stands as a testament to the power of education, professional excellence, and cultural preservation.\"]}]\n3c:[\"$\",\"$L40\",null,{\"title\":\"Learn about the legacy of Dr. Cleveland Eneas\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/cleveland-eneas\"}]\n41:T43c,Dr. Cleveland Wilmore Eneas Sr. was a pioneering medical professional, cultural historian, and civic leader who broke racial barriers in pre-independence Bahamas. As the first Black Bahamian dentist and the country's first Dental Registrar, Eneas established a highly successful private practice in Nassau in 1947, providing accessible, professional healthcare to the Black majority in a segregated society. He mentored many young Bahamians entering healthcare, creating a lineage of medical professionals that includes his three children"])</script><script>self.__next_f.push([1,". Beyond healthcare, Eneas made profound contributions to Bahamian historical and cultural literature. His seminal 1976 book, *Bain Town*, documented the Yoruba ancestry, language, and communal institutions of Nassau's liberated African settlements, challenging eurocentric colonial narratives and instilling cultural pride in Black Bahamians. As a Senator, board member of the People's Penny Savings Bank, and President of the Kiwanis Club of Nassau, Eneas also championed economic self-reliance and community development for the Black majority.3d:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"$41\"}]]}]\n"])</script><script>self.__next_f.push([1,"3e:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"alt\":\"A.W. \\\"Art\\\" Saunders\",\"className\":\"w-full h-full object-cover\"}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"font-serif text-lg text-navy line-clamp-1\",\"children\":\"A.W. \\\"Art\\\" Saunders\"}],[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40\",\"children\":\"Turks \u0026 Caicos Islands\"}]]}]]}],[\"$\",\"$L6\",\"c0c62444-53a6-4e76-beb3-50dff472d653\",{\"href\":\"/profiles/adelaide-bernabela\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"div\",null,{\"className\":\"flex items-center justify-center font-bold text-white shadow-lg bg-gradient-to-br from-slate-700 to-slate-500 text-xl w-fu
