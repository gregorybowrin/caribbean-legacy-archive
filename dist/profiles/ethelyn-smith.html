5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Ethelyn Smith\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Introduction: A Matriarch of Virgin Islands Healthcare\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"Ethelyn Smith stands as one of the British Virgin Islands’ most revered pioneering nurses, public health reformers, and community matriarchs [1]. Across four decades of transformative service, she dedicated her life to the preservation and elevation of community health throughout Tortola and its sister islands. In an era when the territory was an economically neglected British colonial dependency lacking paved roads, motorized transport, running water, and electricity, Smith was a frontline lifeline for countless families [2]. From perilous mountain trails traversed on horseback to midnight boat crossings through choppy passages, she carried medical care directly into the homes of Virgin Islanders. Her relentless advocacy for maternal and infant welfare, the decentralization of clinical care, and the professionalization of local nursing reshaped the healthcare architecture of the archipelago, guiding it from informal rural midwifery toward a modern, comprehensive public health infrastructure [3].\"}],\"\\n\",[\"$\",\"h3\",\"h3-1\",{\"children\":\"Historical Context: Colonial Neglect and the Roots of Healthcare Awakening\"}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":\"To understand the significance of Ethelyn Smith’s life and service, one must appreciate the stark socio-economic realities of the mid-twentieth-century British Virgin Islands. For the first half of the 1900s, the presidency was viewed by colonial administrators in London as an impoverished and remote outpost of the Leeward Islands Federation [2]. Territorial public expenditures were severely constrained by the United Kingdom Treasury’s stringent \\\"grant-in-aid\\\" subventions, which prioritized fiscal austerity over social investment [4]. Public health was in a perennial state of emergency. Preventable infectious diseases, gastrointestinal illnesses caused by contaminated cisterns, malnutrition, and acute complications during pregnancy and childbirth inflicted a heavy toll on rural communities [1].\"}],\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\",\"\\n\",\"$L37\",\"\\n\",\"$L38\",\"\\n\",\"$L39\"]}]]}],\"$L3a\",\"$L3b\",false]}],\"$L3c\"]}]\n"])</script><script>self.__next_f.push([1,"3d:I[62682,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n3e:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/a/a7/Road_Town_Tortola.jpg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/e/eb/British_Virgin_Islands_location_detail.svg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1d:[\"$\",\"p\",\"p-2\",{\"children\":\"Medical care on Tortola was anchored only by the modest Cottage Hospital in Road Town, founded in 1922 by Commissioner Major Herbert W. Peebles [3]. Beyond Road Town, vast stretches of Tortola—from the rocky western shores of West End to the northeastern hills of Long Look and East End, and the steep northern slopes of Cane Garden Bay—remained almost entirely cut off from regular clinical services [2]. For the sister islands of Virgin Gorda, Anegada, and Jost Van Dyke, access to a qualified doctor was a rare luxury that depended entirely on weather conditions and the availability of open sailing sloops [3].\"}]\n1e:[\"$\",\"p\",\"p-3\",{\"children\":[\"The human cost of this neglect reached a boiling point in late 1949. When the colonial medical officer in Road Town refused timely and compassionate treatment to the pregnant wife of an Anegadian fisherman, \",[\"$\",\"$L3d\",\"a-0\",{\"slug\":\"theodolph-faulkner\",\"href\":\"/profiles/theodolph-faulkner\",\"children\":\"Theodolph H. Faulkner\"}],\", public outrage ignited across the territory [4]. Joining forces with civic leaders \",[\"$\",\"$L3d\",\"a-1\",{\"slug\":\"carlton-de-castro\",\"href\":\"/profiles/carlton-de-castro\",\"children\":\"Carlton de Castro\"}],\" and \",[\"$\",\"$L3d\",\"a-2\",{\"slug\":\"isaac-fonseca\",\"href\":\"/profiles/isaac-fonseca\",\"children\":\"Isaac \\\"Glanny\\\" Fonseca\"}],\", Faulkner led more than 1,500 Virgin Islanders in the historic Great March of November 24, 1949, demanding representative democracy and basic social dignity [4]. At the very heart of this foundational political awakening was a cry for humane, reliable maternal and child healthcare. It was within this climate of awakening that Nurse Ethelyn Smith answered the call to public service, becoming the living embodiment of the healthcare reform her people so desperately demanded [1].\"]}]\n1f:[\"$\",\"p\",\"p-4\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/a/a7/Road_Town_Tortola.jpg\",\"alt\":\"Road Town, Tortola, the healthcare and administrative heart of the British Virgin Islands where Peebles Hospital became the territorial medical anchor\"}]}]\n20:[\"$\",\"h3\",\"h3-2\",{\"children\":\"Early Life, Vocation, and Clinical Apprenticeship\"}]\n21:[\"$\",\"p\",\"p-5\",{\"children\":\"Born and raised on the island of Tortola, Ethelyn Smith grew up immersed in the communal traditions of self-reliance, mutual aid, and kinship that sustained Virgin Islanders through decades of imperial isolation [1]. In village life, illness and childbirth were traditionally managed by elder community matrons, known locally as \\\"granny midwives,\\\" who relied on herbal bush teas, prayer, and hard-earned practical experience [2]. While these traditional healers provided essential solace, complex maternal emergencies often proved fatal without formal clinical intervention. Witnessing firsthand the avoidable tragedies that befell young mothers and infants in her community, Smith determined early in life to pursue the nursing profession [1].\"}]\n22:[\"$\",\"p\",\"p-6\",{\"children\":\"Educational advancement for young women in Tortola was fraught with formidable obstacles. Secondary schooling was extremely limited, and specialized professional training required exceptional academic m"])</script><script>self.__next_f.push([1,"erit and moral perseverance [2]. Smith entered the nursing service through the rigorous apprenticeship program centered at the Cottage Hospital in Road Town [3]. Under the strict supervision of visiting colonial medical officers, senior matrons, and veteran nursing sisters, she mastered foundational nursing arts: wound management, surgical sterilization, pharmacology, infectious disease triage, and above all, clinical midwifery [1]. Her natural empathy, steady hands, and calm authority under pressure quickly set her apart, earning her the trust of senior medical staff and rural patients alike [3].\"}]\n23:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"In those rugged early years, healthcare in our islands did not wait inside hospital walls; it was carried on foot through mountain ridges and across open water, wherever a mother was in labor or a child needed care.\\\"\"}],\"\\n\"]}]\n24:[\"$\",\"h3\",\"h3-3\",{\"children\":\"Frontier Nursing: Maternal and Child Health Across Rugged Terrain\"}]\n25:[\"$\",\"p\",\"p-7\",{\"children\":\"Upon earning her credentials as a registered nurse and certified midwife, Ethelyn Smith was deployed as a district community nurse [1]. In this role, her daily routine resembled frontier medicine more than metropolitan healthcare. Tortola’s mountainous terrain was crisscrossed only by steep dirt tracks and donkey paths; during torrential rainstorms, hillside gullies turned into impassable torrents [2]. Armed with a leather medical bag containing sterile scissors, clamps, antiseptic lotions, bandages, weighing scales, and injectable medications, Nurse Smith traversed the island on foot, on donkey-back, and by horse [1].\"}]\n26:[\"$\",\"p\",\"p-8\",{\"children\":\"Her primary mission was the safeguarding of maternal and child health. Nurse Smith instituted regular prenatal home visits, meticulously tracking fetal development, maternal blood pressure, and nutritional health in rural households where pregnant women had never before received structured medical monitoring [1][2]. When labor commenced, often in the dead of night by the dim glow of kerosene lamps, families dispatched a messenger on horseback to fetch Nurse Smith. Arriving at isolated wooden homes, she delivered hundreds of infants into the world, deftly managing breech presentations, postpartum hemorrhages, and neonatal asphyxia with resourcefulness and unshakeable composure [3].\"}]\n27:[\"$\",\"p\",\"p-9\",{\"children\":\"Smith recognized that maternal survival was intimately linked to preventive child healthcare. She organized grassroots infant welfare clinics under the shade of village tamarind trees, church halls, and schoolrooms across Tortola [1]. There, she weighed infants, educated mothers on hygienic infant feeding, distributed vital nutritional supplements such as cod liver oil and powdered milk, and spearheaded territorial vaccination campaigns [2]. Through her tireless outreach, childhood immunization rates surged, dramatically reducing the territorial incidence of tetanus neonatorum, whooping cough (pertussis), diphtheria, and measles [1].\"}]\n28:[\"$\",\"p\",\"p-10\",{\"children\":\"Her jurisdiction, however, was not confined to Tortola. Recognizing the acute vulnerability of the sister islands, Nurse Smith regularly boarded traditional open wooden sloops and early motor launches to navigate the turbulent waters of the Sir Francis Drake Channel [3]. On Virgin Gorda, Jost Van Dyke, and distant Anegada, where medical facilities were virtually nonexistent, she conducted marathon multi-day clinics, treating chronic ailments, inoculating schoolchildren, attending home births, and training local community helpers to monitor high-risk patients between her visits [2].\"}]\n29:[\"$\",\"p\",\"p-11\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/e/eb/British_Virgin_Islands_location_detail.svg\",\"alt\":\"Geographic map of the British Virgin Islands showing Tortola and the sister islands of Virgin Gorda, Anegada, and Jost Van Dyke connected by community nursing networks\"}]}]\n2a:[\"$\",\"h3\",\"h3-4\",{\"children\":\"Institutional Moder"])</script><script>self.__next_f.push([1,"nization and Peebles Hospital\"}]\n2b:[\"$\",\"p\",\"p-12\",{\"children\":[\"By the mid-1950s and 1960s, the British Virgin Islands began an unprecedented era of political and economic transformation. The restoration of the Legislative Council following the 1949 march, followed by the landmark 1967 Constitution establishing ministerial government under Chief Minister \",[\"$\",\"$L3d\",\"a-0\",{\"slug\":\"h-lavity-stoutt\",\"href\":\"/profiles/h-lavity-stoutt\",\"children\":\"H. Lavity Stoutt\"}],\", ushered in a new national determination to build modern public institutions [4]. The modest Cottage Hospital was expanded and renamed Peebles Hospital, evolving into a multi-ward territorial medical center in Road Town [3].\"]}]\n2c:[\"$\",\"p\",\"p-13\",{\"children\":\"Throughout this transition, Nurse Ethelyn Smith served as a vital bridge between traditional community care and institutional clinical modernization [1]. At Peebles Hospital, she assumed senior administrative and supervisory responsibilities, overseeing maternity wards, outpatient dispensaries, and inpatient care [3]. She worked hand-in-hand with early indigenous Virgin Islands physicians—including surgeon and future Premier Dr. D. Orlando Smith—to implement rigorous infection control protocols, standardize maternal record-keeping, and upgrade obstetric surgical prep [1][3].\"}]\n2d:[\"$\",\"p\",\"p-14\",{\"children\":\"Despite the growing sophistication of Peebles Hospital, Nurse Smith vigorously insisted that hospital-based medicine must never displace primary community care [1]. She argued passionately before government officials that requiring poor rural families to journey to Road Town for basic medical needs was an inequitable barrier that endangered lives [2]. Championing the decentralization of territorial healthcare, she was instrumental in the establishment and staffing of permanent district health clinics across Tortola, including the West End Clinic, the East End / Long Look Clinic, and the Cane Garden Bay Clinic [1][3]. These community health centers brought clinical diagnostics, diabetic monitoring, hypertension screenings, and prenatal checkups directly to the doorsteps of rural settlements, establishing a primary care model that became the envy of the Eastern Caribbean [2].\"}]\n2e:[\"$\",\"p\",\"p-15\",{\"children\":\"Smith was equally committed to mentoring the next generation of Virgin Islands nurses [1]. In the hospital wards and district dispensaries, she served as a preceptor for dozens of young student nurses and auxiliary midwives. Known as a demanding yet deeply supportive teacher, she instilled in her pupils not only clinical precision and sterile technique, but an unwavering ethical code of patient dignity, confidentiality, and compassionate bedside manner [3].\"}]\n2f:[\"$\",\"blockquote\",\"blockquote-1\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"True public health is the foundation of community dignity; when we protect our mothers and children, we protect the very future of the Virgin Islands.\\\"\"}],\"\\n\"]}]\n30:[\"$\",\"h3\",\"h3-5\",{\"children\":\"Civic Leadership and Broad Social Reform\"}]\n31:[\"$\",\"p\",\"p-16\",{\"children\":\"For Ethelyn Smith, healthcare was inseparable from broader social justice and community empowerment [1]. She understood that medical interventions alone could not cure illnesses rooted in poverty, poor sanitation, and civic neglect. Outside her official nursing duties, she emerged as an influential civic leader, church pillar, and community activist across Tortola [1][2].\"}]\n32:[\"$\",\"p\",\"p-17\",{\"children\":[\"Smith was an active organizer within local Methodist and Anglican church societies, leading women’s fellowships, youth guilds, and mutual aid funds that assisted impoverished widows, orphans, and the elderly [1]. She partnered closely with civic leaders and community builders such as Chief Minister \",[\"$\",\"$L3d\",\"a-0\",{\"slug\":\"willard-wheatley\",\"href\":\"/profiles/willard-wheatley\",\"children\":\"Willard Wheatley\"}],\" and Fifth District representative and Chief Minister \",[\"$\",\"$L3d\",\"a-1\",{\"slug\":\"cyril-romney\",\"href\":\"/profiles/cyril-romney\",\"children\":\"Cyril B. Romney\"}],\" to ad"])</script><script>self.__next_f.push([1,"vocate for public health infrastructure [4]. She persistently lobbied legislative representatives to allocate public funds for protected community water cisterns, municipal waste collection, and rural road paving [2]. When Minister of Communications and Works \",[\"$\",\"$L3d\",\"a-2\",{\"slug\":\"terrence-lettsome\",\"href\":\"/profiles/terrence-lettsome\",\"children\":\"Terrence B. Lettsome\"}],\" oversaw major infrastructure projects across the territory, Nurse Smith championed the installation of roadside drainage and clinic telephone links, emphasizing that infrastructural development was fundamentally a matter of public safety and disease prevention [4].\"]}]\n33:[\"$\",\"p\",\"p-18\",{\"children\":\"During public health crises, such as seasonal outbreaks of dengue fever and gastrointestinal enteritis, Smith took to community radio, school assemblies, and public town halls to conduct health education campaigns [1]. She taught families how to properly chlorinate drinking water, eradicate mosquito breeding sites around homes, and preserve fresh food safely in a tropical climate [2]. Her holistic vision of health transformed her from a beloved district nurse into one of the most respected civic voices in the British Virgin Islands [1].\"}]\n34:[\"$\",\"h3\",\"h3-6\",{\"children\":\"Enduring Legacy and Territorial Reverence\"}]\n35:[\"$\",\"p\",\"p-19\",{\"children\":\"Ethelyn Smith’s decades of selfless service left an indelible stamp on the society and health of the British Virgin Islands [1]. Over her long career, she delivered thousands of Virgin Islanders into the world—generations of citizens who came of age knowing that Nurse Smith had been the very first person to cradle them in her arms [1][3]. The steep decline in infant and maternal mortality rates across the territory during the latter half of the twentieth century was directly attributable to the grassroots public health framework and district clinic network that she helped construct and nurture [2].\"}]\n36:[\"$\",\"p\",\"p-20\",{\"children\":\"In the twenty-first century, the territorial healthcare system that Smith helped pioneer underwent further monumental advancement. Peebles Hospital was entirely modernized into a state-of-the-art territorial medical complex, which was officially renamed the Dr. D. Orlando Smith Hospital in 2019 [3]. In honor of the deep historical roots of local medicine, the original hospital structure was preserved as the Major Peebles Wing, continuing to serve the public as the Road Town Clinic and administrative center [3].\"}]\n37:[\"$\",\"p\",\"p-21\",{\"children\":\"Nurse Ethelyn Smith was celebrated throughout her lifetime and beyond as an honored healthcare pioneer, receiving territorial accolades, community commendations, and the profound gratitude of the Virgin Islands people [1]. Her life’s journey remains an inspiring testament to the power of dedicated, compassionate public service. In an era of profound national transition, Nurse Smith proved that the true greatness of a society is measured by its commitment to its most vulnerable, cementing her place forever as an immortal guardian of the Caribbean legacy [1][2].\"}]\n38:[\"$\",\"h3\",\"h3-7\",{\"children\":\"References\"}]\n39:[\"$\",\"ul\",\"ul-0\",{\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":[\"$\",\"a\",\"a-0\",{\"href\":\"https://bvi.gov.vg\",\"target\":\"_blank\",\"rel\":\"noopener noreferrer\",\"children\":\"Government of the Virgin Islands - History of Healthcare in the British Virgin Islands and Peebles Hospital Transformation\"}]}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":[\"$\",\"a\",\"a-0\",{\"href\":\"https://bvihsa.vg\",\"target\":\"_blank\",\"rel\":\"noopener noreferrer\",\"children\":\"BVI Health Services Authority (BVIHSA) - From Cottage Hospital to Dr. D. Orlando Smith Hospital: Celebrating Healthcare Pioneers and Community Clinics\"}]}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":[\"$\",\"a\",\"a-0\",{\"href\":\"https://caribbeanlegacyarchive.com/sources/dookhan-bvi-history\",\"target\":\"_blank\",\"rel\":\"noopener noreferrer\",\"children\":\"A History of the British Virgin Islands 1672–1970 (Isaac Dookhan)\"}]}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":[\"$\",\"a\",\"a-0\",{\"href\":\"https://caribbeanlegacyarchive.com/sourc"])</script><script>self.__next_f.push([1,"es/harrigan-varlack-vi-story\",\"target\":\"_blank\",\"rel\":\"noopener noreferrer\",\"children\":\"The Virgin Islands Story (Norwell Harrigan and Pearl Varlack)\"}]}],\"\\n\"]}]\n3a:[\"$\",\"$L3e\",null,{\"title\":\"Learn about the legacy of Ethelyn Smith\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/ethelyn-smith\"}]\n3f:T4a3,A pioneering Virgin Islands nurse, midwife, and healthcare reformer, Ethelyn Smith spent over four decades building the foundations of modern maternal, infant, and community healthcare across Tortola and the sister islands. Operating in an era of severe colonial neglect and geographical isolation, she traversed mountainous trails and open sea passages to provide essential prenatal monitoring, attended thousands of home births, and led aggressive childhood immunization campaigns that drastically reduced infant and maternal mortality throughout the British Virgin Islands.\n\nSmith played an indispensable role in modernizing territorial healthcare infrastructure, helping oversee clinical standards during the transition from the historic Cottage Hospital to Peebles Hospital (now Dr. D. Orlando Smith Hospital), while championing the establishment of vital district clinics in West End, East End / Long Look, and Cane Garden Bay. A tireless civic leader and mentor, she educated generations of Virgin Islands nurses and successfully advocated for clean water cisterns, public sanitation, and community health access, establishing an enduring standard of compassionate public service.3b:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"$3f\"}]]}]\n"])</script><script>self.__next_f.push([1,"3c:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow
