ined\",\"iconNode\":[[\"path\",{\"d\":\"M8 2v4\",\"key\":\"1cmpym\"}],[\"path\",{\"d\":\"M16 2v4\",\"key\":\"4m81vk\"}],[\"rect\",{\"width\":\"18\",\"height\":\"18\",\"x\":\"3\",\"y\":\"4\",\"rx\":\"2\",\"key\":\"1hopcy\"}],[\"path\",{\"d\":\"M3 10h18\",\"key\":\"8toen8\"}]],\"className\":\"lucide-calendar h-4 w-4 text-gold mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Life Dates\"}],[\"$\",\"span\",null,{\"className\":\"text-sm font-semibold\",\"children\":[1900,\" – \",1972]}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M12 7v14\",\"key\":\"1akyts\"}],[\"path\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\",\"key\":\"ruj8y\"}]],\"className\":\"lucide-book-open h-4 w-4 text-navy/60 mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Areas of Influence\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2 mt-1\",\"children\":[\"$L1b\",\"$L1c\"]}]]}]]}]]}]]}]]}],\"$L1d\"]}]}]]}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"$L6\",\"0\",{\"href\":\"/areas/politics\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Politics\"}]\n1c:[\"$\",\"$L6\",\"1\",{\"href\":\"/areas/civil-rights\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Civil Rights\"}]\n1e:T4fa,Isaac Glanville Fonseca (1923–1995), affectionately known to generations of Virgin Islanders as \"Glanny,\" was a monumental political figure, community organizer, and designated National Hero of the British Virgin Islands [1]. Fonseca played a defining role in the modern political development of the BVI, most notably as a primary leader of the historic Great March of 1949. This peaceful demonstration of over 1,500 residents successfully forced the British government to restore the BVI Legislative Council, which had been abolished in 1902, thereby re-establishing representative democracy in the territory [2]. Following this victory, Fonseca embarked on an extraordinary legislative career that spanned twenty-one consecutive years, winning six general elections and serving for five consecutive terms [3]. As a populist representative and a key member of the constitutional delegations to London in 1959 and 1966, Fonseca campaigned tirelessly for BVI autonomy, infrastructural modernization, public education, and the rights of the working class [3]. His colorful oratorical style and unwavering commitment to self-governance laid the economic and political foundations of the modern territory, securing his place as a founding father of the British Virgin Islands."])</script><script>self.__next_f.push([1,"1d:[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Isaac Glanville Fonseca\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Introduction\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"$1e\"}],\"\\n\",[\"$\",\"h3\",\"h3-1\",{\"children\":\"Early Life, Family Roots, and Regional Education\"}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":\"Isaac Glanville Fonseca was born in Road Town, Tortola, on July 23, 1923. He was the only son and the third of four children born to David G. Fonseca and Florence Creque Fonseca [1]. The Fonseca family was well-established in Road Town, and David Fonseca was a respected local civil servant and merchant who took an active, passionate interest in the civic affairs of the colony. From an early age, Isaac was exposed to political discussions in his father's home, learning about the governance of the British Empire and the local grievances of the Virgin Islands population.\"}],\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\",\"\\n\",\"$L37\",\"\\n\",\"$L38\",\"\\n\",\"$L39\",\"\\n\",\"$L3a\",\"\\n\",\"$L3b\",\"\\n\",\"$L3c\"]}]]}],\"$L3d\",\"$L3e\",false]}],\"$L3f\"]}]\n"])</script><script>self.__next_f.push([1,"40:I[62682,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n41:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/1/1a/Flag_of_the_British_Virgin_Islands.svg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/1/1b/BritishVirginIsland_map.png\",\"image\"]\n1f:[\"$\",\"p\",\"p-2\",{\"children\":\"Fonseca received his primary education at St. George’s Anglican School in Road Town. Recognizing his academic potential and the lack of secondary educational facilities in Tortola at the time, his parents sent him to St. Kitts to attend grammar school [1]. In St. Kitts, Fonseca was exposed to a larger, more politically active Caribbean society. The Leeward Islands, of which both St. Kitts and the BVI were part, were experiencing a wave of labor unrest and political mobilization led by early trade unionists and advocates of self-government.\"}]\n20:[\"$\",\"p\",\"p-3\",{\"children\":\"After completing his secondary education, Fonseca moved to St. Thomas, US Virgin Islands, for work experience [1]. The US Virgin Islands, purchased by the United States from Denmark in 1917, enjoyed a higher standard of living, better infrastructure, and a more representative political system than their British neighbors. Seeing Virgin Islanders actively participating in their own governance and experiencing economic development under the American system deeply influenced the young Fonseca. He returned to Tortola with a profound sense of dissatisfaction with the colonial administration of the British Virgin Islands and a determination to organize for political reform.\"}]\n21:[\"$\",\"h3\",\"h3-2\",{\"children\":\"The British Virgin Islands in the Mid-Century: An Era of Colonial Neglect\"}]\n22:[\"$\",\"p\",\"p-4\",{\"children\":\"To understand the significance of Fonseca’s political career, one must examine the socio-economic conditions of the British Virgin Islands in the 1930s and 1940s. Since 1872, the BVI had been part of the Federal Colony of the Leeward Islands, administered from St. John's, Antigua. In 1902, the local Legislative Council was formally abolished, and the power to make laws was vested entirely in the Governor of the Leeward Islands and a nominated Commissioner in Road Town.\"}]\n23:[\"$\",\"p\",\"p-5\",{\"children\":\"The territory was almost completely ignored by the British Colonial Office. There were no paved roads, no public electricity grid, no municipal water systems, and no secondary schools. The economy was based on subsistence farming, livestock rearing, and fishing, with the majority of trade conducted with St. Thomas. The local population felt completely disenfranchised and neglected by a distant federal government in Antigua that collected their tax revenues but provided no public services in return. It was within this environment of chronic neglect and political impotence that Fonseca and his contemporaries began to organize.\"}]\n24:[\"$\",\"p\",\"p-6\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/1/1a/Flag_of_the_British_Virgin_Islands.svg\",\"alt\":\"The national flag of the British Virgin Islands, symbolizing the territory's maritime heritage and its journey toward self-governance.\"}]}]\n25:[\"$\",\"h3\",\"h3-3\",{\"children\":\"The Great March of 1949: A Catalyst for Democratic Restoration\"}]\n26:[\"$\",\"p\",\"p-7\",{\"children\":[\"The turning point in BVI history came in late 1949. \",[\"$\",\"$L40\",\"a-0\",{\"slug\":\"theodolph-faulkner\",\"href\":\"/profiles/theodolph-faulkner\",\"children\":\"Theodolph Faulkner\"}],\", a fisherman from the remote island of Anegada, arrived in Road Town and began giving impassioned speeches in the marketplace, criticizing the colonial administration’s failure to provide medical services and its abuse of power. Faulkner’s public criticisms str"])</script><script>self.__next_f.push([1,"uck a chord with the local population, and he was quickly joined by two young Road Town entrepreneurs and community leaders: Isaac Fonseca and \",[\"$\",\"$L40\",\"a-1\",{\"slug\":\"carlton-de-castro\",\"href\":\"/profiles/carlton-de-castro\",\"children\":\"Carlton de Castro\"}],\" [4].\"]}]\n27:[\"$\",\"p\",\"p-8\",{\"children\":\"Together, the three men formed a leadership committee to channel the public's frustrations into a structured political movement. They planned a massive, peaceful protest march to present a formal petition to Commissioner J. A. C. Cruikshank. Fonseca’s contribution to the organization of the march was critical. Recognizing that the colonial government would attempt to downplay or ignore a local protest, Fonseca used his business connections in St. Thomas to hire a private seaplane to fly in international journalists from the US Virgin Islands and Puerto Rico [1]. This ingenious public relations move ensured that the march would receive regional and international press coverage, making it impossible for the British administration to suppress the event in silence [1].\"}]\n28:[\"$\",\"p\",\"p-9\",{\"children\":\"On November 24, 1949, the Great March took place. Over 1,500 Virgin Islanders—nearly a quarter of the entire population—gathered in Road Town and marched peacefully to the Commissioner's Office. Faulkner, de Castro, and Fonseca marched at the head of the crowd. They presented a petition to Commissioner Cruikshank, co-signed by the three leaders, which famously declared:\"}]\n29:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"We are imbued with a desire to decide our local affairs our own selves. We have outgrown that undesirable stage where one official, or an official clique, makes decisions for us... We are seeking the privilege of deciding how our monies are spent and what shall be our Presidential laws and policies.\\\"\\n— 1949 BVI Petition co-signed by Isaac Glanville Fonseca, Theodolph Faulkner, and Carlton de Castro [2]\"}],\"\\n\"]}]\n2a:[\"$\",\"p\",\"p-10\",{\"children\":\"The march was an overwhelming success. Faced with a united population and international press scrutiny, Commissioner Cruikshank was forced to forward the petition to the Governor of the Leeward Islands and the Colonial Office in London. The British government conceded, and in 1950, a new constitution was enacted, restoring the BVI Legislative Council after a forty-eight-year suspension.\"}]\n2b:[\"$\",\"h3\",\"h3-4\",{\"children\":\"The Birth of Modern BVI Politics and the 1950 Legislative Council\"}]\n2c:[\"$\",\"p\",\"p-11\",{\"children\":\"The restoration of the Legislative Council marked the birth of modern representative democracy in the BVI. In the inaugural general election of 1950, Fonseca contested the election and was successfully elected as one of the four territorial representatives on the new council, alongside H. R. Penn, Carlton de Castro, and J. O. Georges [2].\"}]\n2d:[\"$\",\"p\",\"p-12\",{\"children\":\"The restored council faced the monumental task of rebuilding the territory's infrastructure and economy from scratch. Fonseca proved to be a highly active and vocal legislator. He was re-elected in 1954, 1957, 1960, and 1963, serving continuously for seventeen years as a non-partisan representative during the era of coalition and consensus governance. In 1952, the Legislative Council selected Fonseca to represent the British Virgin Islands on the General Legislative Council of the Leeward Islands in Antigua [1]. In this regional forum, Fonseca used his position to advocate for the BVI's interests, demanding a fairer share of development grants and arguing for the BVI's right to manage its own financial affairs independently of Antigua.\"}]\n2e:[\"$\",\"p\",\"p-13\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/1/1b/BritishVirginIsland_map.png\",\"alt\":\"A map of the British Virgin Islands, showing Road Town and the islands where Fonseca campaigned and represented constituents.\"}]}]\n2f:[\"$\",\"h3\",\"h3-5\",{\"children\":\"Legislative Career and Populist Advocacy\"}]\n30:[\"$\",\"p\",\"p-14\",{\"children\":\"Throughout his twenty-one "])</script><script>self.__next_f.push([1,"years in the legislature, Fonseca established himself as the preeminent populist champion of the BVI working class. He was known for his colorful, dramatic, and highly persuasive speaking style, which drew large crowds to the public galleries of the House of Assembly. He was affectionately dubbed \\\"the champion of the common man\\\" for his focus on practical, everyday improvements that directly benefited his constituents.\"}]\n31:[\"$\",\"p\",\"p-15\",{\"children\":\"Fonseca’s legislative advocacy focused on several key areas:\"}]\n32:[\"$\",\"ul\",\"ul-0\",{\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":[[\"$\",\"strong\",\"strong-0\",{\"children\":\"Infrastructure:\"}],\" He campaigned continuously for the construction of paved roads connecting Road Town with the rural villages of Tortola, arguing that farmers could not prosper without reliable transport. He also pushed for the expansion of the public electricity grid and clean water systems.\"]}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":[[\"$\",\"strong\",\"strong-0\",{\"children\":\"Education:\"}],\" He lobbied for the establishment of public secondary schools, ensuring that Virgin Islands youth would not have to leave the territory to receive a high school education.\"]}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":[[\"$\",\"strong\",\"strong-0\",{\"children\":\"Healthcare:\"}],\" He advocated for the construction of clinics in the Out Islands and the expansion of the hospital in Road Town, remembering the medical neglect that had sparked the 1949 protest.\"]}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":[[\"$\",\"strong\",\"strong-0\",{\"children\":\"Land Ownership:\"}],\" He fought against attempts by the colonial government to sell crown lands to foreign developers, insisting that the land must be preserved for local ownership and agricultural use.\"]}],\"\\n\"]}]\n33:[\"$\",\"h3\",\"h3-6\",{\"children\":\"Constitutional Crusades and the Ministerial System\"}]\n34:[\"$\",\"p\",\"p-16\",{\"children\":\"As the BVI grew economically and socially in the 1950s, the limitations of the 1950 constitution became increasingly apparent. The Commissioner still held executive authority, and the territory remained administratively tied to the Leeward Islands. Fonseca became a leading voice in the campaign for further constitutional advancement.\"}]\n35:[\"$\",\"p\",\"p-17\",{\"children\":\"He was selected as a member of the official BVI delegations that traveled to London for constitutional conferences in 1959 and 1966. In these negotiations with the British Colonial Office, Fonseca argued passionately for the dissolution of the Leeward Islands Federation (which was achieved in 1956) and the introduction of a ministerial system of government, where elected representatives would hold executive authority over government departments. His work during these conferences culminated in the 1967 Constitution, which established the ministerial system and created the office of the Chief Minister, marking the final stage of the territory's transition to full internal self-government.\"}]\n36:[\"$\",\"h3\",\"h3-7\",{\"children\":\"The People's Own Party and the 1967 Election\"}]\n37:[\"$\",\"p\",\"p-18\",{\"children\":[\"The introduction of the ministerial system in 1967 led to the formation of the BVI's first political parties. For the general election of 1967, Fonseca founded and led the People's Own Party (POP) [3]. The election was a three-way battle between the United Party (UP) led by \",[\"$\",\"$L40\",\"a-0\",{\"slug\":\"lavity-stoutt\",\"href\":\"/profiles/lavity-stoutt\",\"children\":\"H. Lavity Stoutt\"}],\", the BVI Democratic Party (VIDP) led by Q. William Osborne, and Fonseca's POP [3].\"]}]\n38:[\"$\",\"p\",\"p-19\",{\"children\":\"The election was highly competitive. While the United Party won the majority of seats and Stoutt became the first Chief Minister of the British Virgin Islands, Fonseca achieved personal victory by winning the Fifth District seat, defeating his United Party opponent. As the leader of the POP in the legislature, Fonseca continued to serve as a critical, independent voice, holding the Stoutt administration accountable and ensuring that the needs of the working class remained at the center of government policy.\"}]\n39:[\"$\",\"h3\",\"h"])</script><script>self.__next_f.push([1,"3-8\",{\"children\":\"Later Years, Honors, and Lasting Legacy\"}]\n3a:[\"$\",\"p\",\"p-20\",{\"children\":[\"Isaac Glanville Fonseca retired from active politics in 1971, ending twenty-one years of continuous legislative service [3]. Despite his retirement, he remained a highly respected elder statesman and community leader, often consulted by younger politicians, including future Chief Ministers \",[\"$\",\"$L40\",\"a-0\",{\"slug\":\"lavity-stoutt\",\"href\":\"/profiles/lavity-stoutt\",\"children\":\"H. Lavity Stoutt\"}],\" and \",[\"$\",\"$L40\",\"a-1\",{\"slug\":\"cyril-romney\",\"href\":\"/profiles/cyril-romney\",\"children\":\"Cyril B. Romney\"}],\" [3].\"]}]\n3b:[\"$\",\"p\",\"p-21\",{\"children\":\"In recognition of his lifelong service to the territory, Queen Elizabeth II appointed Fonseca an Officer of the Order of the British Empire (OBE) in 1972 [1]. Fonseca passed away on May 17, 1995, at the age of 71, and was honored with a state funeral.\"}]\n3c:[\"$\",\"p\",\"p-22\",{\"children\":\"Today, Fonseca's legacy as a pioneer of BVI democracy is permanently enshrined. The government of the British Virgin Islands officially designated him as one of the territory's National Heroes [1]. A bronze bust of Isaac Fonseca, alongside one of Carlton de Castro, stands proudly in front of the House of Assembly building in Road Town, Tortola, serving as a permanent monument to the men who co-led the Great March of 1949 and gave birth to modern representative government in the British Virgin Islands [2].\"}]\n3d:[\"$\",\"$L41\",null,{\"title\":\"Learn about the legacy of Isaac Glanville Fonseca\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/glanville-fonseca\"}]\n42:T460,Isaac Glanville Fonseca was a foundational political leader and National Hero of the British Virgin Islands who championed the restoration of democratic governance. As a co-leader of the historic Great March of 1949, he organized over 1,500 residents to protest colonial neglect and successfully petition for the reinstatement of the BVI Legislative Council, which had been suspended for 48 years. To amplify the movement, Fonseca hired a seaplane to bring in international press, ensuring the colonial administration could not silence their demands.\n\nFollowing the restoration of democracy, Fonseca served as an elected legislator for 21 consecutive years, representing the Second, Fourth, and Fifth Districts. He represented the BVI on the Leeward Islands General Legislative Council and participated in key constitutional delegations to London in 1959 and 1966 that established the 1967 Ministerial System. A dedicated populist known as the 'champion of the common man,' he founded the People's Own Party and fought for the expansion of public schools, paved roads, electricity, and water supply across the territory.3e:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"$42\"}]]}]\n"])</script><script>self.__next_f.push([1,"3f:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"div\",null,{\"className\":\"flex items-center justify-center font-bold text-white shadow-lg bg-gradient-to-br from-slate-700 to-slate-500 text-xl w-full h-full rounded-none\",\"aria-label\":\"Profile picture placeholder for A.W. \\\"Art\\\" Saunders\",\"title\":\"A.W. \\\"Art\\\" Saunders\",\"children\":[\"$\",\"span\",null,{\"className\":\"drop-shadow-md tracking-wider\",\"children\":\"AS\"}]}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"font-serif text-lg text-navy line-clamp-1\",\"children\":\"A.W. \\\"Art\\\" Saunders\"}],[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40\",\"children\":\"Turks \u0026 Caicos Islands\"}]]}]]}],[\"$\",\"$L6\",\"c0c62444-53a6-4e76-beb3-50dff472d653\",{\"href\":\"/profi
