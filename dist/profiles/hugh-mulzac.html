[\"rect\",{\"width\":\"18\",\"height\":\"18\",\"x\":\"3\",\"y\":\"4\",\"rx\":\"2\",\"key\":\"1hopcy\"}],[\"path\",{\"d\":\"M3 10h18\",\"key\":\"8toen8\"}]],\"className\":\"lucide-calendar h-4 w-4 text-gold mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Life Dates\"}],[\"$\",\"span\",null,{\"className\":\"text-sm font-semibold\",\"children\":[1886,\" – \",1971]}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M12 7v14\",\"key\":\"1akyts\"}],[\"path\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\",\"key\":\"ruj8y\"}]],\"className\":\"lucide-book-open h-4 w-4 text-navy/60 mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Areas of Influence\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2 mt-1\",\"children\":[[\"$\",\"$L6\",\"0\",{\"href\":\"/areas/history\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"History\"}],\"$L1b\"]}]]}]]}]]}]]}]]}],\"$L1c\"]}]}]]}]\n"])</script><script>self.__next_f.push([1,":HL[\"https://upload.wikimedia.org/wikipedia/commons/7/77/Hugh_Mulzac.jpg\",\"image\"]\n1b:[\"$\",\"$L6\",\"1\",{\"href\":\"/areas/civil-rights\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Civil Rights\"}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Hugh Mulzac\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Introduction\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[\"Hugh Nathaniel Mulzac (1886–1971) stands as a monumental figure in maritime history and the civil rights movement, forever remembered as the first African-American to command a ship in the United States Merchant Marine. Born in the small, sun-drenched outpost of Union Island in Saint Vincent and the Grenadines, his life was defined by the sea and a relentless, decades-long battle against the entrenched systemic racism of the early-to-mid 20th century [1]. Mulzac's journey from a young Caribbean islander with nautical ambitions to the historic captain of the \",[\"$\",\"em\",\"em-0\",{\"children\":\"SS Booker T. Washington\"}],\" during World War II is a testament to extraordinary resilience. Beyond his pioneering achievements on the water, Mulzac was a fierce labor activist, a staunch advocate for integrated workplaces, and a man who famously refused to command a segregated \\\"Jim Crow\\\" vessel, forcing the U.S. government to change its policies during a critical global conflict [2].\"]}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/7/77/Hugh_Mulzac.jpg\",\"alt\":\"Captain Hugh Mulzac in uniform\"}]}],\"\\n\",[\"$\",\"h3\",\"h3-1\",{\"children\":\"Early Life and Caribbean Roots\"}],\"\\n\",[\"$\",\"p\",\"p-2\",{\"children\":\"Hugh Mulzac was born on March 26, 1886, on Union Island, a small landmass in the Grenadines archipelago, which was then a part of the British colony of Saint Vincent. Growing up surrounded by the Caribbean Sea, the ocean was an inescapable reality and a natural calling for the young Mulzac. The maritime traditions of the West Indies ran deep in his community, where inter-island trading and boat-building were ways of life. His grandfather had been a shipwright, and his father was a planter who managed an estate, but it was the sea that captured Mulzac's imagination.\"}],\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\"]}]]}],\"$L36\",\"$L37\",false]}],\"$L38\"]}]\n"])</script><script>self.__next_f.push([1,"39:I[62682,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n3a:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/4/4b/SS_Booker_T._Washington.jpg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1d:[\"$\",\"p\",\"p-3\",{\"children\":\"He received his early education on Saint Vincent, completing high school there [3]. The British colonial education system provided a strict foundation, but Mulzac knew that his future lay beyond the shores of his home island. Driven by a desire to see the world and master the intricacies of navigation, he went to sea shortly after finishing his secondary education. His early years were spent serving as an ordinary seaman on British merchant vessels, learning the ropes of seamanship the hard way—through grueling physical labor, long voyages across turbulent oceans, and the strict hierarchy of shipboard life.\"}]\n1e:[\"$\",\"h3\",\"h3-2\",{\"children\":\"Nautical Education and World War I\"}]\n1f:[\"$\",\"p\",\"p-4\",{\"children\":\"Recognizing that ambition alone would not secure him the command he desired, Mulzac sought formal education to back up his practical experience. He traveled to the United Kingdom and enrolled in the Nautical School in Swansea, Wales [4]. This was a significant achievement for a young Black man from the Caribbean at the turn of the century. At Swansea, he mastered navigation, maritime law, and ship management, eventually earning his mate's license.\"}]\n20:[\"$\",\"p\",\"p-5\",{\"children\":\"When World War I erupted, Mulzac put his skills to use, serving as a ship's officer on both British and American vessels. He braved the treacherous, U-boat-infested waters of the Atlantic, delivering vital supplies to the Allied war effort. It was during this period that he became intimately familiar with the American maritime industry, eventually choosing to immigrate to the United States. He became a naturalized U.S. citizen in 1918, hoping that the \\\"Land of Opportunity\\\" would allow him to realize his ultimate dream: commanding his own ocean-going vessel [1].\"}]\n21:[\"$\",\"h3\",\"h3-3\",{\"children\":\"The Jim Crow Merchant Marine\"}]\n22:[\"$\",\"p\",\"p-6\",{\"children\":\"In 1920, Mulzac made history by becoming the first African American to pass the rigorous United States shipping master’s examination [2]. Earning his Master's license meant he was legally and professionally qualified to command any vessel on the ocean. However, he quickly ran head-first into the brutal reality of America's racial caste system. The U.S. maritime industry was deeply segregated, and the unwritten rule of the sea was that a Black man could not command a white crew.\"}]\n23:[\"$\",\"p\",\"p-7\",{\"children\":\"Despite holding the highest possible certification, shipping companies outright refused to hire Mulzac as a captain or even as a mate. For over two decades, he was humiliatingly forced to work below his qualifications, primarily finding employment in the steward’s department—working as a cook or a chief steward [4]. It was a crushing blow to a man who had dedicated his life to mastering navigation, yet he refused to leave the sea. He endured the indignity, biding his time and fighting for better conditions as an early and active member of the National Maritime Union, advocating for the rights of all sailors, regardless of race.\"}]\n24:[\"$\",\"h3\",\"h3-4\",{\"children\":[\"The Black Star Line and \",[\"$\",\"$L39\",\"a-0\",{\"slug\":\"marcus-garvey\",\"href\":\"/profiles/marcus-garvey\",\"children\":\"Marcus Garvey\"}]]}]\n25:[\"$\",\"p\",\"p-8\",{\"children\":[\"During this frustrating period, Mulzac found a brief glimmer"])</script><script>self.__next_f.push([1," of hope in the Black nationalist movement led by \",[\"$\",\"$L39\",\"a-0\",{\"slug\":\"marcus-garvey\",\"href\":\"/profiles/marcus-garvey\",\"children\":\"Marcus Garvey\"}],\". Garvey’s Universal Negro Improvement Association (UNIA) had launched the Black Star Line, an ambitious shipping venture intended to facilitate global trade among Black nations and transport passengers to Africa. To Mulzac, a Black-owned shipping line seemed like the perfect opportunity to finally exercise his command credentials.\"]}]\n26:[\"$\",\"p\",\"p-9\",{\"children\":[\"In 1920, Mulzac joined the Black Star Line and was appointed chief officer on the \",[\"$\",\"em\",\"em-0\",{\"children\":\"SS Yarmouth\"}],\", one of the line's prominent vessels [5]. However, the dream quickly soured. Mulzac was a seasoned, highly trained mariner, and he was deeply dismayed by the poor management, financial mismanagement, and lack of maritime expertise among the Black Star Line's leadership. He realized that the enterprise was being run by political opportunists rather than experienced shipping professionals. Unwilling to compromise his professional standards, Mulzac resigned from the UNIA in 1921, later writing critical assessments of the venture's inevitable failure [6].\"]}]\n27:[\"$\",\"h3\",\"h3-5\",{\"children\":\"World War II and the SS Booker T. Washington\"}]\n28:[\"$\",\"p\",\"p-10\",{\"children\":\"The onset of World War II dramatically shifted the landscape of the American maritime industry. The U.S. required a massive fleet to transport troops and supplies across the globe, leading to the rapid construction of \\\"Liberty ships.\\\" The demand for experienced mariners skyrocketed.\"}]\n29:[\"$\",\"p\",\"p-11\",{\"children\":[\"In 1942, at the age of 56, Mulzac's moment finally arrived. The U.S. Maritime Commission offered him the command of the \",[\"$\",\"em\",\"em-0\",{\"children\":\"SS Booker T. Washington\"}],\", the very first Liberty ship named in honor of an African American, \",[\"$\",\"$L39\",\"a-0\",{\"slug\":\"booker-t-washington\",\"href\":\"/profiles/booker-t-washington\",\"children\":\"Booker T. Washington\"}],\" [1]. However, the offer came with an insulting caveat: the commission intended for the ship to have an all-Black crew, strictly adhering to military segregation policies.\"]}]\n2a:[\"$\",\"p\",\"p-12\",{\"children\":\"Mulzac, a lifelong integrationist and union man, firmly rejected the condition. He knew that accepting a segregated ship would only reinforce the racist notion that Black and white sailors could not work together.\"}]\n2b:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"Under no circumstances will I command a Jim Crow ship,\\\" Mulzac boldly declared to the government officials. \\\"Everything I had been fighting for all my life was at stake... I could not accept the command of the Booker T. Washington if she was to be manned by a segregated crew.\\\" [2]\"}],\"\\n\"]}]\n2c:[\"$\",\"p\",\"p-13\",{\"children\":\"His principled stand sparked a tense standoff, but with the backing of the NAACP, powerful labor unions, and a desperate need for captains, the Maritime Commission caved. Mulzac was granted an integrated crew, representing over a dozen nationalities and multiple races, all working harmoniously under his command.\"}]\n2d:[\"$\",\"p\",\"p-14\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/4/4b/SS_Booker_T._Washington.jpg\",\"alt\":\"The SS Booker T. Washington, a Liberty Ship\"}]}]\n2e:[\"$\",\"p\",\"p-15\",{\"children\":[\"Between 1942 and 1947, Captain Mulzac led the \",[\"$\",\"em\",\"em-0\",{\"children\":\"Booker T. Washington\"}],\" on 22 highly successful round-trip voyages. He transported approximately 18,000 soldiers and critical armaments to the European and Pacific theaters [4]. Despite facing the constant threat of Nazi U-boats and navigating treacherous war zones, Mulzac never lost a single crew member or passenger, proving definitively that an integrated crew led by a Black captain could operate with supreme excellence.\"]}]\n2f:[\"$\",\"h3\",\"h3-6\",{\"children\":\"The McCarthy Era and Blacklisting\"}]\n30:[\"$\",\"p\",\"p-16\",{\"children\":\"Mulzac returned from World War II a decorated hero, but his triumph w"])</script><script>self.__next_f.push([1,"as short-lived. Following the war, the U.S. shipping industry reverted to its discriminatory practices. Private commercial vessels once again refused to hire him as a master, stripping him of the command he had so valiantly exercised during the global crisis [3].\"}]\n31:[\"$\",\"p\",\"p-17\",{\"children\":\"To make matters worse, the post-war period ushered in the Red Scare and the McCarthy era. Mulzac’s radical past, his lifelong dedication to militant labor unions, and his outspoken socialist political views made him a prime target for the U.S. government's anti-communist witch hunts. In 1950, citing national security concerns, the Coast Guard revoked his seaman’s papers and his master’s license, effectively blacklisting him from the industry he had dedicated his life to [4].\"}]\n32:[\"$\",\"p\",\"p-18\",{\"children\":\"For a decade, Mulzac was grounded, forced to take odd jobs to survive while enduring immense political persecution. Yet, just as he had fought the shipping bosses, he fought the federal government. He engaged in a grueling 15-year legal battle to clear his name. Finally, in 1960, a federal judge ruled that the revocation of his license was unconstitutional, and his credentials were fully restored [7].\"}]\n33:[\"$\",\"h3\",\"h3-7\",{\"children\":\"Later Years and Legacy\"}]\n34:[\"$\",\"p\",\"p-19\",{\"children\":[\"At the age of 74, Mulzac briefly returned to the sea, working as a night mate—a quiet end to a tumultuous career. In 1963, he published his autobiography, \",[\"$\",\"em\",\"em-0\",{\"children\":\"A Star to Steer By\"}],\", a powerful memoir detailing his battles against the dual evils of racial capitalism and Jim Crow segregation. The book remains a seminal text in maritime and African-American history [8].\"]}]\n35:[\"$\",\"p\",\"p-20\",{\"children\":[\"Hugh Mulzac passed away in New York in 1971 at the age of 84. He left behind a legacy that transcended the ocean. By refusing to compromise his dignity and demanding equality on the decks of the \",[\"$\",\"em\",\"em-0\",{\"children\":\"SS Booker T. Washington\"}],\", he struck a massive blow against institutional racism. He proved that excellence knows no color line, and his courage paved the way for generations of minority mariners who followed in his wake. Today, Mulzac is celebrated not just as a master mariner from the Grenadines, but as a towering pioneer of the civil rights movement.\"]}]\n36:[\"$\",\"$L3a\",null,{\"title\":\"Learn about the legacy of Hugh Mulzac\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/hugh-mulzac\"}]\n37:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"Hugh Mulzac's most significant contribution was breaking the deeply entrenched racial barriers within the United States Merchant Marine. By becoming the first African-American to earn a master's license and subsequently forcing the U.S. government to allow an integrated crew on the *SS Booker T. Washington* during World War II, he set a precedent that challenged military and civilian segregation policies. His successful command of 22 wartime voyages proved unequivocally that integrated crews could function with exceptional efficiency and discipline.\\n\\nFurthermore, Mulzac was a pivotal figure in the labor movement, consistently advocating for the rights of minority workers through his involvement with the National Maritime Union. Even when faced with severe political persecution and blacklisting during the McCarthy era, he fought a successful legal battle to have his credentials restored, cementing his legacy as a lifelong champion for civil rights, economic justice, and equality in the workplace.\"}]]}]\n"])</script><script>self.__next_f.push([1,"38:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"alt\":\"A.W. \\\"Art\\\" Saunders\",\"className\":\"w-full h-full object-cover\"}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"font-serif text-lg text-navy line-clamp-1\",\"children\":\"A.W. \\\"Art\\\" Saunders\"}],[\"$\",\"span\",null,{\"className\":\"text
