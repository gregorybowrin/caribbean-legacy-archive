s\"}],[\"$\",\"div\",null,{\"className\":\"space-y-4\",\"children\":[[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1b\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0\",\"key\":\"1r0f0z\"}],[\"circle\",{\"cx\":\"12\",\"cy\":\"10\",\"r\":\"3\",\"key\":\"ilqhr7\"}]],\"className\":\"lucide-map-pin h-4 w-4 text-tropical-green mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Origin\"}],[\"$\",\"$L6\",null,{\"href\":\"/islands/saba\",\"className\":\"text-sm font-semibold hover:text-gold transition-colors\",\"children\":\"Saba\"}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1b\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M8 2v4\",\"key\":\"1cmpym\"}],[\"path\",{\"d\":\"M16 2v4\",\"key\":\"4m81vk\"}],[\"rect\",{\"width\":\"18\",\"height\":\"18\",\"x\":\"3\",\"y\":\"4\",\"rx\":\"2\",\"key\":\"1hopcy\"}],[\"path\",{\"d\":\"M3 10h18\",\"key\":\"8toen8\"}]],\"className\":\"lucide-calendar h-4 w-4 text-gold mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Life Dates\"}],[\"$\",\"span\",null,{\"className\":\"text-sm font-semibold\",\"children\":[1905,\" – \",1982]}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1b\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M12 7v14\",\"key\":\"1akyts\"}],[\"path\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\",\"key\":\"ruj8y\"}]],\"className\":\"lucide-book-open h-4 w-4 text-navy/60 mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Areas of Influence\"}],\"$L1c\"]}]]}]]}]]}]]}],\"$L1d\"]}]}]]}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2 mt-1\",\"children\":[[\"$\",\"$L6\",\"0\",{\"href\":\"/areas/history\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"History\"}]]}]\n1e:T4dd,Josephus Lambert \"Lambee\" Hassell (1906–1983) stands as one of the most legendary and visionary figures in the history of the Dutch Caribbean. Born on the five-square-mile volcanic island of Saba, a rugged outpost rising dramatically from the turquoise waters of the northeastern Caribbean Sea, Hassell defied colonial authority, European academic consensus, and seemingly insurmountable topographical barriers to engineer and construct the island's primary vehicular highway. Widely known as \"The Road That Couldn't Be Built,\" this astonishing engineering marvel transformed Saba from an isolated, vertical archipelago community dependent on grueling manual porterage into a modern, interconnected island economy. Working without heavy construction machinery, formal university credentials, or outside funding, Hassell acquired his civil engineering knowledge through correspondence courses while working abroad in Aruba. Over a span of twenty-five years, he mobilized and led local Saban labor crews to carve an 8.7-mile highway directly out of sheer volcanic cliffs. His life and achievement remain a monumental testament to Caribbean self-reliance, ingenuity, and grassroots determination against the pronouncements of foreign experts [1]."])</script><script>self.__next_f.push([1,"1d:[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Josephus \\\"Lambee\\\" Hassell\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1b\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Josephus \\\"Lambee\\\" Hassell: The Self-Taught Saban Engineer Who Built the Impossible Road\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"$1e\"}],\"\\n\",[\"$\",\"h3\",\"h3-1\",{\"children\":\"The Geography of Isolation: Pre-Road Saba and \\\"The Ladder\\\"\"}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":\"To understand the magnitude of Lambee Hassell's achievement, one must examine the punishing topography of pre-20th-century Saba. Unlike neighboring Caribbean islands fringed by sandy beaches and expansive coastal plains, Saba is essentially the apex of a dormant submarine volcano, dominated by the towering Mount Scenery, which rises 887 meters (2,910 feet) above sea level—making it the highest point in the entire Kingdom of the Netherlands [2]. The coastline consists almost entirely of sheer sea cliffs and jagged boulders, offering no natural deep-water harbors. For over two centuries of European settlement, physical movement across the island was an exhausting trial of human endurance. Communications between the four principal settlements—The Bottom (the capital), St. John's, Windwardside, and Hell's Gate (Zion's Hill)—were conducted entirely on foot or via donkey along treacherous, narrow mountain footpaths carved into precipitous ravines [3].\"}],\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\"]}]]}],\"$L34\",\"$L35\",false]}],\"$L36\"]}]\n"])</script><script>self.__next_f.push([1,"37:I[62682,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n38:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/6/6f/Saba_in_its_region.svg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/e/e0/Flag_of_Saba.svg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1f:[\"$\",\"p\",\"p-2\",{\"children\":\"The most famous symbol of this physical isolation was \\\"The Ladder,\\\" a steep stone stairway consisting of over 800 worn steps ascending directly up the vertical cliffside from Ladder Bay to the capital village of The Bottom. Every piece of cargo arriving on the island—from barrels of flour, building lumber, and heavy iron stoves to medical supplies and even grand pianos—had to be landed through heavy surf onto rocky shores and manually hauled up the grueling elevation on the backs of Saban men and donkeys [4]. This extreme geographic isolation fostered a fiercely independent community, but it severely stunted economic growth, healthcare delivery, and social modernization. For generations, Sabans accepted this vertical isolation as an immutable fact of nature.\"}]\n20:[\"$\",\"h3\",\"h3-2\",{\"children\":\"Colonial Skepticism and the Verdict of European Experts\"}]\n21:[\"$\",\"p\",\"p-3\",{\"children\":\"By the 1920s and 1930s, as motor vehicles became common across the broader Caribbean region, the Dutch colonial administration in Curacao and The Hague began exploring the possibility of modernizing Saba's infrastructure. Prominent Dutch and Swiss civil engineers were dispatched across the Atlantic to inspect the island's topography and conduct feasibility studies for a vehicular road. After surveying the vertical inclines, crumbling volcanic rock formations, deep gorges, and frequent landslides, these European experts reached a unanimous and definitive conclusion: building a vehicular highway on Saba was both practically and scientifically impossible [5].\"}]\n22:[\"$\",\"p\",\"p-4\",{\"children\":\"The engineers reported back to colonial authorities that any attempt to blast roads out of the vertical volcanic cliffs would result in catastrophic rockslides, and that the gradients required to reach villages like Windwardside and Hell's Gate far exceeded the safe operating limits of motor vehicles. They officially ruled that Saba must remain a pedestrian island forever. This dismissal reflected a pervasive colonial paternalism that often underestimated the adaptability and resilience of Caribbean populations. While colonial officials accepted the verdict and shelved plans for road construction, the young Josephus Lambert Hassell refused to accept that his homeland was condemned to permanent backwardness [6].\"}]\n23:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"The foreign engineers came with their instruments and formulas, looked at our vertical cliffs, and declared that a road couldn't be built. But they didn't know the Saban heart. Lambee knew every rock on this mountain, and where they saw impossibility, he saw a geometry waiting to be unlocked by our own hands.\\\" — Local Saban oral history [7]\"}],\"\\n\"]}]\n24:[\"$\",\"h3\",\"h3-3\",{\"children\":\"Exile in Aruba and the Correspondence Course Awakening\"}]\n25:[\"$\",\"p\",\"p-5\",{\"children\":\"Born in 1906, Lambee Hassell grew up navigating the steep trails of Saba. Possessing an exceptional natural aptitude for mathematics, carpentry, and mechanics, he developed an intuitive grasp of spatial geometry and structural balance. Like many young Saban men of his generation who sought economic opportunities beyond their small"])</script><script>self.__next_f.push([1," island, Hassell migrated south to the island of Aruba in the late 1920s [8]. There, he found employment at the massive Lago Oil \u0026 Transport Company refinery in San Nicolas, which was rapidly expanding to process Venezuelan crude oil.\"}]\n26:[\"$\",\"p\",\"p-6\",{\"children\":[\"In Aruba, Hassell was immersed in a dynamic, modern industrial environment alongside migrant workers from across the Caribbean, interacting with emerging cultural and political figures such as Aruban musical icon \",[\"$\",\"$L37\",\"a-0\",{\"slug\":\"rufo-wever\",\"href\":\"/profiles/rufo-wever\",\"children\":\"Rufo Wever\"}],\" and regional intellectual leaders. Working around complex refinery infrastructure, industrial machinery, and concrete civil works, Hassell became convinced that the engineering principles transforming Aruba could be adapted to tame the slopes of Saba. Unwilling to let the lack of formal university schooling hold him back, he enrolled in a rigorous correspondence course in civil engineering through the mail [9]. Working late into the night in his Aruban boarding house after exhausting shifts at the refinery, Hassell meticulously studied surveying, soil mechanics, structural masonry, grading, and trigonometry. He calculated slope gradients, curve radii, and retaining wall dynamics, tailoring every theoretical lesson directly to the specific topography of his native Saba. Armed with his mail-order engineering diploma and an unshakeable conviction, he returned home in the mid-1930s determined to build the impossible road.\"]}]\n27:[\"$\",\"p\",\"p-7\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/6/6f/Saba_in_its_region.svg\",\"alt\":\"Topographic and location map of Saba within the Caribbean archipelago\"}]}]\n28:[\"$\",\"h3\",\"h3-4\",{\"children\":\"Breaking Ground: Manual Labor and the Construction of \\\"The Road\\\"\"}]\n29:[\"$\",\"p\",\"p-8\",{\"children\":\"Upon returning to Saba, Hassell faced immense skepticism not only from Dutch administrators but also from some local residents who feared the project would waste meager public funds or cause fatal accidents. Undeterred, he lobbied local administrator Johan Meeter and convinced him to authorize a modest experimental excavation. In 1938, under Hassell's leadership, construction officially began on the first segment of highway connecting Fort Bay harbor to the capital village of The Bottom [10].\"}]\n2a:[\"$\",\"p\",\"p-9\",{\"children\":\"Because the colonial government provided virtually no funding for heavy machinery, \\\"The Road\\\" was constructed almost entirely by hand. Hassell organized teams of local Saban workers—farmers, sailors, and craftsmen—into dedicated road crews. Using basic hand tools such as wheelbarrows, crowbars, pickaxes, shovels, and sledgehammers, the men chipped away at the stubborn basalt and hand-mixed thousands of tons of concrete [11]. Hassell served as master surveyor, project engineer, and foreman. He walked miles ahead of the crews every day, using basic sighting levels and plumb bobs to stake out hairpin turns and calculate precise inclines that would allow vehicles to ascend safely without stalling or slipping.\"}]\n2b:[\"$\",\"ul\",\"ul-0\",{\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":[[\"$\",\"strong\",\"strong-0\",{\"children\":\"Innovative Retaining Walls:\"}],\" To prevent landslides along the precipitous drops, Hassell engineered massive, dry-stacked and mortar-reinforced stone retaining walls using local volcanic boulders cleared from the path.\"]}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":[[\"$\",\"strong\",\"strong-0\",{\"children\":\"Concrete Paving:\"}],\" Recognizing that asphalt would quickly wash away during torrential tropical downpours on steep inclines, Hassell insisted on paving the entire road surface with durable, hand-troweled concrete scored with traction grooves.\"]}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":[[\"$\",\"strong\",\"strong-0\",{\"children\":\"Precision Hairpin Turns:\"}],\" He designed sweeping, elevated switchbacks that conquered gradients exceeding 20 percent, seamlessly integrating the roadway into the natural contours of the mountain.\"]}],\"\\n\"]}]\n2c:[\"$\",\"blockquote\",\"blockquote-1\",{"])</script><script>self.__next_f.push([1,"\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"We had no bulldozers, no cranes, and no university professors guiding us. We had Lambee with his spirit level, our muscle, and a collective determination to lift Saba out of the ravine. Every yard of concrete poured was a victory over colonial doubt.\\\" — Saban road worker recounting the construction [12]\"}],\"\\n\"]}]\n2d:[\"$\",\"h3\",\"h3-5\",{\"children\":\"The 1947 Jeep Arrival and Connecting the Island Villages\"}]\n2e:[\"$\",\"p\",\"p-10\",{\"children\":\"The monumental effort bore its first dramatic fruit in 1943 when the initial segment from Fort Bay to The Bottom was completed. However, the true watershed moment in Saban history occurred on March 17, 1947. On that day, a landing craft arrived at Fort Bay carrying the island's very first motor vehicle: a rugged Jeep [13]. Amidst sheer jubilance and island-wide celebration, local resident Oliver \\\"Ally\\\" Zagers took the wheel and drove the Jeep up the newly cured concrete highway into The Bottom. For the first time in Saba's history, cargo and passengers ascended the mountain propelled by an engine rather than human muscle. The myth of the impossible road was shattered forever.\"}]\n2f:[\"$\",\"p\",\"p-11\",{\"children\":\"Spurred by this triumphant validation, Hassell and his crews pushed relentlessly forward over the next two decades. Between 1947 and 1958, the road was extended upward through breathtaking vertical elevations to reach the hillside settlement of St. John's and the picturesque village of Windwardside. By 1963, the final segment was completed, linking Hell's Gate (Zion's Hill) and descending toward Flat Point, where the Juancho E. Yrausquin Airport would eventually be built [14]. When completed, the continuous 8.7-mile highway linked every major settlement on the island, fundamentally revolutionizing Saban society. Emergency medical cases could now be transported in minutes rather than hours, school attendance soared, and agricultural trade flourished.\"}]\n30:[\"$\",\"p\",\"p-12\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/e/e0/Flag_of_Saba.svg\",\"alt\":\"Official flag of Saba, featuring red, white, and blue colors symbolizing links to the Netherlands and a star representing the island\"}]}]\n31:[\"$\",\"h3\",\"h3-6\",{\"children\":\"Legacy, Engineering Monument, and Cultural Assessment\"}]\n32:[\"$\",\"p\",\"p-13\",{\"children\":\"Josephus Lambert \\\"Lambee\\\" Hassell passed away in 1983, but his masterpiece endures as the literal backbone of Saba. Today, \\\"The Road\\\" is maintained in pristine condition and stands as one of the most remarkable feats of civil engineering in the Caribbean region. It draws civil engineers, historians, and travelers from around the globe who marvel at its thrilling curves and structural integrity. In recognition of his historic achievement, the government erected a commemorative marble plaque embedded directly into the volcanic rock face along The Road near St. John's, honoring the man whose vision united the island [15].\"}]\n33:[\"$\",\"p\",\"p-14\",{\"children\":[\"Hassell's life story embodies the broader narrative of Caribbean decolonization and self-mastery. Much like how economic visionaries such as \",[\"$\",\"$L37\",\"a-0\",{\"slug\":\"arthur-lewis\",\"href\":\"/profiles/arthur-lewis\",\"children\":\"Arthur Lewis\"}],\" conceptualized structural development for the West Indies, and cultural pioneers like \",[\"$\",\"$L37\",\"a-1\",{\"slug\":\"derek-walcott\",\"href\":\"/profiles/derek-walcott\",\"children\":\"Derek Walcott\"}],\" built an indigenous literary architecture, Lambee Hassell proved that Caribbean people possessed the intellectual capacity and technical brilliance to shape their own physical destiny. His story, chronicled extensively in Gerard van Veen's biographical work \",[\"$\",\"em\",\"em-0\",{\"children\":\"Lambee \u0026 The Road That Couldn't Be Built\"}],\", remains an enduring source of national pride for Saba and a permanent monument to the power of self-taught genius over conventional skepticism.\"]}]\n34:[\"$\",\"$L38\",null,{\"title\":\"Learn about the legacy of Josephus \\\"Lambee\\\" Hassell\",\"url\":\"https://caribbeanlegacyarchive.com/profil"])</script><script>self.__next_f.push([1,"es/lambee-hassell\"}]\n35:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"Josephus Lambert \\\"Lambee\\\" Hassell made a monumental contribution to the island of Saba and Caribbean civil engineering by single-handedly designing and supervising the construction of \\\"The Road That Couldn't Be Built.\\\" Facing unanimous skepticism from European civil engineers who declared that vehicular roads across Saba's precipitous volcanic cliffs were physically impossible, Hassell took correspondence courses in civil engineering while working in Aruba and adapted industrial techniques to his island's unique topography.\\n\\nBetween 1938 and 1963, Hassell mobilized and led local Saban crews to hand-build an 8.7-mile continuous concrete highway connecting Fort Bay harbor, The Bottom, St. John's, Windwardside, and Hell's Gate without heavy machinery. His visionary engineering broke centuries of severe geographical isolation, revolutionized island transportation and healthcare delivery, and established an enduring symbol of Caribbean self-reliance and grassroots ingenuity.\"}]]}]\n"])</script><script>self.__next_f.push([1,"36:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"alt\":\"A.W. \\\"Art\\\" Saunders\",\"className\":\"w-full h-full object-cover\"}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"font-serif text-lg text-navy line-clamp-1\",\"children\":\"A.W. \\\"Art\\\" Saunders\"}],[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40\",\"children\":\"Turks \u0026 Caicos Islands\"}]]}]]}],[\"$\",\"$L6\",\"c0c62444-53a6-4e76-beb3-50dff472d653\",{\"href\":\"/profiles/adelaide-bernabela\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"div\",null,{\"className\":\"flex items-center justify-center font-bold text-white shadow-lg bg-gradient-to-br from-slate-700 to-slate-500 text-xl w-full h-full rounded-none\",\"aria-label\":\"Profile picture placeholder for Adelaide Bernabela\",\"title\":\"Adelaide Bernabela\",\"children\":[\"$\",\"span\",null,{\"className\":\"drop-shadow-md tracking-wider\",\"children\":\"AB\"}]}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"font-serif text-lg text-navy line-clamp-1\",\"children\":\"Adelaide Bernabela\"}],[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40\",\"children\":\"Bonaire\"}]]}]]}]]}]]}]\n"])</script></body></html>
