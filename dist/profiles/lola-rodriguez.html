_f.push([1,"1d:[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Lola Rodríguez de Tió\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Introduction\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"Dolores \\\"Lola\\\" Rodríguez de Astudillo y Ponce de León, known to history as Lola Rodríguez de Tió (September 14, 1843 – November 10, 1924), was a defining figure in the intellectual, political, and cultural landscape of the Caribbean. A revolutionary poet, pioneering feminist, and fierce advocate for the independence of both Puerto Rico and Cuba, her life was a testament to the power of words in the struggle against colonial oppression. In an era when women were largely confined to the domestic sphere and deprived of formal intellectual agency, Rodríguez de Tió defied all expectations. She shattered the restrictive gender norms of nineteenth-century Spanish colonial society, emerging as a paramount voice for liberation, human rights, and Caribbean solidarity.\"}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":\"Her legacy is etched into the very soul of Puerto Rico, most notably through her authorship of the original, revolutionary lyrics to \\\"La Borinqueña\\\"—a fiery call to arms that became the anthem of the independence movement. Beyond her nationalist fervour, she was a dedicated abolitionist and an early champion of women's education, believing deeply that political liberation was impossible without the social and intellectual emancipation of women.\"}],\"\\n\",[\"$\",\"h3\",\"h3-1\",{\"children\":\"Early Life and Defiance of Social Norms\"}],\"\\n\",[\"$\",\"p\",\"p-2\",{\"children\":\"Born on September 14, 1843, in the southwestern town of San Germán, Puerto Rico, Lola was raised in a privileged and aristocratic environment. Her father, Sebastián Rodríguez de Astudillo, was a prominent lawyer and magistrate, while her mother, Carmen Ponce de León, was a descendant of the island's early Spanish colonizers. Despite their elite status, her family cultivated an environment that valued intellectual curiosity and humanist ideals. Home-tutored by her parents and private instructors, the young Lola demonstrated a precocious intellect and an insatiable appetite for literature, history, and political philosophy.\"}],\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\",\"\\n\",\"$L37\",\"\\n\",\"$L38\",\"\\n\",\"$L39\"]}]]}],\"$L3a\",\"$L3b\",false]}],\"$L3c\"]}]\n"])</script><script>self.__next_f.push([1,"3d:I[62682,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n3e:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/3/33/Bandera_del_Grito_de_Lares.svg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1e:[\"$\",\"p\",\"p-3\",{\"children\":\"Even in her youth, she exhibited a fiercely independent spirit that challenged the restrictive customs imposed on women of her class. In a profound act of personal rebellion, she demanded to cut her hair short—an unheard-of stylistic choice for a woman of her standing in the 1850s. This cropped hairstyle became a lifelong personal trademark, serving as a visible, daily rejection of the superficial expectations of femininity and a bold assertion of her autonomy.\"}]\n1f:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"She famously defied expectations regarding appearance and behavior, demanding to wear her hair short—a life-long personal trademark that symbolized her refusal to conform to anti-women social norms.\\\"\"}],\"\\n\"]}]\n20:[\"$\",\"p\",\"p-4\",{\"children\":\"Her early life was also shaped by the oppressive reality of Spanish colonial rule. Puerto Rico in the mid-19th century was a society deeply stratified by class and race, reliant on the brutal system of chattel slavery, and governed by authoritarian dictates from Madrid. Growing up in this environment, Rodríguez de Tió developed a profound empathy for the marginalized and a burning resentment against colonial tyranny.\"}]\n21:[\"$\",\"h3\",\"h3-2\",{\"children\":\"Literary Awakening and \\\"Mis Cantares\\\"\"}]\n22:[\"$\",\"p\",\"p-5\",{\"children\":\"In 1863, she married Bonocio Tió Segarra, a prominent journalist and poet who shared her liberal and abolitionist views. Their home quickly transformed into a vibrant intellectual salon, a clandestine gathering place where writers, politicians, and dissidents congregated to discuss art, philosophy, and the forbidden topic of independence.\"}]\n23:[\"$\",\"p\",\"p-6\",{\"children\":[\"Her literary career blossomed during this period. In 1876, she published her first collection of poetry, \",[\"$\",\"em\",\"em-0\",{\"children\":\"Mis Cantares\"}],\" (My Songs), in Mayagüez. The book was a critical success, selling out rapidly and establishing her as a formidable voice in Latin American literature. \",[\"$\",\"em\",\"em-1\",{\"children\":\"Mis Cantares\"}],\" was deeply romantic in style, yet heavily infused with patriotic undertones. Through her verses, she captured the lush beauty of the Puerto Rican landscape while subtly weaving in themes of liberty, identity, and the yearning for self-determination. Her poetry was not merely artistic expression; it was a political instrument designed to awaken the national consciousness of her people.\"]}]\n24:[\"$\",\"h3\",\"h3-3\",{\"children\":\"The Anthem of a Revolution: La Borinqueña\"}]\n25:[\"$\",\"p\",\"p-7\",{\"children\":[\"Rodríguez de Tió's most enduring contribution to the Puerto Rican independence movement occurred in 1868, in the fervent build-up to the \",[\"$\",\"em\",\"em-0\",{\"children\":\"Grito de Lares\"}],\"—the first major revolt against Spanish rule on the island. Inspired by the revolutionary spirit sweeping the Caribbean, she penned original lyrics to the melody of a popular danza, transforming it into a revolutionary anthem known as \\\"La Borinqueña.\\\"\"]}]\n26:[\"$\",\"p\",\"p-8\",{\"children\":\"Her lyrics were a direct, unabashed call for armed insurrection. They rejected passivity and demanded that Puerto Ricans take up their machetes to fight for freedom, drawing direct inspiration from the ongoing liberation struggles in neighbori"])</script><script>self.__next_f.push([1,"ng Cuba:\"}]\n27:[\"$\",\"blockquote\",\"blockquote-1\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"¡Despierta, borinqueño, que han dado la señal!\\n¡Despierta de ese sueño, que es hora de luchar!\\nA ese llamar patriótico ¿no arde tu corazón?\\n¡Ven! Nos será simpático el ruido del cañón.\"}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":\"Mira, ya el cubano libre será;\\nle dará el machete su libertad...\"}],\"\\n\",[\"$\",\"p\",\"p-2\",{\"children\":\"...Ya no queremos déspotas, caiga el tirano ya,\\nlas mujeres indómitas también sabrán luchar.\"}],\"\\n\"]}]\n28:[\"$\",\"p\",\"p-9\",{\"children\":[\"$\",\"em\",\"em-0\",{\"children\":\"(Awake, Borinqueño, they have given the signal! / Awake from that sleep, it is time to fight! / To this patriotic call, does your heart not burn? / Come! The roar of the cannon will be music to our ears... / Look, the Cuban will soon be free; / the machete will give him his liberty... / We no longer want despots, let the tyrant fall now, / the unconquerable women will also know how to fight.)\"}]}]\n29:[\"$\",\"p\",\"p-10\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/3/33/Bandera_del_Grito_de_Lares.svg\",\"alt\":\"Flag of the Grito de Lares\"}]}]\n2a:[\"$\",\"p\",\"p-11\",{\"children\":[\"The \",[\"$\",\"em\",\"em-0\",{\"children\":\"Grito de Lares\"}],\" ultimately failed to secure independence, but Rodríguez de Tió's words lived on, becoming the sacred hymn of Puerto Rican patriotism. Her inclusion of the line \\\"las mujeres indómitas también sabrán luchar\\\" was particularly revolutionary, seamlessly integrating the feminist struggle into the broader fight for national liberation.\"]}]\n2b:[\"$\",\"h3\",\"h3-4\",{\"children\":\"Exile and Caribbean Solidarity\"}]\n2c:[\"$\",\"p\",\"p-12\",{\"children\":\"Because of her subversive writings and her family's active support for the independence movement, the Spanish authorities branded Lola Rodríguez de Tió an enemy of the state. She and her husband were subjected to intense surveillance, harassment, and ultimately, repeated banishments from their homeland.\"}]\n2d:[\"$\",\"p\",\"p-13\",{\"children\":\"Their first exile took them to Caracas, Venezuela, in 1877, where they were warmly received by the local intellectual community. However, the pull of the Caribbean independence struggle drew them to Cuba, and later to New York City in the 1890s.\"}]\n2e:[\"$\",\"p\",\"p-14\",{\"children\":[\"New York was the epicenter of the Antillean exile community, a hotbed of revolutionary activity where dissidents plotted the downfall of the Spanish empire. Here, Rodríguez de Tió cemented her alliance with the towering figure of the Cuban independence movement, \",[\"$\",\"$L3d\",\"a-0\",{\"slug\":\"jose-marti\",\"href\":\"/profiles/jose-marti\",\"children\":\"José Martí\"}],\". Martí deeply respected her intellect and political acumen, viewing her as an equal partner in the struggle. She became highly active in the Cuban Revolutionary Party, organizing fundraising efforts and serving as president of the \\\"Rius Rivera\\\" political club in 1896, a rare leadership role for a woman at the time.\"]}]\n2f:[\"$\",\"p\",\"p-15\",{\"children\":\"It was during this period of exile that she penned the immortal lines that forever bound the destinies of Cuba and Puerto Rico:\"}]\n30:[\"$\",\"blockquote\",\"blockquote-2\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[[\"$\",\"em\",\"em-0\",{\"children\":\"Cuba y Puerto Rico son\"}],\"\\n\",[\"$\",\"em\",\"em-1\",{\"children\":\"de un pájaro las dos alas,\"}],\"\\n\",[\"$\",\"em\",\"em-2\",{\"children\":\"reciben flores y balas\"}],\"\\n\",[\"$\",\"em\",\"em-3\",{\"children\":\"sobre el mismo corazón.\"}]]}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":\"(Cuba and Puerto Rico are / the two wings of one bird, / they receive flowers and bullets / over the same heart.)\"}],\"\\n\"]}]\n31:[\"$\",\"p\",\"p-16\",{\"children\":\"This poignant stanza from her poem \\\"A Cuba\\\" encapsulated the shared history, cultural affinity, and mutual suffering of the two islands under Spanish colonialism. It remains one of the most widely quoted verses in Caribbean literature, a timeless symbol of Antillean solidarity.\"}]\n32:[\"$\",\"h3\",\"h3-5\",{\"children\":\"Pioneering Caribbean Feminism\"}]\n33:[\"$\",\"p\",\"p-17\",{\"children\":"])</script><script>self.__next_f.push([1,"\"While her contributions to nationalism are legendary, Rodríguez de Tió was equally radical in her feminism. She recognized that the liberation of a nation was hollow if half its population remained subjugated by patriarchal customs. She was a fierce critic of the religious and social doctrines that sought to keep women uneducated and confined to domestic servitude.\"}]\n34:[\"$\",\"p\",\"p-18\",{\"children\":\"In 1884, during the inauguration of a school for young women in Mayagüez, she delivered a groundbreaking speech titled \\\"La educación de la mujer\\\" (The Education of Women). In this speech, she articulated a progressive vision where women were granted equal access to intellectual and academic resources. She argued that denying women education was a deliberate mechanism of control, and that an educated female populace was essential for the advancement of modern society.\"}]\n35:[\"$\",\"p\",\"p-19\",{\"children\":\"She viewed education not just as a tool for personal enlightenment, but as a political necessity. In 1908, she urged her fellow citizens to embrace global knowledge, declaring: \\\"We should be a pueblo that can understand itself in all languages!\\\" Her feminism was intrinsically linked to her anti-colonialism; she understood that breaking the chains of empire required breaking the chains of gender inequality.\"}]\n36:[\"$\",\"h3\",\"h3-6\",{\"children\":\"Later Years and Enduring Legacy\"}]\n37:[\"$\",\"p\",\"p-20\",{\"children\":\"Following the Spanish-American War of 1898, Puerto Rico transitioned from Spanish colonial rule to American military occupation. Deeply disillusioned by the United States' refusal to grant Puerto Rico its independence, Rodríguez de Tió chose not to return to her homeland permanently. Instead, she and her family relocated to a newly independent Cuba in 1899, settling in Havana.\"}]\n38:[\"$\",\"p\",\"p-21\",{\"children\":\"In Cuba, she was treated as a national hero. She continued her literary and cultural work, helping to found the Cuban Academy of Arts and Letters in 1901 and serving as a vital bridge between the intellectual communities of Havana and San Juan. She lived out the remainder of her days in Cuba, remaining an outspoken advocate for social justice until her death on November 10, 1924, at the age of 81.\"}]\n39:[\"$\",\"p\",\"p-22\",{\"children\":\"Today, Lola Rodríguez de Tió is revered as a founding mother of Puerto Rican nationalism and Caribbean feminism. Her original lyrics to \\\"La Borinqueña\\\" continue to be sung by those who dream of a free Puerto Rico. Her life stands as a powerful testament to the indomitable spirit of Caribbean women, proving true her own prophetic words: the unconquerable women will always know how to fight.\"}]\n3a:[\"$\",\"$L3e\",null,{\"title\":\"Learn about the legacy of Lola Rodríguez de Tió\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/lola-rodriguez\"}]\n3f:T4b4,Lola Rodríguez de Tió’s major contributions span the realms of literature, political activism, and feminist thought. As a revolutionary poet, she galvanized the Puerto Rican independence movement by writing the original, radical lyrics to \"La Borinqueña,\" which served as the battle hymn for the Grito de Lares uprising. Her famous verse declaring that 'Cuba and Puerto Rico are the two wings of one bird' remains the definitive cultural and political expression of Antillean solidarity, cementing her role as a key architect of the shared liberation struggle alongside figures like José Martí.\n\nBeyond her nationalist achievements, she was a pioneering feminist who fearlessly challenged the patriarchal norms of 19th-century Spanish colonial society. By fiercely advocating for women's access to education—most notably in her 1884 address 'La educación de la mujer'—and asserting women's rightful place in the political sphere, she laid the intellectual groundwork for the modern women's rights movement in the Caribbean. Her lifelong dedication to the abolition of slavery and the emancipation of women proved that she viewed social justice and national independence as inseparable causes.3b:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 bor"])</script><script>self.__next_f.push([1,"der-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"$3f\"}]]}]\n"])</script><script>self.__next_f.push([1,"3c:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"
