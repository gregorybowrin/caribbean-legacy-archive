ey\":\"1hopcy\"}],[\"path\",{\"d\":\"M3 10h18\",\"key\":\"8toen8\"}]],\"className\":\"lucide-calendar h-4 w-4 text-gold mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Life Dates\"}],[\"$\",\"span\",null,{\"className\":\"text-sm font-semibold\",\"children\":[1921,\" – \",2004]}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M12 7v14\",\"key\":\"1akyts\"}],[\"path\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\",\"key\":\"ruj8y\"}]],\"className\":\"lucide-book-open h-4 w-4 text-navy/60 mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Areas of Influence\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2 mt-1\",\"children\":[]}]]}]]}]]}]]}]]}],[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[\"$L1b\",\"$L1c\",\"$L1d\"]}]]}]}]]}]\n"])</script><script>self.__next_f.push([1,":HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1b:[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Margaret Burton\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Early Life and the Barbudan Context\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[[\"$\",\"strong\",\"strong-0\",{\"children\":\"Margaret Burton\"}],\" was born in the heart of \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"Codrington\"}],\", the singular settlement on the island of Barbuda, during a period of profound transition and persistent hardship for the Caribbean in the early 20th century. At the time of her birth, Barbuda was largely isolated, characterized by its unique communal land ownership system and a fiercely independent population that subsisted primarily on fishing, agriculture, and livestock. Unlike its sister island of Antigua, which was heavily dominated by sugar plantations and possessed a sprawling, albeit inequitable, colonial infrastructure, Barbuda was geographically, economically, and politically marginalized. This systemic marginalization deeply affected the island's social services, with its educational institutions suffering the most acute neglect.\"]}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":\"During Burton's childhood, formal education in Barbuda was primarily administered by religious missions, most notably the Anglican Church. The schools were rudimentary at best, typically housed in fragile, multi-purpose wooden structures that doubled as parish halls, storm shelters, or community meeting spaces. These early learning environments were severely under-resourced. Students shared worn, outdated textbooks passed down through generations, and the curriculum was rigidly colonial, offering little reflection of the students' lived realities or the rich, complex history of the Caribbean. More critically, the physical structures themselves were highly vulnerable to the frequent hurricanes that swept through the Leeward Islands, often leaving children without a place to learn for months at a time.\"}],\"\\n\",[\"$\",\"p\",\"p-2\",{\"children\":\"It was within this challenging, resource-scarce environment that a young Margaret Burton first developed a profound appreciation for learning. Guided by the few dedicated, overworked educators who managed to inspire their students despite the bleak conditions, Burton demonstrated an early and voracious appetite for knowledge. Her early experiences instilled in her a lifelong conviction: that the children of Barbuda were as intellectually capable as any in the British Empire, but were being systematically held back by the poverty of their physical surroundings.\"}],\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\"]}]]}],\"$L35\",\"$L36\",false]}]\n"])</script><script>self.__next_f.push([1,"1d:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"alt\":\"A.W. \\\"Art\\\" Saunders\",\"className\":\"w-full h-full object-cover\"}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"font-serif text-lg text-navy line-clamp-1\",\"children\":\"A.W. \\\"Art\\\" Saunders\"}],[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40\",\"children\":\"Turks \u0026 Caicos Islands\"}]]}]]}],[\"$\",\"$L6\",\"c0c62444-53a6-4e76-beb3-50dff472d653\",{\"href\":\"/profiles/adelaide-bernabela\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"div\",null,{\"className\":\"flex items-center justify-center font-bold text-white shadow-lg bg-gradient-to-br from-slate-700 to-slate-500 text-xl w-full h-full rounded-none\",\"aria-label\":\"Profile picture placeholder for Adelaide Bernabela\",\"title\":\"Adelaide Bernabela\",\"children\":[\"$\",\"span\",null,{\"className\":\"drop-shadow-md tracking-wider\",\"children\":\"AB\"}]}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"font-serif text-lg text-navy line-clamp-1\",\"children\":\"Adelaide Bernabela\"}],[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40\",\"children\":\"Bonaire\"}]]}]]}]]}]]}]\n"])</script><script>self.__next_f.push([1,"37:I[62682,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n38:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/a/ae/Antigua_and_Barbuda_location_map.svg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/4/4b/Codrington_lagoon.jpg\",\"image\"]\n1e:[\"$\",\"h3\",\"h3-1\",{\"children\":\"The Pursuit of Knowledge Beyond the Lagoon\"}]\n1f:[\"$\",\"p\",\"p-3\",{\"children\":\"Recognizing her exceptional academic aptitude, Burton's family, supported by the local clergy and community pooling of funds, made the significant financial and emotional sacrifice to send her to Antigua to continue her secondary education. At the time, there were simply no secondary schools on Barbuda; the island's youth were expected to conclude their education at the primary level and integrate into the local agrarian economy. The journey across the rough, unpredictable waters to St. John's marked a monumental turning point in Burton's life.\"}]\n20:[\"$\",\"p\",\"p-4\",{\"children\":\"In Antigua, she was exposed to a drastically different educational landscape. While still flawed and heavily stratified by class and color, Antiguan schools possessed dedicated, brick-and-mortar buildings, standardized curricula, and a relatively steady supply of educational materials. This stark contrast served as a profound political and social awakening for Burton. She realized that the severe limitations placed on Barbudan children were not natural, geographic inevitabilities, but rather the direct result of systemic neglect and deeply unequal resource allocation by the colonial administration.\"}]\n21:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"A child's potential is not limited by the shores of their island, but by the walls of their classroom. We must build walls that inspire, not confine.\\\"\"}],\"\\n\"]}]\n22:[\"$\",\"p\",\"p-5\",{\"children\":\"Burton excelled in her studies in St. John's, eventually enrolling in a prestigious teacher training program. Here, she absorbed emerging educational philosophies that emphasized holistic student development and the critical importance of a conducive, safe learning environment. She became a voracious reader, studying the progressive educational reforms occurring in post-war Britain and the broader Caribbean. However, her ambition was never to escape Barbuda or assimilate permanently into Antiguan society. Rather, her singular goal was to equip herself with the intellectual and pedagogical tools necessary to uplift her home island. Upon completing her training and achieving her certification, she immediately returned to Codrington, accepting a low-paying position as a primary school teacher.\"}]\n23:[\"$\",\"h3\",\"h3-2\",{\"children\":\"Return to Codrington and the Reality of Teaching\"}]\n24:[\"$\",\"p\",\"p-6\",{\"children\":\"Returning to Barbuda as a certified educator, Burton was quickly confronted by the harsh, unchanged realities she had temporarily left behind. The primary school in Codrington was drastically overcrowded, with sometimes up to sixty children of varying ages and abilities crammed into a single, poorly ventilated room. The noise was deafening, the tropical heat stifling, and the complete lack of basic amenities like proper desks, blackboards, and sanitary facilities severely hampered the teaching process.\"}]\n25:[\"$\",\"p\",\"p-7\",{\"children\":\"Burton proved to be an exceptionally innovative and tireless teacher. She frequently organized outdoor classes under the shade of the island's abundant sea grape and tamarind trees to escape the oppressive heat of the schoolhouse. She utilized local materials to create rudimentary teaching aids and infused her lessons with Barbudan history and folklore, aiming to foster a sense of pride and cultural identit"])</script><script>self.__next_f.push([1,"y in her students. Yet, she recognized that her individual pedagogical efforts were ultimately insufficient. The structural deficits of the educational system were too vast to be overcome by enthusiasm and creativity alone. The island needed modern, purpose-built educational facilities if its youth were to have any hope of competing in a rapidly modernizing, post-colonial world.\"}]\n26:[\"$\",\"p\",\"p-8\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/a/ae/Antigua_and_Barbuda_location_map.svg\",\"alt\":\"Map of Antigua and Barbuda\"}]}]\n27:[\"$\",\"h3\",\"h3-3\",{\"children\":\"The Birth of a Facility Advocate\"}]\n28:[\"$\",\"p\",\"p-9\",{\"children\":[\"Transitioning from a dedicated classroom teacher to a fierce, unrelenting facility advocate, Burton began a highly organized campaign to modernize Barbuda's schools. Her advocacy was multifaceted, targeting both the local \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Barbuda Council\"}],\" and the increasingly autonomous central government in Antigua. She started at the grassroots level by mobilizing the community in Codrington, organizing weekly town hall meetings to discuss the dire state of the island's educational infrastructure. Burton possessed a unique, charismatic ability to articulate the community's long-held frustrations, transforming vague grievances into a focused, undeniable political demand for structural change.\"]}]\n29:[\"$\",\"p\",\"p-10\",{\"children\":\"She meticulously documented the severe deficiencies of the existing schools, compiling extensive reports on overcrowding, structural hazards, and the direct correlation between the poor physical environment and dismal student performance metrics. Burton didn't just highlight the problems; she proactively presented concrete, evidence-based solutions. She drafted preliminary proposals for new school designs, emphasizing the urgent need for robust, hurricane-resistant architecture, separate classrooms tailored for different age groups, a dedicated library space to foster independent reading, and modern sanitation blocks to ensure public health.\"}]\n2a:[\"$\",\"p\",\"p-11\",{\"children\":[\"Her aggressive advocacy frequently brought her into direct conflict with government officials in St. John's, who often dismissed Barbuda's needs as secondary, or completely negligible, compared to the larger island's industrial and agricultural demands. Burton, however, was entirely undeterred by bureaucratic resistance. She formed strategic alliances with emerging political figures and labor leaders, including early interactions with national figures like \",[\"$\",\"$L37\",\"a-0\",{\"slug\":\"vere-bird\",\"href\":\"/profiles/vere-bird\",\"children\":\"Vere Bird\"}],\" and prominent Barbudan representatives such as \",[\"$\",\"$L37\",\"a-1\",{\"slug\":\"mcchesney-george\",\"href\":\"/profiles/mcchesney-george\",\"children\":\"McChesney George\"}],\". She argued passionately that the social and economic development of the emerging nation was entirely contingent on the equal education of all its citizens, regardless of which side of the ocean channel they resided on.\"]}]\n2b:[\"$\",\"blockquote\",\"blockquote-1\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"Margaret didn't just teach our children; she laid the literal foundations upon which they could learn. Every brick in the new schoolhouse bears the mark of her persistence.\\\" - A contemporary member of the Barbuda Council\"}],\"\\n\"]}]\n2c:[\"$\",\"h3\",\"h3-4\",{\"children\":\"Triumphs, Transformations, and a New Era\"}]\n2d:[\"$\",\"p\",\"p-12\",{\"children\":\"Years of persistent lobbying, petitioning, community organizing, and refusing to accept 'no' for an answer finally bore fruit. In a landmark victory for Barbuda, the central government, heavily pressured by Burton's coalition and newly available international development funds, formally approved and funded the construction of the island's first truly modern school complex.\"}]\n2e:[\"$\",\"p\",\"p-13\",{\"children\":\"Burton was deeply involved in every single phase of the monumental project. She consulted extensively with regional architects to ensure the design met the specific climatic and pedagogical "])</script><script>self.__next_f.push([1,"needs of the island, insisting on reinforced concrete and louvered windows for maximum cross-ventilation. When construction finally began, she was a daily presence on the site, personally monitoring progress, managing disputes, and ensuring that no corners were cut by contractors. The official opening of the new school was a watershed event in Codrington, celebrated with island-wide festivities as a massive triumph of community resilience and a definitive turning point in Barbuda's history.\"}]\n2f:[\"$\",\"p\",\"p-14\",{\"children\":\"The new facility featured spacious, well-lit classrooms, a dedicated science area, a library stocked with brand-new books, and a large assembly hall for community events. The impact of these modern facilities was both immediate and profound. Student attendance and retention rates soared almost overnight. Teachers, finally provided with a conducive, professional environment and adequate resources, were able to implement far more effective instructional strategies. For the first time in history, students in Barbuda had access to an educational infrastructure that mirrored, and in some aspects exceeded, what was available in the capital of Antigua. This physical transformation catalyzed a broader educational renaissance on the island, leading directly to a significant, sustained increase in the number of Barbudan students qualifying for secondary and tertiary education abroad.\"}]\n30:[\"$\",\"p\",\"p-15\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/4/4b/Codrington_lagoon.jpg\",\"alt\":\"Codrington Lagoon\"}]}]\n31:[\"$\",\"h3\",\"h3-5\",{\"children\":\"Enduring Legacy and Later Years\"}]\n32:[\"$\",\"p\",\"p-16\",{\"children\":\"Margaret Burton's immense contributions extended far beyond the mortar and bricks of the school buildings she helped construct. She served as a highly respected principal for several years, fostering a strict but loving culture of academic excellence and mandatory community service. Recognizing that education must be a lifelong pursuit, she initiated adult literacy programs in the evenings, ensuring that the new facilities served the entire community, not just its youth.\"}]\n33:[\"$\",\"p\",\"p-17\",{\"children\":\"Even after her formal retirement from teaching and administration, Burton remained a towering figure in Codrington. She was frequently consulted by subsequent generations of teachers, politicians, and community leaders on matters of development, social welfare, and preserving Barbudan identity.\"}]\n34:[\"$\",\"p\",\"p-18\",{\"children\":\"Her legacy is indelibly etched into the physical and intellectual landscape of Barbuda. She is remembered today not merely as an educator, but as a visionary leader who understood the inextricable link between a dignified physical environment and human potential. By successfully fighting for modern school facilities, Margaret Burton irreversibly transformed the trajectory of countless lives, ensuring that generations of Barbudans were adequately equipped with the knowledge and skills necessary to navigate a rapidly changing world, all while remaining fiercely proud of their unique island heritage. Her remarkable life stands as a powerful testament to the enduring impact of dedicated, grassroots advocacy in overcoming systemic neglect and building a brighter, more equitable future.\"}]\n35:[\"$\",\"$L38\",null,{\"title\":\"Learn about the legacy of Margaret Burton\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/margaret-burton\"}]\n36:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"Margaret Burton was a pioneering educator and visionary facilities advocate who revolutionized the educational landscape of Barbuda. Her most significant contribution was leading a multi-year, grassroots advocacy campaign that successfully pressured the central government to build Barbuda's first modern"])</script><script>self.__next_f.push([1,", hurricane-resistant school complex, thereby ending decades of infrastructural neglect. \\n\\nBeyond securing the physical buildings, Burton fundamentally transformed the quality of education on the island by introducing modern pedagogical methods, establishing adult literacy programs, and integrating Barbudan cultural history into the curriculum. Her relentless pursuit of educational equity ensured that Barbudan children had the resources necessary to pursue secondary and tertiary education, breaking cycles of poverty and marginalization.\"}]]}]\n"])</script><script>self.__next_f.push([1,"39:I[27201,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\"],\"IconMark\"]\n14:null\n"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"title\",\"0\",{\"children\":\"Margaret Burton | Caribbean Legacy Archive\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"### Early Life and the Barbudan Context\\n\\n**Margaret Burton** was born in the heart of **Codrington**, the singular settlement on the island of Barb...\"}],[\"$\",\"meta\",\"2\",{\"property\":\"og:title\",\"content\":\"Margaret Burton\"}],[\"$\",\"meta\",\"3\",{\"property\":\"og:description\",\"content\":\"### Early Life and the Barbudan Context\\n\\n**Margaret Burton** was born in the heart of **Codrington**, the singular settlement on the island of Barb...\"}],[\"$\",\"meta\",\"4\",{\"property\":\"og:url\",\"content\":\"https://caribbeanlegacyarchive.com/profiles/margaret-burton\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:site_name\",\"content\":\"Caribbean Legacy Archive\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:locale\",\"content\":\"en_US\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:image\",\"content\":\"https://caribbeanlegacyarchive.com/og-image.jpg\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:image:width\",\"content\":\"1200\"}],[\"$\",\"meta\",\"9\",{\"property\":\"og:image:height\",\"content\":\"630\"}],[\"$\",\"meta\",\"10\",{\"property\":\"og:image:alt\",\"content\":\"Margaret Burton\"}],[\"$\",\"meta\",\"11\",{\"property\":\"og:type\",\"content\":\"profile\"}],[\"$\",\"meta\",\"12\",{\"name\":\"twitter:card\",\"content\":\"summary_large_image\"}],[\"$\",\"meta\",\"13\",{\"name\":\"twitter:title\",\"content\":\"Margaret Burton\"}],[\"$\",\"meta\",\"14\",{\"name\":\"twitter:description\",\"content\":\"### Early Life and the Barbudan Context\\n\\n**Margaret Burton** was born in the heart of **Codrington*
