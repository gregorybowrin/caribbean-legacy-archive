":\"M8 2v4\",\"key\":\"1cmpym\"}],[\"path\",{\"d\":\"M16 2v4\",\"key\":\"4m81vk\"}],[\"rect\",{\"width\":\"18\",\"height\":\"18\",\"x\":\"3\",\"y\":\"4\",\"rx\":\"2\",\"key\":\"1hopcy\"}],[\"path\",{\"d\":\"M3 10h18\",\"key\":\"8toen8\"}]],\"className\":\"lucide-calendar h-4 w-4 text-gold mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Life Dates\"}],[\"$\",\"span\",null,{\"className\":\"text-sm font-semibold\",\"children\":[1787,\" – \",1832]}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M12 7v14\",\"key\":\"1akyts\"}],[\"path\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\",\"key\":\"ruj8y\"}]],\"className\":\"lucide-book-open h-4 w-4 text-navy/60 mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Areas of Influence\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2 mt-1\",\"children\":[[\"$\",\"$L6\",\"0\",{\"href\":\"/areas/history\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"History\"}],\"$L1b\",\"$L1c\"]}]]}]]}]]}]]}]]}],\"$L1d\"]}]}]]}]\n"])</script><script>self.__next_f.push([1,":HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Mary_prince_first_edition_frontpage.jpg/330px-Mary_prince_first_edition_frontpage.jpg\",\"image\"]\n1b:[\"$\",\"$L6\",\"1\",{\"href\":\"/areas/literature\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Literature\"}]\n1c:[\"$\",\"$L6\",\"2\",{\"href\":\"/areas/civil-rights\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Civil Rights\"}]\n"])</script><script>self.__next_f.push([1,"1d:[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Mary Prince\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Born Into Chains: Bermuda in the Age of Slavery\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[[\"$\",\"strong\",\"strong-0\",{\"children\":\"Mary Prince\"}],\" was born around \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"1788\"}],\" at Brackish Pond, in the parish of Devonshire, \",[\"$\",\"strong\",\"strong-2\",{\"children\":\"Bermuda\"}],\" — a small British colonial archipelago whose economy, though distinct from the plantation-driven islands of the wider Caribbean, was nonetheless thoroughly embedded in the institution of slavery. Unlike the sugar-producing islands of Jamaica, Barbados, or Trinidad, Bermuda's enslaved population was primarily employed in domestic service, maritime labor, and the harvesting of salt from the island's pans. This did not make the institution less brutal; it simply gave brutality a different face.\"]}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":[\"Mary Prince was born into bondage, the property of Charles Myners and later the Darrell and Williams families. From her very earliest years, she existed in the condition that defined so many thousands of lives across the British Caribbean: legally invisible, economically exploited, physically vulnerable, and without recourse to any law or institution that recognized her humanity. Yet the story of Mary Prince is not simply a story of victimization. It is, above all, a story of \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"voice\"}],\" — of a woman who refused to let the machinery of slavery silence her, and who found a way, against enormous odds, to force the world to hear her testimony. [1]\"]}],\"\\n\",[\"$\",\"p\",\"p-2\",{\"children\":[[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Mary_prince_first_edition_frontpage.jpg/330px-Mary_prince_first_edition_frontpage.jpg\",\"alt\":\"Title page of the first edition of The History of Mary Prince, 1831\"}],\"\\n\",[\"$\",\"em\",\"em-0\",{\"children\":\"The front page of the first edition of\"}],\" The History of Mary Prince, \",\"$L1e\"]}],\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\"]}]]}],\"$L37\",\"$L38\",false]}],\"$L39\"]}]\n"])</script><script>self.__next_f.push([1,"3a:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1e:[\"$\",\"em\",\"em-1\",{\"children\":\"published in London in 1831. Public domain, via Wikimedia Commons.\"}]\n1f:[\"$\",\"h3\",\"h3-1\",{\"children\":\"Childhood and the First Rupture\"}]\n20:[\"$\",\"p\",\"p-3\",{\"children\":[\"Mary Prince spent her earliest years in relative proximity to her family, serving in the household of Captain and Mrs. Williams, who treated her with what she later described as comparative kindness. But this tenuous stability shattered when she was approximately \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"twelve years old\"}],\": she was sold away from her mother and siblings in a public auction, a scene she recounted in her narrative with harrowing specificity. The separation was not merely an economic transaction; it was a deliberate severing of human bonds that the slave economy required in order to function, and it inflicted psychological wounds that Mary Prince carried for the rest of her life.\"]}]\n21:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[[\"$\",\"em\",\"em-0\",{\"children\":\"\\\"I was soon surrounded by strange men, who examined and handled me in the same manner that a butcher would a calf or lamb he was about to purchase.\\\"\"}],\"\\n— Mary Prince, \",[\"$\",\"em\",\"em-1\",{\"children\":\"The History of Mary Prince\"}],\" (1831)\"]}],\"\\n\"]}]\n22:[\"$\",\"p\",\"p-4\",{\"children\":\"She was sold to Captain John Ingham, whose household became the site of the first of many sustained regimes of violence. She and the other enslaved people in his care were subjected to regular physical beatings, psychological cruelty, and overwork — experiences that she documented in her narrative with a directness that shocked Victorian readers. [2]\"}]\n23:[\"$\",\"h3\",\"h3-2\",{\"children\":\"The Salt Ponds of Turks Island\"}]\n24:[\"$\",\"p\",\"p-5\",{\"children\":[\"Perhaps the most physically devastating chapter of Mary Prince's enslavement came when she was taken to \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Turks Island\"}],\" — a salt-producing dependency in what is now the Turks and Caicos Islands — by her then-owner, Mr. D— (widely understood to be Mr. Darrel). The labor on the salt ponds was grueling beyond description. Enslaved workers stood in brine for hours at a time, raking and carrying salt under a tropical sun, their skin cracked and bleeding from the corrosive salt water. The conditions caused permanent damage to Mary Prince's joints and health, injuries from which she never fully recovered.\"]}]\n25:[\"$\",\"p\",\"p-6\",{\"children\":\"This period represents one of the most significant chapters in her narrative, because it reveals the overlooked geography of Caribbean slavery. When people in Britain imagined slavery, they imagined sugar plantations in Jamaica or Barbados — not the brutal salt industry of smaller, less celebrated islands. Mary Prince's testimony placed these overlooked sites of suffering onto the map of the abolitionist imagination. [3]\"}]\n26:[\"$\",\"h3\",\"h3-3\",{\"children\":\"Antigua: Marriage and a Sharpening Resistance\"}]\n27:[\"$\",\"p\",\"p-7\",{\"children\":[\"After years of suffering in Bermuda and Turks Island, Mary Prince was eventually taken to \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Antigua\"}],\", where she was enslaved by John Adams Wood, a merchant, and his wife. In Antigua, despite continuing to endure physical abuse and overwork, Mary Prince found space for two important developments in her interior life: she joined the \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"Moravian Church\"}],\", finding in its communal religious practice a form of dignity and community that slavery sought to extinguish; and she entered into a marriage with \",[\"$\",\"strong\",\"strong-2\",{\"children\":\"Daniel James\"}],\", a fr"])</script><script>self.__next_f.push([1,"ee Black man, whom she wed in 1826. [4]\"]}]\n28:[\"$\",\"p\",\"p-8\",{\"children\":\"The Woods refused to allow her to purchase her freedom, a denial that was not uncommon but that represented, in Mary Prince's case, a particular cruelty, because the law technically allowed enslaved people in some circumstances to buy their way out of bondage. Her growing awareness of both her legal rights and of the abolitionist movement sharpened her determination to find freedom by another means.\"}]\n29:[\"$\",\"h3\",\"h3-4\",{\"children\":\"London and the Path to Freedom\"}]\n2a:[\"$\",\"p\",\"p-9\",{\"children\":[\"In \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"1828\"}],\", John and Mary Wood brought Mary Prince to London as their domestic servant, a decision that would prove to be a crucial miscalculation. While slavery was still perfectly legal in British Caribbean colonies, the legal status of enslaved people on English soil was far more ambiguous following the Somerset case of 1772, which had established that an enslaved person could not be compelled to return to a colony against their will. [5]\"]}]\n2b:[\"$\",\"p\",\"p-10\",{\"children\":[\"Mary Prince exploited this legal grey zone. After enduring continued mistreatment in London, she left the Woods' household — not without enormous courage, given that departure meant losing any chance of returning to her husband in Antigua as a free woman, since the Woods refused to grant her manumission. She sought refuge first with the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Moravian Church\"}],\" and then made contact with the \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"Anti-Slavery Society\"}],\", whose secretary, \",[\"$\",\"strong\",\"strong-2\",{\"children\":\"Thomas Pringle\"}],\", took her into his household and became her advocate.\"]}]\n2c:[\"$\",\"h3\",\"h3-5\",{\"children\":\"The Autobiography: Dictating a Life into History\"}]\n2d:[\"$\",\"p\",\"p-11\",{\"children\":[\"Because Mary Prince was illiterate — a direct consequence of the deliberate policy of keeping enslaved people uneducated — she could not write her own story. Instead, she dictated it to \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Susanna Strickland\"}],\" (later Susanna Moodie), a writer residing in Pringle's home. Strickland transcribed Prince's words, and Pringle edited the manuscript, adding a preface and supplementary materials. The resulting book, \",[\"$\",\"em\",\"em-0\",{\"children\":[\"$\",\"strong\",\"strong-0\",{\"children\":\"The History of Mary Prince, a West Indian Slave, Related by Herself\"}]}],\", was published in \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"London in 1831\"}],\". [6]\"]}]\n2e:[\"$\",\"p\",\"p-12\",{\"children\":[\"It was the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"first autobiography by a Black woman ever published in Britain\"}],\" — a fact whose significance cannot be overstated. In an era when enslaved people were legally classified as property, when their testimony was inadmissible in court and their personhood unrecognized by law, Mary Prince's narrative broke through the silence with the force of an indictment. The book ran through \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"three editions in its first year\"}],\", a testament to its explosive impact on a British public already primed by decades of abolitionist organizing.\"]}]\n2f:[\"$\",\"h3\",\"h3-6\",{\"children\":\"Legal Battles and Parliamentary Petitions\"}]\n30:[\"$\",\"p\",\"p-13\",{\"children\":[\"The publication of the narrative was not without consequence. John Wood, furious at the portrait of him in the book, brought a \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"libel suit\"}],\" against Pringle, claiming the narrative was false and defamatory. Mary Prince appeared as a witness in the proceedings — making her, in a profound historical irony, a subject of law who had never been recognized as a legal person. The court ultimately ruled against some of the narrative's allegations, but the legal battles only amplified public attention on the book and on the cause of Caribbean emancipation. [7]\"]}]\n31:[\"$\",\"p\",\"p-14\",{\"children\":[\"Mary Prince also acted in her own name: she \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"petitioned the British Parliament\"}],\" directly — making h"])</script><script>self.__next_f.push([1,"er arguably the \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"first woman in Britain to petition Parliament\"}],\" in her own right — calling for the freedom of herself and all enslaved people in the British Caribbean. Though her personal petition for freedom was unsuccessful (the Woods refused to sell her, and she could not return to Antigua without being re-enslaved), her political action was part of a rising tide of pressure on Parliament that could not be ignored. [8]\"]}]\n32:[\"$\",\"h3\",\"h3-7\",{\"children\":\"The Abolition Act and an Unknown Ending\"}]\n33:[\"$\",\"p\",\"p-15\",{\"children\":[\"The \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Slavery Abolition Act was passed in 1833\"}],\", just two years after the publication of Mary Prince's narrative. While no single document or action can be credited with passing such landmark legislation, historians consistently recognize her autobiography as one of the most powerful catalysts of the final phase of the British abolitionist movement. It gave the abstract arguments of politicians and philosophers a human face, a human voice, and a catalogue of human suffering rendered in precise and unflinching detail.\"]}]\n34:[\"$\",\"p\",\"p-16\",{\"children\":\"What happened to Mary Prince after 1833 is not known. The historical record falls silent, and she disappears from documentation. Whether she was able to return to Antigua, whether she was reunited with her husband Daniel James, whether she lived to see Emancipation fully enacted — all of this remains unknown. This silence is itself historically significant: it reflects the structural invisibility of enslaved and formerly enslaved women, whose lives were considered worth recording by official institutions only when they were useful to larger causes.\"}]\n35:[\"$\",\"h3\",\"h3-8\",{\"children\":\"A Legacy Across Two Centuries\"}]\n36:[\"$\",\"p\",\"p-17\",{\"children\":[\"In the two centuries since its publication, \",[\"$\",\"em\",\"em-0\",{\"children\":\"The History of Mary Prince\"}],\" has never been out of print. It is studied in universities across the English-speaking world as a foundational text in the literatures of slavery, women's autobiography, and Caribbean writing. Bermuda has honored her with a \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"national monument\"}],\" and commemorations, and her story has been adapted for theater, film, and documentary. She is widely recognized as one of the most important figures in the history of Caribbean resistance to slavery and in the history of women's political action in the British Empire. [9]\"]}]\n37:[\"$\",\"$L3a\",null,{\"title\":\"Learn about the legacy of Mary Prince\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/mary-prince\"}]\n3b:T69e,"])</script><script>self.__next_f.push([1,"Mary Prince's contributions to the history of the Caribbean and to the global fight against slavery are foundational and enduring. Her 1831 autobiography, *The History of Mary Prince, a West Indian Slave, Related by Herself*, was the first narrative of the life of an enslaved Black woman to be published in Britain, and it served as a galvanizing document for the abolitionist movement at its most critical moment. By providing a first-person, visceral account of slavery's physical and psychological violence — across Bermuda, Turks Island, and Antigua — she demolished the comforting myths that allowed British audiences to remain ignorant of what their colonial economic system actually required. The book went through three editions in its first year and directly contributed to the pressure that led to the Slavery Abolition Act of 1833.\n\nBeyond her autobiography, Mary Prince's contributions extended into direct political action. She petitioned the British Parliament personally — considered by many historians to be the first instance of a woman petitioning Parliament in her own name — and appeared as a legal witness in the libel trials provoked by her narrative, asserting her credibility and her right to be heard in institutions that did not recognize her legal personhood. She also became, through her connection with the Moravian Church in Antigua, an example of how enslaved people used religious communities as spaces of resistance, community-building, and the assertion of spiritual dignity. Centuries after her death, she remains the Caribbean's most important single voice in the literature of slavery and a symbol of the power of testimony as a tool of liberation."])</script><script>self.__next_f.push([1,"38:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,
