ey\":\"4m81vk\"}],[\"rect\",{\"width\":\"18\",\"height\":\"18\",\"x\":\"3\",\"y\":\"4\",\"rx\":\"2\",\"key\":\"1hopcy\"}],[\"path\",{\"d\":\"M3 10h18\",\"key\":\"8toen8\"}]],\"className\":\"lucide-calendar h-4 w-4 text-gold mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Life Dates\"}],[\"$\",\"span\",null,{\"className\":\"text-sm font-semibold\",\"children\":[1923,\" – \",2001]}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M12 7v14\",\"key\":\"1akyts\"}],[\"path\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\",\"key\":\"ruj8y\"}]],\"className\":\"lucide-book-open h-4 w-4 text-navy/60 mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Areas of Influence\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2 mt-1\",\"children\":[[\"$\",\"$L6\",\"0\",{\"href\":\"/areas/politics\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Politics\"}],\"$L1b\",\"$L1c\"]}]]}]]}]]}]]}]]}],\"$L1d\"]}]}]]}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"$L6\",\"1\",{\"href\":\"/areas/journalism\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Journalism\"}]\n1c:[\"$\",\"$L6\",\"2\",{\"href\":\"/areas/civil-rights\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Civil Rights\"}]\n"])</script><script>self.__next_f.push([1,"1d:[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Philip Goldson\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Roots in British Honduras: A Colonial Childhood\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[\"Philip Stanley Wilberforce Goldson was born on \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"July 25, 1923\"}],\", in Belize City, in what was then known as \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"British Honduras\"}],\" — a small Central American colony of the British Empire sandwiched between Guatemala to the west and Mexico to the north, with the Caribbean Sea stretching endlessly to the east [3]. He was the second son of Peter Edward Goldson and Florence Matilda Babb Goldson, a family of modest means navigating life under the weight of colonial rule [4].\"]}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":\"The Belize City of Goldson's childhood was a place of stark contrasts: a vibrant urban port community defined by the timber and chicle industries, yet marked by deep social inequality, racial stratification, and the pervasive subordination of colonial governance. The great hurricane of 1931 had devastated the city when Goldson was only eight years old, a catastrophe that deepened existing poverty and reinforced for an entire generation the fragility of life under distant colonial administrators who held all the real power.\"}],\"\\n\",[\"$\",\"p\",\"p-2\",{\"children\":[\"Despite the absence of formal secondary schooling — a luxury unavailable to most boys of his social background — Goldson was relentlessly self-educated. Studying at night and through correspondence, he earned his \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Cambridge University Overseas Junior Certificate in 1939\"}],\" and his \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"Senior School Certificate in 1941\"}],\" [3][5]. These achievements were remarkable for a young man with no secondary school foundation, and they signalled the disciplined, tenacious intellect that would define his entire public career.\"]}],\"\\n\",[\"$\",\"h3\",\"h3-1\",{\"children\":\"From Civil Servant to Voice of the People\"}],\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\"]}]]}],\"$L36\",\"$L37\",false]}],\"$L38\"]}]\n"])</script><script>self.__next_f.push([1,"39:I[62682,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n3a:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Philip_S._W._Goldson_International_Airport.jpg/800px-Philip_S._W._Goldson_International_Airport.jpg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1e:[\"$\",\"p\",\"p-3\",{\"children\":[\"In 1941, Goldson joined the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"British Honduras Civil Service\"}],\", where he worked for six years before his restless conscience drew him towards journalism and activism [3][4]. During his civil service years, he honed his writing skills, editing the \",[\"$\",\"em\",\"em-0\",{\"children\":\"Civil Service Chronicle\"}],\" and the cultural quarterly \",[\"$\",\"em\",\"em-1\",{\"children\":\"OUTLOOK\"}],\" for St. John's College, and contributing short stories to the \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"BBC in London\"}],\" [4][5]. He was a man for whom the written and spoken word were not merely instruments of communication but weapons of liberation.\"]}]\n1f:[\"$\",\"p\",\"p-4\",{\"children\":[\"Goldson also became deeply involved in the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"labour movement\"}],\", serving as the national organiser and general secretary of the \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"General Workers' Union\"}],\" — giving him direct contact with the working poor whose suffering and grievances would motivate his political activism for the rest of his life [3].\"]}]\n20:[\"$\",\"p\",\"p-5\",{\"children\":[\"By the late 1940s, the political temperature in British Honduras was rising. The sudden devaluation of the British Honduran dollar by the colonial government in 1949 — which immediately reduced the purchasing power of ordinary citizens — ignited widespread outrage and gave birth to organised nationalist resistance. From this ferment emerged the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"People's Committee\"}],\", which would shortly become the \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"People's United Party (PUP)\"}],\" — and Goldson was at its founding [6].\"]}]\n21:[\"$\",\"h3\",\"h3-2\",{\"children\":\"Co-Founding the People's United Party\"}]\n22:[\"$\",\"p\",\"p-6\",{\"children\":[\"In \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"1950\"}],\", alongside \",[\"$\",\"$L39\",\"a-0\",{\"slug\":\"george-price\",\"href\":\"/profiles/george-price\",\"children\":\"George Price\"}],\" and other nationalist luminaries, Philip Goldson helped found the \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"People's United Party\"}],\", the organisation that would drive Belize to independence and reshape its political landscape for generations [4][5]. Goldson served as Assistant Secretary of the PUP, using his position to articulate the nationalist cause through journalism as much as through political organising.\"]}]\n23:[\"$\",\"p\",\"p-7\",{\"children\":[\"His platform was \",[\"$\",\"em\",\"em-0\",{\"children\":\"The Belize Billboard\"}],\", one of the territory's most influential newspapers, and Goldson wielded its columns with unflinching courage. In \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"1951\"}],\", he and his colleague \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"Leigh Richardson\"}],\" published an editorial that would change the course of both their lives. The piece argued, plainly and defiantly, that there were \",[\"$\",\"em\",\"em-1\",{\"children\":\"\\\"two roads to independence: evolution and revolution\\\"\"}],\" [5][7]. The colonial authorities regarded this as sedition — a direct incitement to revolt against the Crown.\"]}]\n24:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[[\"$\",\"em\",\"em-0\",{\"children\":\"\\\"There are two roads "])</script><script>self.__next_f.push([1,"to independence: evolution and revolution.\\\"\"}],\" — Philip Goldson and Leigh Richardson, editorial in \",[\"$\",\"em\",\"em-1\",{\"children\":\"The Belize Billboard\"}],\", 1951 — the statement that led to their imprisonment for sedition.\"]}],\"\\n\"]}]\n25:[\"$\",\"p\",\"p-8\",{\"children\":[\"Both men were arrested, tried, and sentenced to \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"one year of hard labour\"}],\" [3][4]. Goldson served his sentence without flinching. And characteristically, he used his imprisonment productively: he studied law by correspondence from his prison cell, emerging from incarceration with his intellect sharpened, his resolve steeled, and his commitment to Belizean freedom more ferocious than before [5][7]. His imprisonment, far from silencing him, made him a martyr and a symbol of principled resistance to colonial rule.\"]}]\n26:[\"$\",\"h3\",\"h3-3\",{\"children\":\"A Multi-Party Democratic Architect\"}]\n27:[\"$\",\"p\",\"p-9\",{\"children\":[\"Goldson's subsequent political career was as complex as it was long. Following shifts in ideology and strategy within the PUP, he eventually departed from the party and became one of the most important architects of Belize's \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"two-party democratic system\"}],\" — a contribution every bit as significant as his earlier nationalist agitation.\"]}]\n28:[\"$\",\"p\",\"p-10\",{\"children\":[\"From \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"1958 to 1973\"}],\", he was a central figure in the \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"National Independence Party (NIP)\"}],\", providing a credible opposition to the PUP's dominance [1]. Then, in \",[\"$\",\"strong\",\"strong-2\",{\"children\":\"1973\"}],\", he was one of the founding forces behind the \",[\"$\",\"strong\",\"strong-3\",{\"children\":\"United Democratic Party (UDP)\"}],\", which merged the NIP with other opposition groups to create the major political force that would eventually form government and remains one of Belize's two dominant parties today [1][4].\"]}]\n29:[\"$\",\"p\",\"p-11\",{\"children\":[[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Philip_S._W._Goldson_International_Airport.jpg/800px-Philip_S._W._Goldson_International_Airport.jpg\",\"alt\":\"Philip S. W. Goldson International Airport, Belize City\"}],\"\\n\",[\"$\",\"em\",\"em-0\",{\"children\":\"The Philip S. W. Goldson International Airport in Belize City — renamed in 1989 to honour his decades of service to the nation.\"}]]}]\n2a:[\"$\",\"p\",\"p-12\",{\"children\":[\"From \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"1965 to 1998\"}],\", Goldson served as a member of the \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"House of Representatives\"}],\" for the Albert constituency in Belize City — more than three decades of unbroken legislative service [4]. He served in various ministerial capacities, including as Minister of Housing and Home Affairs, and was consistently one of the most powerful voices in the legislature, whether in government or in opposition.\"]}]\n2b:[\"$\",\"h3\",\"h3-4\",{\"children\":\"The Sentinel of Sovereignty: Guatemala and the Territorial Dispute\"}]\n2c:[\"$\",\"p\",\"p-13\",{\"children\":[\"If one issue defined Philip Goldson's later career above all others, it was the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"defence of Belizean sovereignty\"}],\" against Guatemala's long-standing and, in Goldson's view, entirely unfounded territorial claim to all of Belize [1][4]. Guatemala had refused to recognise Belizean independence when it was achieved on \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"September 21, 1981\"}],\", insisting that the entire country — 22,966 square kilometres — was rightfully Guatemalan territory, a claim rooted in a disputed succession of colonial treaties.\"]}]\n2d:[\"$\",\"p\",\"p-14\",{\"children\":\"Goldson was Guatemala's most persistent and vocal critic within Belize. He consistently warned against complacency among the Belizean public, insisting that national independence could never be taken for granted in the face of a determined neighbour's irredentist claims. He refused to soften his position even as successive governments explored negotiated compromises, earning both admirers a"])</script><script>self.__next_f.push([1,"nd critics for his uncompromising stance.\"}]\n2e:[\"$\",\"p\",\"p-15\",{\"children\":[\"In the 1990s, when negotiations between Belize and Guatemala intensified in ways Goldson believed threatened Belizean territorial integrity, he founded the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"National Alliance for Belizean Rights (NABR)\"}],\" — an organisation dedicated to educating the public about the details of the dispute and mobilising civil society to resist any settlement that ceded Belizean land or maritime areas [1][4]. It was a final act of patriotic vigilance from a man who had spent his entire adult life in service of his country's freedom.\"]}]\n2f:[\"$\",\"blockquote\",\"blockquote-1\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[[\"$\",\"em\",\"em-0\",{\"children\":\"\\\"Philip Goldson consistently warned against taking national independence for granted and insisted that the Belizean people remain informed and vigilant.\\\"\"}],\" — Documented in multiple national tributes following his death in 2001.\"]}],\"\\n\"]}]\n30:[\"$\",\"h3\",\"h3-5\",{\"children\":\"Legacy: Father of Democracy\"}]\n31:[\"$\",\"p\",\"p-16\",{\"children\":[\"Philip Goldson passed away on \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"October 3, 2001\"}],\", at the age of 78, having spent more than half a century in active public life [1][4]. In \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"2008\"}],\", he was formally designated a \",[\"$\",\"strong\",\"strong-2\",{\"children\":\"National Hero of Belize\"}],\", the highest honour the state can bestow [2].\"]}]\n32:[\"$\",\"p\",\"p-17\",{\"children\":[\"The tributes to Goldson are not merely ceremonial. In \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"1989\"}],\", the \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"Philip Goldson International Airport\"}],\" in Belize City — the country's principal international gateway — was renamed in his honour, ensuring that every traveller entering or departing Belize encounters his name [4][6]. His former residence has been converted into the \",[\"$\",\"strong\",\"strong-2\",{\"children\":\"Goldson House for Democracy and Patriotism\"}],\" in Belmopan, serving as a museum, research centre, and living monument to his role in establishing and defending Belizean democracy [5][7].\"]}]\n33:[\"$\",\"p\",\"p-18\",{\"children\":[\"His soubriquet — \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"\\\"Father of Democracy\\\"\"}],\" — is not merely honorific. It speaks to a specific and irreplaceable contribution: while \",[\"$\",\"$L39\",\"a-0\",{\"slug\":\"george-price\",\"href\":\"/profiles/george-price\",\"children\":\"George Price\"}],\" is rightly celebrated as the \\\"Father of the Nation\\\" for leading Belize to independence, it was Goldson who gave that nation a functioning democratic opposition. Without him, the PUP's dominance might have calcified into the kind of one-party hegemony that blighted other post-colonial states in the region. Goldson's insistence on building credible, principled opposition parties — the NIP and then the UDP — ensured that Belizean democracy would be competitive, accountable, and genuinely pluralistic.\"]}]\n34:[\"$\",\"p\",\"p-19\",{\"children\":\"His story is one of extraordinary moral courage: a man who endured imprisonment for speaking truth to colonial power, who studied law in a prison cell, who built parties and institutions, who stood for decades in the legislature arguing for the rights of the poor, the disabled, and the territorially vulnerable — and who never stopped believing, even in his final years, that democracy required constant tending and defence.\"}]\n35:[\"$\",\"p\",\"p-20\",{\"children\":\"Philip Goldson was not merely a politician. He was a journalist, a trade unionist, a legal thinker, a party builder, and a guardian of national sovereignty. He embodied the full scope of what it means to dedicate a life to public service in the truest and most demanding sense of that phrase.\"}]\n36:[\"$\",\"$L3a\",null,{\"title\":\"Learn about the legacy of Philip Goldson\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/philip-goldson\"}]\n3b:T567,"])</script><script>self.__next_f.push([1,"Philip Goldson's contributions to Belize span journalism, trade unionism, party politics, and the defence of national sovereignty across more than fifty years of public life. As a co-founder of the People's United Party (PUP) in 1950 alongside George Price, he helped launch the nationalist movement that ultimately delivered independence in 1981. His 1951 imprisonment for sedition — after publishing a defiant editorial in the Belize Billboard — made him a symbol of press freedom and anti-colonial resistance. Equally significant was his role in building Belize's two-party democratic system: he was a central figure in founding the National Independence Party (NIP) and later the United Democratic Party (UDP) in 1973, providing the credible opposition that kept Belizean democracy genuinely competitive and accountable. He served in the House of Representatives for the Albert constituency for over 30 years (1965–1998). In his later career, he founded the National Alliance for Belizean Rights (NABR) to defend Belizean sovereignty against Guatemalan territorial claims, and he consistently championed the rights of the poor, the disabled, and the politically marginalised. Officially recognised as a National Hero of Belize in 2008, his legacy is memorialized by the Philip Goldson International Airport (renamed 1989) and the Goldson House for Democracy and Patriotism."])</script><script>self.__next_f.push([1,"37:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"$3b\"}]]}]\n"])</script><script>self.__next_f.push([1,"38:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illust
