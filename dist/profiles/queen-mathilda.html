r bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"History\"}],[\"$\",\"$L6\",\"1\",{\"href\":\"/areas/civil-rights\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Civil Rights\"}]]}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Queen Mathilda\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Introduction\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[\"The narrative of Caribbean labor resistance is incomplete without the fiery rebellion of 1878 on the island of St. Croix, Danish West Indies. Known historically as the \\\"Fireburn,\\\" this uprising stands as a monumental struggle for human dignity and labor rights in the post-emancipation era. At the absolute vanguard of this rebellion stood a group of women who mobilized, organized, and directed the workers in their demands for fair compensation and basic respect. Among these revered leaders was Mathilda McBean, popularly crowned by her contemporaries and posterity as \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Queen Mathilda\"}],\". While her life spans the dates of 1849 to 1899 within the institutional records of the \",[\"$\",\"$L1d\",\"a-0\",{\"slug\":\"queen-mathilda\",\"href\":\"/profiles/queen-mathilda\",\"children\":\"Caribbean Legacy Archive\"}],\", her actions in October 1878 carved her name into the history of the Virgin Islands. Alongside \",[\"$\",\"$L1d\",\"a-1\",{\"slug\":\"queen-mary\",\"href\":\"/profiles/queen-mary\",\"children\":\"Queen Mary\"}],\" and \",[\"$\",\"$L1d\",\"a-2\",{\"slug\":\"queen-agnes\",\"href\":\"/profiles/queen-agnes\",\"children\":\"Queen Agnes\"}],\", Queen Mathilda became a symbol of unyielding resistance against colonial exploitation and the oppressive structural remnants of chattel slavery.\"]}],\"\\n\",[\"$\",\"h3\",\"h3-1\",{\"children\":\"The Post-Emancipation Labor Trap: The 1849 Labor Act\"}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":\"To comprehend the spark that ignited the Fireburn, one must examine the socio-economic reality of St. Croix in the mid-19th century. Although Governor Peter von Scholten had declared the emancipation of all enslaved people in the Danish West Indies in 1848, the colonial planter class and government quickly enacted legislative measures to ensure that the newly freed population remained economically subjugated [1]. The most pernicious of these measures was the Labor Act of 1849 [2].\"}],\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\"]}]]}],\"$L35\",\"$L36\",false]}],\"$L37\"]}]\n"])</script><script>self.__next_f.push([1,"38:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/4/4b/St._Croix_in_the_Danish_West_Indies.png\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/e/e0/Map_of_St._Croix_Danish_West_Indies.jpg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1e:[\"$\",\"p\",\"p-2\",{\"children\":\"This Act established a highly restrictive labor system designed to maintain a cheap, stable workforce for the sugar plantations [3]. Under this law, laborers were forced to enter into legally binding, annual contracts. These agreements could only be terminated or changed on a single day of the year: October 1st, commonly referred to as \\\"Contract Day.\\\" If a worker failed to secure a new contract or did not wish to renew their existing one, they could be arrested for vagrancy or forced back onto the plantation. Furthermore, the wages were capped at a meager rate—typically between 10 and 15 cents a day—and workers were subjected to harsh disciplinary codes, poor housing, and limited freedom of movement [2]. The physical conditions of labor on the estates differed very little from the pre-1848 era of slavery, fostering a deep, generational resentment among the Afro-Crucian population.\"}]\n1f:[\"$\",\"p\",\"p-3\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/4/4b/St._Croix_in_the_Danish_West_Indies.png\",\"alt\":\"Historical map showing St. Croix in the Danish West Indies\"}]}]\n20:[\"$\",\"h3\",\"h3-2\",{\"children\":\"The Spark of Frederiksted: October 1, 1878\"}]\n21:[\"$\",\"p\",\"p-4\",{\"children\":\"By the late 1870s, the tension on St. Croix had reached a boiling point [4]. The combination of low wages, a devastating drought, and the arbitrary cruelty of estate managers made the annual Contract Day a focal point of anxiety and resistance. On October 1, 1878, thousands of agricultural laborers gathered in the town of Frederiksted, on the western coast of St. Croix, hoping to negotiate better contracts or find new employers [3].\"}]\n22:[\"$\",\"p\",\"p-5\",{\"children\":\"As the day progressed, rumors spread through the crowd that a popular laborer had been beaten or killed by police. Frustrations quickly boiled over, and the crowd began to clash with the local gendarmerie [4]. When the police retreated into the Frederiksted fort, the laborers took control of the town [1]. What began as a protest rapidly transformed into a full-scale insurrection. The workers dismantled structures, armed themselves, and began setting fire to public buildings, sugar warehouses, and shops. The flames soon spread from Frederiksted into the surrounding countryside, as laborers marched from estate to estate, burning sugarcane fields and great houses. This dramatic, red-lit night gave the uprising its permanent name: the \\\"Fireburn\\\" [5].\"}]\n23:[\"$\",\"h3\",\"h3-3\",{\"children\":\"Mathilda McBean: Identity and Early Life\"}]\n24:[\"$\",\"p\",\"p-6\",{\"children\":\"Historical records regarding the early life of Mathilda McBean are scarce, and discrepancies exist between institutional archives and modern historical research. In the official records of the Caribbean Legacy Archive, she is listed as having lived from 1849 to 1899. However, pioneering research by Virgin Islands historians suggests that Mathilda McBean was born around September 1857 at Estate Robe's Hill on St. Croix [6]. This would make her a young woman in her late teens or early twenties—approximately 21 years old—at the time of the 1878 revolt [6].\"}]\n25:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"We will not work for these wages; we will burn the country down before we submit.\\\"\\n— A rallying cry attributed to the leaders of the 1878 Fireburn.\"}],\"\\n\"]}]\n26:[\"$\",\"p\",\"p"])</script><script>self.__next_f.push([1,"-7\",{\"children\":\"Regardless of the exact year of her birth, Mathilda was a product of the harsh estate labor system. Growing up in the agricultural fields of St. Croix, she witnessed firsthand the transition from chattel slavery to contract servitude. Her youth did not deter her; rather, it provided her with the energy and resolve to challenge the status quo. She possessed a natural eloquence and command that allowed her to sway crowds, making her a natural organizer when the opportunity arose [6].\"}]\n27:[\"$\",\"h3\",\"h3-4\",{\"children\":\"Leadership and Mobilization in the Fireburn\"}]\n28:[\"$\",\"p\",\"p-8\",{\"children\":\"During the initial outbreak of the Fireburn in Frederiksted, Mathilda McBean quickly rose to a position of leadership. The laborers organized themselves under \\\"Queens,\\\" a title derived from West African traditions of maternal authority and leadership during times of crisis. These Queens served as the operational commanders of the revolt, directing groups of workers, coordinating the movement of people across the island, and providing the ideological and emotional support necessary to sustain the rebellion [1].\"}]\n29:[\"$\",\"p\",\"p-9\",{\"children\":[\"Queen Mathilda was particularly noted for her role as a primary mobilizer. While \",[\"$\",\"$L1d\",\"a-0\",{\"slug\":\"queen-mary\",\"href\":\"/profiles/queen-mary\",\"children\":\"Queen Mary\"}],\" was known for her fierce, confrontational stance at the forefront of physical confrontations, and \",[\"$\",\"$L1d\",\"a-1\",{\"slug\":\"queen-agnes\",\"href\":\"/profiles/queen-agnes\",\"children\":\"Queen Agnes\"}],\" organized the logistical transport of fuel and supplies, Queen Mathilda focused on the critical task of mass communication and recruitment. She traversed the estates, urging workers to leave their fields, refuse their contracts, and join the march [1]. She was instrumental in organizing the collection of kerosene and the preparation of torches, which were used to set fire to the sugar estates [6]. Witnesses during her subsequent trial testified that Mathilda was seen leading large groups of chanting laborers, holding a torch aloft, and calling for the destruction of the plantations that had enslaved them. Over the course of several days, the rebels burned over 50 plantations and devastated the colonial economy of St. Croix [4].\"]}]\n2a:[\"$\",\"p\",\"p-10\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/e/e0/Map_of_St._Croix_Danish_West_Indies.jpg\",\"alt\":\"Map of St. Croix during the Danish colonial era\"}]}]\n2b:[\"$\",\"h3\",\"h3-5\",{\"children\":\"Arrest, Trial, and Exile in Denmark\"}]\n2c:[\"$\",\"p\",\"p-11\",{\"children\":\"The Danish colonial government responded to the Fireburn with brutal military force. Troops were dispatched, and martial law was declared. Over the course of the next few weeks, the rebellion was systematically suppressed. Hundreds of laborers were arrested, and dozens were summarily executed by firing squad.\"}]\n2d:[\"$\",\"p\",\"p-12\",{\"children\":\"Mathilda McBean, along with the other primary Queens, was arrested in late October 1878 [4]. The colonial authorities, recognizing the deep influence of these women, conducted extensive trials to determine the ringleaders of the revolt. The trials revealed the highly organized nature of the uprising and the central role played by the Queens. Mathilda and her co-conspirators were originally sentenced to death for their participation in the rebellion and arson [6]. However, the Danish Crown, wary of creating martyrs and facing international scrutiny, commuted the death sentences to life imprisonment with hard labor [1].\"}]\n2e:[\"$\",\"p\",\"p-13\",{\"children\":[\"In 1882, Queen Mathilda, \",[\"$\",\"$L1d\",\"a-0\",{\"slug\":\"queen-mary\",\"href\":\"/profiles/queen-mary\",\"children\":\"Queen Mary\"}],\", and \",[\"$\",\"$L1d\",\"a-1\",{\"slug\":\"queen-agnes\",\"href\":\"/profiles/queen-agnes\",\"children\":\"Queen Agnes\"}],\" were extradited to Denmark to serve their sentences [3]. They were incarcerated in the Christianshavn Women's Prison (\",[\"$\",\"em\",\"em-0\",{\"children\":\"Kvindefængslet\"}],\") in Copenhagen [1]. The transition from the tropical climate of St. Croix to t"])</script><script>self.__next_f.push([1,"he damp, freezing cells of Copenhagen was incredibly harsh [6]. Despite the physical toll, historical records from the prison note that the Crucian women maintained a dignified and resilient demeanor, refusing to be broken by their captors.\"]}]\n2f:[\"$\",\"h3\",\"h3-6\",{\"children\":\"Return and Final Years\"}]\n30:[\"$\",\"p\",\"p-14\",{\"children\":[\"In the late 1880s, facing growing public pressure in Denmark and persistent unrest in the Virgin Islands, the Danish government decided to commute the sentences of the surviving Fireburn leaders. In 1889, Queen Mathilda, along with \",[\"$\",\"$L1d\",\"a-0\",{\"slug\":\"queen-mary\",\"href\":\"/profiles/queen-mary\",\"children\":\"Queen Mary\"}],\" and \",[\"$\",\"$L1d\",\"a-1\",{\"slug\":\"queen-agnes\",\"href\":\"/profiles/queen-agnes\",\"children\":\"Queen Agnes\"}],\", was allowed to return to St. Croix [3].\"]}]\n31:[\"$\",\"p\",\"p-15\",{\"children\":\"Upon their return, they were met as heroes by the local population. However, the colonial authorities kept them under close surveillance, restricting their movement and preventing them from participating in any further labor organizing [1]. Mathilda McBean spent her remaining years in relative obscurity, working in agricultural labor but revered by her community as a living legend of the struggle for freedom. She passed away around 1899, marking the end of a life dedicated to the fight against colonial oppression.\"}]\n32:[\"$\",\"h3\",\"h3-7\",{\"children\":\"Legacy and Commemoration\"}]\n33:[\"$\",\"p\",\"p-16\",{\"children\":\"The legacy of Queen Mathilda and the Fireburn remains a cornerstone of the cultural identity of the U.S. Virgin Islands. In the decades following the revolt, the story of the Queens was kept alive through oral traditions, folk songs, and annual commemorations on Contract Day (October 1st).\"}]\n"])</script><script>self.__next_f.push([1,"34:[\"$\",\"p\",\"p-17\",{\"children\":[\"In the 20th century, as the Virgin Islands witnessed the rise of modern civil rights leaders like \",[\"$\",\"$L1d\",\"a-0\",{\"slug\":\"hamilton-jackson\",\"href\":\"/profiles/hamilton-jackson\",\"children\":\"David Hamilton Jackson\"}],\", the Fireburn was recognized as the foundational event in the island's labor movement. Modern political and civic leaders, including Governors \",[\"$\",\"$L1d\",\"a-1\",{\"slug\":\"alexander-farrelly\",\"href\":\"/profiles/alexander-farrelly\",\"children\":\"Alexander Farrelly\"}],\" and \",[\"$\",\"$L1d\",\"a-2\",{\"slug\":\"cyril-king\",\"href\":\"/profiles/cyril-king\",\"children\":\"Cyril E. King\"}],\", have repeatedly highlighted the historical debt the territory owes to the 1878 rebels. Furthermore, cultural figures such as the musician \",[\"$\",\"$L1d\",\"a-3\",{\"slug\":\"alton-adams\",\"href\":\"/profiles/alton-adams\",\"children\":\"Alton Augustus Adams\"}],\" drew inspiration from the spirit of resistance that these Queens embodied. The \\\"Three Queens Fountain,\\\" a bronze monument located at Blackbeard's Castle in Charlotte Amalie, St. Thomas, stands as a permanent tribute to Queen Mathilda, \",[\"$\",\"$L1d\",\"a-4\",{\"slug\":\"queen-mary\",\"href\":\"/profiles/queen-mary\",\"children\":\"Queen Mary\"}],\", and \",[\"$\",\"$L1d\",\"a-5\",{\"slug\":\"queen-agnes\",\"href\":\"/profiles/queen-agnes\",\"children\":\"Queen Agnes\"}],\" [7]. In recent years, the collaborative monument \",[\"$\",\"em\",\"em-0\",{\"children\":\"I Am Queen Mary\"}],\", created by artists La Vaughn Belle and Jeannette Ehlers in Copenhagen, has further elevated the global recognition of these women, connecting the history of St. Croix to the broader dialogue on Danish colonial legacy and the African diaspora. Queen Mathilda's life serves as an enduring reminder that the fight for labor rights and human dignity is often led by the most marginalized, whose courage can shake the foundations of colonial power.\"]}]\n"])</script><script>self.__next_f.push([1,"35:[\"$\",\"$L38\",null,{\"title\":\"Learn about the legacy of Queen Mathilda\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/queen-mathilda\"}]\n36:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"Mathilda McBean, known as Queen Mathilda, was one of the central organizers and mobilizers of the 1878 \\\"Fireburn\\\" labor revolt on the island of St. Croix. This uprising was the most significant labor rebellion in the history of the Danish West Indies, protesting the oppressive post-emancipation labor codes established by the 1849 Labor Act. Queen Mathilda was instrumental in recruiting workers, inciting resistance across agricultural estates, and leading rallies that demanded fair wages and freedom of movement. Following the suppression of the revolt, she was arrested, tried, and sentenced to life in prison. Alongside other leaders like Queen Mary, she was imprisoned in Denmark, becoming an enduring symbol of resistance against colonial exploitation. Her actions helped lay the foundation for the Virgin Islands labor movement, challenging the Danish colonial system and inspiring future civil rights leaders in the territory.\"}]]}]\n"])</script><script>self.__next_f.push([1,"37:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"alt\":\"A.W. \\\"Art\\\" Saunders\",\"className\":\"w-full h-full object-cover\"}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"font-serif text-lg text-navy line-clamp-1\",\"chil
