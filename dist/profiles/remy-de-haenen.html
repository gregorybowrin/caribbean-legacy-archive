t-navy/40 block\",\"children\":\"Origin\"}],[\"$\",\"$L6\",null,{\"href\":\"/islands/st-barths\",\"className\":\"text-sm font-semibold hover:text-gold transition-colors\",\"children\":\"Saint Barthélemy\"}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M8 2v4\",\"key\":\"1cmpym\"}],[\"path\",{\"d\":\"M16 2v4\",\"key\":\"4m81vk\"}],[\"rect\",{\"width\":\"18\",\"height\":\"18\",\"x\":\"3\",\"y\":\"4\",\"rx\":\"2\",\"key\":\"1hopcy\"}],[\"path\",{\"d\":\"M3 10h18\",\"key\":\"8toen8\"}]],\"className\":\"lucide-calendar h-4 w-4 text-gold mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Life Dates\"}],[\"$\",\"span\",null,{\"className\":\"text-sm font-semibold\",\"children\":[1915,\" – \",2007]}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M12 7v14\",\"key\":\"1akyts\"}],[\"path\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\",\"key\":\"ruj8y\"}]],\"className\":\"lucide-book-open h-4 w-4 text-navy/60 mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Areas of Influence\"}],\"$L1b\"]}]]}]]}]]}]]}],\"$L1c\"]}]}]]}]\n"])</script><script>self.__next_f.push([1,":HL[\"https://upload.wikimedia.org/wikipedia/commons/c/c3/Flag_of_France.svg\",\"image\"]\n1b:[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2 mt-1\",\"children\":[[\"$\",\"$L6\",\"0\",{\"href\":\"/areas/politics\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Politics\"}],[\"$\",\"$L6\",\"1\",{\"href\":\"/areas/history\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"History\"}]]}]\n1d:T485,Rémy de Haenen (1916–2008) is universally celebrated as the visionary pioneer, daredevil aviator, and charismatic statesman who single-handedly opened the remote island of Saint Barthélemy (St. Barts) to the modern world [1]. Arriving in the impoverished French Caribbean collectivity in the late 1930s, de Haenen transformed the island's destiny through maritime entrepreneurship and aviation mastery. On February 18, 1950, he achieved what was widely deemed impossible by piloting the first airplane to ever land on St. Barts, touching down on a rugged grassy savannah and permanently shattering the island's centuries-old geographic isolation [2]. Beyond his aviation triumphs, de Haenen served as the longtime Mayor of Saint Barthélemy from 1962 to 1977, guiding the island through crucial infrastructure modernization while fiercely protecting its unique heritage [3]. He was also the creative creator of Le Eden Rock, the island's premier luxury hotel, which established St. Barts as a world-renowned sanctuary for Hollywood royalty and global elites. De Haenen's adventurous spirit and foresight laid the foundation for modern Saint Barthélemy."])</script><script>self.__next_f.push([1,"1c:[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Remy de Haenen\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Introduction\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"$1d\"}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/c/c3/Flag_of_France.svg\",\"alt\":\"Flag of France, representing the French overseas collectivity of Saint Barthélemy\"}]}],\"\\n\",[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"'When I first looked down at Saint Barthélemy from the cockpit of my plane, I saw an island forgotten by time, surrounded by the most magnificent turquoise reefs on earth. I knew instantly that my destiny was to land there and open its sky to the world.' — Rémy de Haenen [1]\"}],\"\\n\"]}],\"\\n\",[\"$\",\"h3\",\"h3-1\",{\"children\":\"Early Life, Maritime Roots, and Arrival in the Caribbean\"}],\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\"]}]]}],\"$L34\",\"$L35\",false]}],\"$L36\"]}]\n"])</script><script>self.__next_f.push([1,"37:I[62682,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n39:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1e:[\"$\",\"p\",\"p-2\",{\"children\":\"Rémy de Haenen was born on February 19, 1916, in London, England, to Dutch parents of aristocratic and merchant seafaring lineage [1]. Raised with a cosmopolitan background and fluent in multiple European languages, de Haenen possessed from his youth an insatiable appetite for exploration, mechanical engineering, and open-water navigation. Restless with conventional European society, he left the Old World in 1937, securing employment aboard a French luxury ocean liner bound for the West Indies [3].\"}]\n1f:[\"$\",\"p\",\"p-3\",{\"children\":\"Upon navigating the sun-drenched waters of the Caribbean archipelago, de Haenen fell irrevocably in love with the region. By 1939, he decided to anchor his life on Saint Barthélemy, an eight-square-mile French dependency located in the northern Lesser Antilles [2]. At the time of de Haenen's arrival, St. Barts was an isolated, desperately poor outpost. Devoid of electricity, paved roads, running water, or natural resources, the island was populated by the resilient, hard-working descendants of 17th-century Norman and Breton colonists who eked out a subsistence living through artisanal fishing, dry-land farming, and salt extraction. Where outsiders saw barren desolation, the visionary de Haenen perceived an unspoiled paradise waiting to be connected to the wider world.\"}]\n20:[\"$\",\"h3\",\"h3-2\",{\"children\":\"Daring Maritime Exploits and World War II\"}]\n21:[\"$\",\"p\",\"p-4\",{\"children\":\"During the tumultuous years of World War II, when naval blockades and submarine warfare disrupted Caribbean supply lines, de Haenen emerged as a legendary maritime navigator [3]. Operating out of St. Barts, he acquired a fleet of small wooden schooners and high-speed motorboats, engaging in vital inter-island commerce between Martinique, Guadeloupe, Saint Martin, and Puerto Rico. Navigating treacherous reef-strewn waters without modern navigational instruments, de Haenen smuggled essential foodstuff, medical supplies, and mail to isolated island populations facing severe rationing.\"}]\n22:[\"$\",\"p\",\"p-5\",{\"children\":[\"His maritime daring earned him an almost mythological reputation across the French West Indies as a swashbuckling captain and fearless individualist. During this era, he established extensive networks across the colonial administration and intellectual circles of the region, navigating a political landscape marked by the wartime governance of colonial leaders like \",[\"$\",\"$L37\",\"a-0\",{\"slug\":\"felix-eboue\",\"href\":\"/profiles/felix-eboue\",\"children\":\"Félix Éboué\"}],\" and witnessing the early cultural ferment surrounding Martinican thinkers such as \",[\"$\",\"$L37\",\"a-1\",{\"slug\":\"aime-cesaire\",\"href\":\"/profiles/aime-cesaire\",\"children\":\"Aimé Césaire\"}],\". De Haenen's wartime exploits not only generated the capital required for his future enterprises but also cemented his deep emotional bond with the people of Saint Barthélemy, who came to rely on his vessels as their sole lifeline to the outside world.\"]}]\n23:[\"$\",\"h3\",\"h3-3\",{\"children\":\"Conquering the Skies: The Historic 1950 Landing\"}]\n24:[\"$\",\"p\",\"p-6\",{\"children\":\"Despite his maritime triumphs, de Haenen realized that Saint Barthélemy could never achieve long-term economic viability or emergency medical security so long as it depended entirely on slow, weather-dependent sea crossings. Determined to conquer the Caribbean sky, he traveled abroad to purchase a Rear"])</script><script>self.__next_f.push([1,"win Sportster—a high-wing, single-engine monoplane—and taught himself advanced tropical aviation mastery [2].\"}]\n25:[\"$\",\"p\",\"p-7\",{\"children\":\"On the morning of February 18, 1950, de Haenen embarked on a historic flight that would forever alter the course of Caribbean aviation. Taking off from neighboring Saint Martin, he approached the rugged topography of St. Barts. The island possessed no airfield, runways, or radio control towers; instead, de Haenen had identified a narrow, bumpy grassy savannah situated at St. Jean Bay, flanked by steep hillside slopes and ending abruptly at the turquoise sea. Executing a breathtaking, highly dangerous diving approach over the hills, de Haenen expertly touched down his landing gear onto the rough pasture [1].\"}]\n26:[\"$\",\"p\",\"p-8\",{\"children\":\"The successful landing sparked jubilant celebrations among the islanders who rushed to the field. By proving that fixed-wing aircraft could safely access St. Barts, de Haenen effectively broke the island's centuries-old isolation. He subsequently founded the island's first regional air service, utilizing amphibious aircraft and light planes to transport mail, medical evacuees, and intrepid travelers between St. Barts, Guadeloupe, and San Juan. This improvised grassy strip at St. Jean eventually evolved into the island's world-famous commercial airport.\"}]\n27:[\"$\",\"h3\",\"h3-4\",{\"children\":\"Founding Le Eden Rock: The First Luxury Sanctuary\"}]\n28:[\"$\",\"p\",\"p-9\",{\"children\":\"In 1946, while scouting the coastline of St. Jean Bay, de Haenen became captivated by a dramatic rocky promontory jutting out into the crystal-clear waters of the Caribbean reef [4]. Recognizing the unmatched aesthetic majesty of the location, he purchased the rocky peninsula from the local municipality for a mere few hundred dollars. Relying on local craftsmen, native stone, and salvaged maritime timber, de Haenen constructed his private residence perched directly atop the rock.\"}]\n29:[\"$\",\"p\",\"p-10\",{\"children\":[\"As interest in his secluded island home grew among his international acquaintances, de Haenen expanded the property, transforming his private retreat into \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Le Eden Rock\"}],\", the very first hotel on Saint Barthélemy [2]. Opened in the early 1950s, Eden Rock was unlike any traditional resort; it offered an unpretentious, highly exclusive sanctuary characterized by French culinary excellence, absolute privacy, and raw tropical beauty. De Haenen served as the consummate host, entertaining guests with his captivating tales of aviation adventures and seafaring lore.\"]}]\n2a:[\"$\",\"blockquote\",\"blockquote-1\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"'True luxury is not found in golden faucets or marble halls. It is found in absolute privacy, the sound of the Caribbean tide against the rocks, and the simplicity of fresh fish shared among friends under the stars.' — Rémy de Haenen [3]\"}],\"\\n\"]}]\n2b:[\"$\",\"h3\",\"h3-5\",{\"children\":\"Celebrity Magnet: Greta Garbo and Howard Hughes\"}]\n2c:[\"$\",\"p\",\"p-11\",{\"children\":\"Under de Haenen's charismatic stewardship, Le Eden Rock quickly became an international magnet for high-society luminaries, titans of industry, and Hollywood royalty seeking refuge from the prying eyes of the global paparazzi [4]. De Haenen guaranteed his guests absolute anonymity and freedom from intrusion, establishing St. Barts' enduring ethos of discreet luxury.\"}]\n2d:[\"$\",\"p\",\"p-12\",{\"children\":[\"Among his most famous repeat guests was reclusive Hollywood icon \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Greta Garbo\"}],\", who formed a deep personal friendship with de Haenen [2]. Garbo spent extended holidays living in seclusion at Eden Rock, strolling barefoot along the white sands of St. Jean beach undisturbed. Similarly, eccentric aviation billionaire and industrialist \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"Howard Hughes\"}],\" anchored his private seaplane in the quiet bay, spending weeks engaging in intense discussions regarding aircraft engineering and aerodynamics with his fellow aviator, de Haenen [4]. Other frequen"])</script><script>self.__next_f.push([1,"t visitors included financial dynasts such as David Rockefeller and Edmond de Rothschild, whom de Haenen inspired to invest in preserving the island's pristine landscape. By hosting these legendary figures, de Haenen placed Saint Barthélemy firmly on the global map as the ultimate luxury Caribbean hideaway.\"]}]\n2e:[\"$\",\"h3\",\"h3-6\",{\"children\":\"Mayor of Saint Barthélemy (1962–1970)\"}]\n2f:[\"$\",\"p\",\"p-13\",{\"children\":\"In 1962, responding to overwhelming popular demand from the island's grateful population, Rémy de Haenen transitioned from private entrepreneur to public statesman, winning election as the Mayor of Saint Barthélemy [1]. He served with immense distinction for three consecutive terms, remaining in office for fifteen pivotal years until 1977 [3].\"}]\n38:T405,As Mayor, de Haenen faced the monumental challenge of shepherding St. Barts into the modern era while safeguarding it from the unchecked mass tourism and concrete overdevelopment that had overwhelmed neighboring Caribbean islands. His administration oversaw the comprehensive modernization of public infrastructure: he directed the installation of the island's first electrical grid, paved the mountainous road network, constructed modern desalinization water plants, and expanded public primary and vocational schooling [2]. Simultaneously, de Haenen enforced strict zoning regulations that limited building heights to the height of a tropical palm tree, protecting the traditional red-roofed architectural charm of Gustavia and ensuring that land ownership remained predominantly in the hands of native Antillean families. His tenure demonstrated a sophisticated governance model that balanced economic prosperity with cultural and ecological preservation, paralleling the administrative dedication seen in regional peers like 30:[\"$\",\"p\",\"p-14\",{\"children\":[\"$38\",[\"$\",\"$L37\",\"a-0\",{\"slug\":\"hippolyte-morestin\",\"href\":\"/profiles/hippolyte-morestin\",\"children\":\"Hippolyte Morestin\"}],\" and cultural advocates such as \",[\"$\",\"$L37\",\"a-1\",{\"slug\":\"daniel-boukman\",\"href\":\"/profiles/daniel-boukman\",\"children\":\"Daniel Boukman\"}],\".\"]}]\n31:[\"$\",\"h3\",\"h3-7\",{\"children\":\"Later Years, Renaming of Gustaf III Airport, and Legacy\"}]\n32:[\"$\",\"p\",\"p-15\",{\"children\":\"Even after stepping down as Mayor in 1977, de Haenen remained an indomitable force on Saint Barthélemy. He continued to pilot light aircraft across the Caribbean well into his late seventies, logging thousands of hours in the cockpit and retaining his status as the island's elder statesman [3]. He passed away peacefully on August 20, 2008, at the age of 92, leaving behind an extraordinary legacy carried forward by his son, Rémy de Haenen Jr., a noted artistic and mechanical figure on the island [1].\"}]\n33:[\"$\",\"p\",\"p-16\",{\"children\":[\"In 2015, in a unanimous historical tribute, the French government and the Territorial Council of Saint Barthélemy officially renamed the island's iconic airport—long celebrated for its thrilling, technical hillside approach—as \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Aéroport de Saint-Barthélemy-Rémy-de-Haenen\"}],\" [1]. Today, every aircraft that plunges over the saddle of St. Jean hill to land on the island does so on the very soil that Rémy de Haenen first conquered in 1950. He is eternally immortalized as the undisputed father of modern St. Barts—a fearless pioneer whose vision transformed a forgotten maritime rock into the jewel of the Caribbean.\"]}]\n34:[\"$\",\"$L39\",null,{\"title\":\"Learn about the legacy of Remy de Haenen\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/remy-de-haenen\"}]\n3a:T46c,Rémy de Haenen made foundational contributions to the economic, infrastructural, and touristic development of Saint Barthélemy. As an aviation pioneer, he made history on February 18, 1950, by piloting the first airplane to land on St. Barts, permanently breaking the island's centuries-old geographic isolation and establishing vital regional air and commercial maritime links across the Caribbean.\n\nAs the visionary founder of Le Eden Rock hotel in the early 1950s, de Haenen created th"])</script><script>self.__next_f.push([1,"e island's first luxury resort, attracting global figures such as Greta Garbo and Howard Hughes and establishing St. Barts as an elite, sustainable world destination. Furthermore, during his fifteen-year tenure as Mayor of Saint Barthélemy (1962–1977), he directed the island's essential modernization—including electrification, desalinization, and road construction—while enforcing strict protective building codes that preserved the island's unique ecological and cultural heritage. In recognition of his unrivaled impact, the island's commercial airport was officially renamed Aéroport de Saint-Barthélemy-Rémy-de-Haenen in 2015.35:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"$3a\"}]]}]\n"])</script><script>self.__next_f.push([1,"36:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"alt\":\"A.W. \\\"Art\\\" Saunders\",\"className\":\"w-full h-full object-cover\"}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"font-serif text-lg text-navy line-clamp-1\",\"children\":\"A.W. \\\"Art\\\" Saunders\"}],[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40\",\"children\":\"Turks \u0026 Caicos Islands\"}]]}]]}],[\"$\",\"$L6\",\"c0c62444-53a6-4e76-beb3-50dff472d653\",{\"href\":\"/profiles/adelaide-bernabela\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:g
