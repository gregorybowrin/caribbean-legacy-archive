:\"18\",\"height\":\"18\",\"x\":\"3\",\"y\":\"4\",\"rx\":\"2\",\"key\":\"1hopcy\"}],[\"path\",{\"d\":\"M3 10h18\",\"key\":\"8toen8\"}]],\"className\":\"lucide-calendar h-4 w-4 text-gold mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Life Dates\"}],[\"$\",\"span\",null,{\"className\":\"text-sm font-semibold\",\"children\":[1953,\" – \",\"Present\"]}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M12 7v14\",\"key\":\"1akyts\"}],[\"path\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\",\"key\":\"ruj8y\"}]],\"className\":\"lucide-book-open h-4 w-4 text-navy/60 mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Areas of Influence\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2 mt-1\",\"children\":[[\"$\",\"$L6\",\"0\",{\"href\":\"/areas/politics\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Politics\"}]]}]]}]]}]]}]]}]]}],\"$L1b\"]}]}]]}]\n"])</script><script>self.__next_f.push([1,"1c:I[62682,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Reuben T. Meade\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Early Life and Education\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[\"Reuben Theodore Meade was born on \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"7 March 1954\"}],\" in the village of \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"Salem\"}],\", on the western coast of Montserrat — a small, mountainous island of approximately 40 square miles nestled in the northern arc of the Lesser Antilles. Salem, nestled beneath the shadow of the Centre Hills, was a quiet community far removed from the corridors of regional power, yet it would produce one of the Caribbean's most durable and consequential political figures of the late twentieth and early twenty-first centuries.\"]}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":[\"Montserrat in the 1950s was a British Crown Colony in transition. The labour movement led by figures like \",[\"$\",\"strong\",\"strong-0\",{\"children\":[\"$\",\"$L1c\",\"a-0\",{\"slug\":\"ellen-dolly-peters\",\"href\":\"/profiles/ellen-dolly-peters\",\"children\":\"Ellen Dolly Peters\"}]}],\" and the newly elected \",[\"$\",\"strong\",\"strong-1\",{\"children\":[\"$\",\"$L1c\",\"a-0\",{\"slug\":\"william-henry-bramble\",\"href\":\"/profiles/william-henry-bramble\",\"children\":\"William Henry Bramble\"}]}],\" had recently won universal adult suffrage and ushered in Montserrat's first democratic elections in 1952. The island was moving, haltingly but unmistakably, toward self-governance. It was in this atmosphere of political awakening and institutional change that young Reuben Meade came of age.\"]}],\"\\n\",[\"$\",\"p\",\"p-2\",{\"children\":\"Meade's intellectual gifts were evident early, and he pursued his education with ambition and international scope. After completing his primary and secondary schooling on the island, he sought advanced degrees abroad — a path that was both necessary and aspirational for any Montserratian seeking professional excellence, given the limited post-secondary infrastructure on a territory of roughly ten thousand people. His academic record is formidable:\"}],\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\"]}]]}],\"$L32\",\"$L33\",false]}],\"$L34\"]}]\n"])</script><script>self.__next_f.push([1,"35:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Montserrat_eruption.JPG/320px-Montserrat_eruption.JPG\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/Montserrat_from_the_air.jpg/320px-Montserrat_from_the_air.jpg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1d:[\"$\",\"ul\",\"ul-0\",{\"children\":[\"\\n\",[\"$\",\"li\",\"li-0\",{\"children\":[[\"$\",\"strong\",\"strong-0\",{\"children\":\"Bachelor of General Studies\"}],\" — University of the West Indies (UWI)\"]}],\"\\n\",[\"$\",\"li\",\"li-1\",{\"children\":[[\"$\",\"strong\",\"strong-0\",{\"children\":\"Degree in Banking and Finance\"}],\" — University of Bradford, United Kingdom\"]}],\"\\n\",[\"$\",\"li\",\"li-2\",{\"children\":[[\"$\",\"strong\",\"strong-0\",{\"children\":\"Agricultural Economics\"}],\" — McGill University, Canada\"]}],\"\\n\",[\"$\",\"li\",\"li-3\",{\"children\":[[\"$\",\"strong\",\"strong-0\",{\"children\":\"Agricultural Credit Management\"}],\" — Mananga University, Switzerland\"]}],\"\\n\"]}]\n1e:[\"$\",\"p\",\"p-3\",{\"children\":[\"This breadth of academic training was not accidental — it reflected Meade's understanding that governing a small, economically fragile island territory required command of development economics, finance, and agricultural policy in equal measure. Before entering politics, he built a serious professional résumé: he worked as a \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"teacher in both Montserrat and Jamaica\"}],\", served as a \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"Project Analyst with the Caribbean Development Bank (CDB)\"}],\", operated as \",[\"$\",\"strong\",\"strong-2\",{\"children\":\"Financial Controller of the Sea Island Cotton Company\"}],\", and held the position of \",[\"$\",\"strong\",\"strong-3\",{\"children\":\"Director of Development for the Government of Montserrat\"}],\". These roles gave him an unusually comprehensive view of the island's economy and its relationship to regional financial institutions — knowledge that would prove indispensable in the crises ahead.\"]}]\n1f:[\"$\",\"h3\",\"h3-1\",{\"children\":\"First Term as Chief Minister: 1991–1996\"}]\n20:[\"$\",\"p\",\"p-4\",{\"children\":[\"In \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"1991\"}],\", Reuben Meade founded the \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"National Progressive Party (NPP)\"}],\" and led it to victory in the general election, unseating the government of \",[\"$\",\"strong\",\"strong-2\",{\"children\":[\"$\",\"$L1c\",\"a-0\",{\"slug\":\"john-osborne\",\"href\":\"/profiles/john-osborne\",\"children\":\"John Osborne\"}]}],\". At the age of \",[\"$\",\"strong\",\"strong-3\",{\"children\":\"37\"}],\", he became Chief Minister of Montserrat — and was recognized at the time as the \",[\"$\",\"strong\",\"strong-4\",{\"children\":\"youngest head of government in the Caribbean Community (CARICOM)\"}],\". It was a remarkable achievement: a young economist from a village in the island's west, educated on three continents, now at the helm of one of Britain's smallest and most strategically overlooked dependencies.\"]}]\n21:[\"$\",\"p\",\"p-5\",{\"children\":[\"His first term was immediately defined by crisis. Montserrat had barely begun recovering from the catastrophic devastation of \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Hurricane Hugo\"}],\" in September \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"1989\"}],\", which had destroyed an estimated 90% of the island's structures and left virtually the entire population homeless or displaced. Infrastructure had to be rebuilt nearly from scratch. The economy was shattered. International aid and British budgetary support were critical lifelines, and Meade had to navigate the delicate politics of dependency and reconstruction simultaneously.\"]}]\n22:[\"$\",\"p\",\"p-6\",{\"children\":[\"Then, in \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"July 1995\"}],\", nature struck again — this t"])</script><script>self.__next_f.push([1,"ime in a form even more terrifying and geologically unprecedented in modern Caribbean history. The \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"Soufrière Hills volcano\"}],\", which had been dormant for centuries, began a new eruptive phase with phreatic (steam) explosions that quickly escalated into something far more dangerous. By December 1995, Plymouth — Montserrat's capital city, home to the island's government, its port, its markets, and the center of its civic life — was evacuated for the first time.\"]}]\n23:[\"$\",\"p\",\"p-7\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Montserrat_eruption.JPG/320px-Montserrat_eruption.JPG\",\"alt\":\"The buried capital of Plymouth, Montserrat, destroyed by the Soufrière Hills volcanic eruption — one of the most dramatic natural disasters in Caribbean history\"}]}]\n24:[\"$\",\"p\",\"p-8\",{\"children\":[\"Meade's leadership during the early volcanic crisis was pivotal. Alongside then-Governor \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Frank Savage\"}],\", he served as one of the primary political anchors for a population living under the shadow of scientific uncertainty and existential displacement. The challenge was not merely logistical — it was psychological and constitutional. How do you govern an island when you cannot tell your citizens whether it is safe to remain? How do you maintain institutional authority when the seat of that authority is buried in ash? Meade and Savage conducted \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"regular radio broadcasts\"}],\" to keep the public informed and calm, modelling a kind of transparent crisis communication that was, for the era, unusual and vital.\"]}]\n25:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[[\"$\",\"em\",\"em-0\",{\"children\":\"\\\"We had to keep the people informed. Uncertainty was the enemy, and the best weapon against it was truth.\\\"\"}],\"\\n— Attributed to Reuben Meade during the volcanic crisis, 1995–1996\"]}],\"\\n\"]}]\n26:[\"$\",\"p\",\"p-9\",{\"children\":[\"The NPP lost the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"1996 general election\"}],\" to David Brandt's People's Democratic Movement, and Meade entered opposition — but the volcanic crisis, which intensified dramatically in 1997 with pyroclastic flows that killed 19 people in June of that year and buried Plymouth beneath metres of volcanic debris by August, meant that the emergency he had helped manage continued to define Montserratian politics for a decade. Approximately \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"two-thirds of the island's population\"}],\" — around 12,000 people — fled abroad during this period, creating a Montserratian diaspora that would complicate every subsequent political and economic calculation.\"]}]\n27:[\"$\",\"h3\",\"h3-2\",{\"children\":\"Return to Power: Chief Minister and First Premier, 2009–2014\"}]\n28:[\"$\",\"p\",\"p-10\",{\"children\":\"After the NPP's defeat, Meade spent years in opposition, watching as successive governments each struggled with the same overwhelming challenge: how to rebuild and repopulate an island that had lost its capital, its airport, much of its arable land, and the majority of its working-age population to the diaspora.\"}]\n29:[\"$\",\"p\",\"p-11\",{\"children\":[\"By \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"2009\"}],\", Meade was leading a new political vehicle: the \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"Movement for Change and Prosperity (MCAP)\"}],\". He led MCAP to victory in the 2009 general election and returned to office as Chief Minister, marking his second tenure in the island's highest political post. His return was a validation of his long political experience and his reputation as an economist capable of managing the island's chronic development challenges.\"]}]\n2a:[\"$\",\"p\",\"p-12\",{\"children\":[\"In \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"2011\"}],\", Montserrat adopted a \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"new constitution\"}],\" that modernized its governance framework and, among other changes, replaced the title of \\\"Chief Minister\\\" with \\\"\",[\"$\",\"strong\",\"strong-2\",{\"children\":\"Premie"])</script><script>self.__next_f.push([1,"r\"}],\"\\\" — a title more reflective of the enhanced self-governance provisions of the new constitutional order. Reuben Meade thus became \",[\"$\",\"strong\",\"strong-3\",{\"children\":\"Montserrat's first-ever Premier\"}],\", a constitutional milestone that added another historical distinction to his already remarkable career.\"]}]\n2b:[\"$\",\"p\",\"p-13\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/Montserrat_from_the_air.jpg/320px-Montserrat_from_the_air.jpg\",\"alt\":\"Aerial view of Montserrat showing the exclusion zone and the still-active volcanic landscape that has defined modern Montserratian politics\"}]}]\n2c:[\"$\",\"p\",\"p-14\",{\"children\":[\"Meade's tenure as Premier saw continued efforts to rebuild the island's economy and institutions in the post-volcanic era, drawing on his deep knowledge of development finance and his relationships with regional bodies including the Caribbean Development Bank. In the \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"2014 general election\"}],\", the MCAP was defeated by the \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"People's Democratic Movement (PDM)\"}],\" under Donaldson Romeo. Meade stepped down as party leader and announced his retirement from active politics in \",[\"$\",\"strong\",\"strong-2\",{\"children\":\"2016\"}],\", leaving behind a legacy that spanned two major constitutional eras of Montserratian governance.\"]}]\n2d:[\"$\",\"h3\",\"h3-3\",{\"children\":\"The Remarkable Third Act: Premier Again, 2024\"}]\n2e:[\"$\",\"p\",\"p-15\",{\"children\":[\"In a political career already distinguished by longevity and resilience, Reuben Meade added one more improbable chapter. Following an acrimonious falling-out with his former MCAP colleagues, he emerged from retirement in \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"2024\"}],\" to form a completely new political party: the \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"United Alliance (UA)\"}],\". Skeptics questioned whether a 70-year-old politician who had been retired for nearly a decade could mount a credible electoral challenge. The October \",[\"$\",\"strong\",\"strong-2\",{\"children\":\"2024 general election\"}],\" answered that question definitively: the United Alliance secured \",[\"$\",\"strong\",\"strong-3\",{\"children\":\"five of the nine seats\"}],\" in the Legislative Assembly, winning a majority and returning Meade to the premiership for the third time.\"]}]\n2f:[\"$\",\"p\",\"p-16\",{\"children\":[\"He was sworn in as \",[\"$\",\"strong\",\"strong-0\",{\"children\":\"Premier on 25 October 2024\"}],\", making him one of the few Caribbean leaders in history to have led three separate governments spanning more than three decades of national life. His 2026/27 budget, themed \",[\"$\",\"em\",\"em-0\",{\"children\":\"\\\"Economic Restoration and Transformation with Social Empowerment,\\\"\"}],\" focused on reducing dependence on British budgetary aid through public sector investment, infrastructure development (including the Little Bay Port), private sector growth, and the innovative exploration of \",[\"$\",\"strong\",\"strong-1\",{\"children\":\"geothermal energy\"}],\" and the extraction of critical minerals from volcanic geofluids — transforming the island's most destructive geological feature into a potential economic asset.\"]}]\n30:[\"$\",\"h3\",\"h3-4\",{\"children\":\"Legacy\"}]\n31:[\"$\",\"p\",\"p-17\",{\"children\":\"Reuben Theodore Meade's place in Montserratian history is secured by sheer longevity, constitutional significance, and the scale of the crises through which he led his island. He governed through Hurricane Hugo's aftermath, the Soufrière Hills volcanic disaster, the near-depopulation of his nation, two separate constitutional orders, and a 2024 political reinvention that would have seemed improbable to any rational observer. His career is not merely a chronicle of elections won and lost — it is the story of a small island's attempt to survive, rebuild, and reimagine itself in the face of catastrophes that would have broken a less resilient people.\"}]\n32:[\"$\",\"$L35\",null,{\"title\":\"Learn about the legacy of Reuben T. Meade\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/reuben-meade\"}]\n36:T4fc,Reuben T. Meade's"])</script><script>self.__next_f.push([1," contributions to Montserrat span more than three decades of active governance across three distinct tenures as Chief Minister and Premier. As the founder of two political parties — the National Progressive Party (1991) and the United Alliance (2024) — and a key leader of the Movement for Change and Prosperity, he demonstrated an unusual capacity for political reinvention in service of his island. His most defining historical contribution was his leadership during the early years of the Soufrière Hills volcanic crisis (1995–1996), when he helped stabilize a terrified and displaced population through transparent communication and decisive crisis management alongside the British Governor. As Montserrat's first Premier following the 2011 constitutional reforms, he oversaw a landmark modernization of the island's governance framework. His post-2024 administration has pursued a visionary economic agenda aimed at reducing dependence on British budgetary aid through infrastructure investment, private sector development, and the conversion of the island's volcanic geology from a liability into an energy and mineral resource. He is further notable as, at 37, the youngest head of government in CARICOM history at the time of his 1991 election.33:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"$36\"}]]}]\n"])</script><script>self.__next_f.push([1,"34:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"alt\":\"A.W. \\\"Art\\\" Saunders\",\"className\":\"w-full h-full object-cover\"}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null
