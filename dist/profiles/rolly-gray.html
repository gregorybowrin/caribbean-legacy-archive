0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Introduction\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[\"Captain Bertram Roland \\\"Rolly\\\" Gray (August 2, 1922 – February 22, 2008), widely revered across the archipelago as the \\\"Grand Master\\\" of Bahamian sloop sailing, stands as an enduring colossus in Caribbean maritime history [1]. Hailing from the tranquil settlement of Staniel Cay in the Exuma Cays, Gray transformed traditional Bahamian workboat sailing from a humble subsistence trade into the pinnacle of national sporting prestige [2]. In a seafaring career spanning more than six decades, he achieved legendary status as the most dominant skipper in the history of the National Family Island Regatta, sailing the famed Class A sloop \",[\"$\",\"em\",\"em-0\",{\"children\":\"Tida Wave\"}],\" to an unprecedented series of national championships in the crystalline waters of Elizabeth Harbour off George Town, Exuma [3]. Renowned for his supernatural ability to read unseen wind shifts, his surgical precision on the wooden tiller, and his peerless mastery of dynamic sail trim and human ballast, Gray came to embody the resilience, ingenuity, and seafaring brilliance of the Bahamian Family Islands [4]. Beyond the racecourse, he was a trusted mailboat captain, an intuitive shipwright, a community patriarch, and a mentor whose indomitable spirit earned him appointment as a Member of the Most Excellent Order of the British Empire (MBE), induction into the National Sports Hall of Fame, and the rare honor of having a Royal Bahamas Defence Force patrol vessel, the \",[\"$\",\"em\",\"em-1\",{\"children\":\"HMBS Rolly Gray\"}],\", commissioned in his memory [5].\"]}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/e/e4/Exuma_and_Cays_in_Bahamas.svg\",\"alt\":\"A district locator map highlighting the Exuma Cays within the Commonwealth of the Bahamas, where Captain Rolly Gray forged his legendary sailing career.\"}]}],\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\",\"\\n\",\"$L37\",\"\\n\",\"$L38\",\"\\n\",\"$L39\",\"\\n\",\"$L3a\"]}]]}],\"$L3b\",\"$L3c\",false]}],\"$L3d\"]}]\n"])</script><script>self.__next_f.push([1,"3e:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/e/eb/Northern_Exuma_Islands_%28Bahamas%29_1.jpg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1f:[\"$\",\"h3\",\"h3-1\",{\"children\":\"Early Life and Seafaring Roots in the Exuma Cays\"}]\n20:[\"$\",\"p\",\"p-2\",{\"children\":\"Roland \\\"Rolly\\\" Gray was born on August 2, 1922, on Staniel Cay, a secluded sliver of limestone and coral situated in the northern half of the 365-island Exuma archipelago [1]. He was the son of Richard and Blanche Gray, members of a proud, tight-knit maritime lineage that had wrested a living from the ocean for generations [3]. In the early twentieth century, the Out Islands (now known as the Family Islands) existed in near-total isolation from the colonial capital of Nassau. There were no paved airstrips, telegraph networks, or motorized container vessels servicing the small cays; community survival was governed entirely by the tides, the seasonal trade winds, and the sturdy wooden boats crafted by local hands from native timber [6].\"}]\n21:[\"$\",\"p\",\"p-3\",{\"children\":[\"Young Rolly displayed an instinctive connection to the sea almost as soon as he could walk. As a boy, he and his childhood companions roamed the scrubland of Staniel Cay searching for \",[\"$\",\"em\",\"em-0\",{\"children\":\"camalami\"}],\" wood, an indigenous hardwood whose naturally curved branches were uniquely suited for carving miniature hulls [1]. Using discarded cotton thread and salvaged flour sacks to fashion crude sails, Gray staged miniature races along the shallow sand flats, intuitively experimenting with keel weight, sail angles, and windward stability long before he ever received formal maritime instruction [4]. As he entered adolescence, his ties to the neighbouring Exuma community of Black Point deepened; it was there that he met and eventually married his lifelong companion, Maggie Bodie [1].\"]}]\n22:[\"$\",\"p\",\"p-4\",{\"children\":\"At the age of fifteen, Gray formally entered the commercial maritime workforce as a deckhand on inter-island trading schooners and fishing smacks [3]. The seafaring life was grueling: harvesting conch, sponge, and crawfish, hauling agricultural cargo, and navigating treacherous coral heads without charts, buoys, or modern navigation aids. By the remarkably young age of eighteen, his extraordinary navigational instincts, steady nerve, and natural leadership earned him command of his own commercial vessel, inaugurating a career as one of the youngest and most trusted workboat captains in the archipelago [4].\"}]\n23:[\"$\",\"p\",\"p-5\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/e/eb/Northern_Exuma_Islands_%28Bahamas%29_1.jpg\",\"alt\":\"The pristine turquoise waters of the northern Exuma cays, home to Staniel Cay and the traditional Bahamian sailing grounds.\"}]}]\n24:[\"$\",\"h3\",\"h3-2\",{\"children\":\"The Craft and Physics of the Bahamian Working Sloop\"}]\n25:[\"$\",\"p\",\"p-6\",{\"children\":\"To comprehend Rolly Gray's genius, one must understand the unique mechanical and architectural character of the traditional Bahamian working sloop [2]. Across an archipelago dominated by shallow sandbanks, coral reefs, and sudden ocean drops, Bahamian shipwrights developed an indigenous craft optimized for cargo capacity, shallow draft, and blistering speed under canvas [6]. These vessels were built entirely \\\"by eye\\\" without formal blueprints, using naturally curved ribs of tough native hardwoods—such as madeira, dogwood, horseflesh, and wild tamarind—sheathed in thick pine planking and caulked with pitch and oakum [7].\"}]\n26:[\"$\",\"p\",\"p-7\",{\"children\":[\"Unlike modern racing yachts fitted with heavy lead bulb keels that prevent capsize, traditional Baha"])</script><script>self.__next_f.push([1,"mian sloops relied on a long, shallow wooden keel and an exceptionally wide beam to navigate shallow bonefish flats and reef channels [6]. To propel these heavy displacement hulls through the water, builders equipped them with an outrageously overpowered sail plan: a colossal wooden mast stepped far forward, carrying an enormous triangular mainsail whose boom stretched ten to fifteen feet past the transom [2]. To sail such a drastically overpowered vessel without capsizing required dynamic, active human ballast, achieved through the ingenious system of \\\"pry boards\\\" (locally termed \",[\"$\",\"em\",\"em-0\",{\"children\":\"prys\"}],\") [8].\"]}]\n27:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"To sail a Bahamian sloop on the wind is to dance on a knife's edge. You must feel the pull through the wooden tiller, read the color of the water beneath the hull, and trust the crew out on the pry boards with your very life.\\\"\\n— Captain Rolly Gray\"}],\"\\n\"]}]\n28:[\"$\",\"p\",\"p-8\",{\"children\":\"Pry boards were long, heavy planks of timber that slid laterally across the deck beneath iron straps or wooden cleats [8]. When the sloop tacked and heeled over in heavy gusts, a daredevil crew of ten to fifteen men—the \\\"pry crew\\\"—scrambled out onto the wooden planks suspended high above the roaring water on the windward side [6]. Every tack demanded split-second choreography: the crew had to haul in the prys, slide them across the rushing deck as the massive boom swept overhead, and sprint out onto the opposite side in fractions of a second [8]. The slightest hesitation resulted in a catastrophic capsize; too much ballast on the rail meant sacrificing crucial boatspeed. Gray mastered this delicate equilibrium better than any skipper alive. He possessed an uncanny ability to \\\"feel\\\" the hull through the tiller, directing his pry crew with crisp, calm commands that pushed his sloops to the absolute limit of hydrodynamic stability [4].\"}]\n29:[\"$\",\"h3\",\"h3-3\",{\"children\":\"The 1954 Out Island Regatta and the Dawn of a Legend\"}]\n2a:[\"$\",\"p\",\"p-9\",{\"children\":[\"By the early 1950s, the glorious age of Bahamian working sail was facing an existential crisis. The rapid advent of cheap marine diesel engines and motorized freighters began replacing the traditional wooden working sloops that had sustained the Bahamian islands for over two centuries [6]. Recognizing that an invaluable cultural art form was rapidly facing extinction, American yachtsman and Exuma resident \",[\"$\",\"code\",\"code-0\",{\"children\":\"[Linton Rigg](/profiles/linton-rigg)\"}],\", together with prominent Bahamian yachtsmen including Bobby Symonette (son of Premier \",[\"$\",\"code\",\"code-1\",{\"children\":\"[Sir Roland Symonette](/profiles/roland-symonette)\"}],\"), conceived the idea of an annual competition to celebrate and preserve the working craft [9].\"]}]\n2b:[\"$\",\"p\",\"p-10\",{\"children\":\"In April 1954, the inaugural Out Island Regatta was staged in the natural amphitheater of Elizabeth Harbour in George Town, Exuma [9]. Working sloops from every corner of the colony—from Andros, Long Island, Abaco, Cat Island, and the Exuma Cays—converged on George Town, their decks loaded with conch, fish, and boisterous crews eager to test their speed [6].\"}]\n2c:[\"$\",\"p\",\"p-11\",{\"children\":[\"Among the competitors was thirty-one-year-old Rolly Gray, at the helm of the sloop \",[\"$\",\"em\",\"em-0\",{\"children\":\"The Marie\"}],\" [1]. The seasoned older skippers, veterans of decades of inter-island trading, initially viewed the youthful captain from Staniel Cay with skepticism. However, when the starting gun fired, Gray executed a masterclass in tactical sailing. Reading the local wind shears bouncing off Stocking Island and navigating the tricky tidal currents of the harbour with flawless instinct, Gray sailed \",[\"$\",\"em\",\"em-1\",{\"children\":\"The Marie\"}],\" to an astonishing victory, capturing the inaugural Class A championship [1]. He was the youngest skipper to lift the championship trophy, instantly becoming a national sporting hero and establishing a legendary dynasty that would defi"])</script><script>self.__next_f.push([1,"ne Bahamian regatta culture for generations [4].\"]}]\n2d:[\"$\",\"h3\",\"h3-4\",{\"children\":\"The Golden Era of Tida Wave and Unrivaled Dominance\"}]\n2e:[\"$\",\"p\",\"p-12\",{\"children\":[\"Following his breakthrough 1954 triumph, Rolly Gray entered a period of sporting dominance unmatched in Bahamian history [2]. Over the next two decades, Gray proved that his inaugural victory was no accident, winning titles across Class A, B, and C divisions on a variety of celebrated sloops, including \",[\"$\",\"em\",\"em-0\",{\"children\":\"Lady Muriel\"}],\" and \",[\"$\",\"em\",\"em-1\",{\"children\":\"Sea Hound\"}],\" [1]. However, his name became immortalized through his legendary partnership with the most decorated racing vessel in Caribbean history: the fabled Class A sloop \",[\"$\",\"em\",\"em-2\",{\"children\":\"Tida Wave\"}],\" (#16) [3].\"]}]\n2f:[\"$\",\"p\",\"p-13\",{\"children\":[\"Built in 1965 by the revered master shipwright Rupert Knowles of Mangrove Bush, Long Island, \",[\"$\",\"em\",\"em-0\",{\"children\":\"Tida Wave\"}],\" was a twenty-eight-foot masterpiece of wooden marine architecture [3]. Yet it was Captain Rolly Gray who unlocked the boat’s full potential. Gray possessed an unparalleled gift for sail tuning, hull balance, and spar adjustment. He would spend days tuning the internal lead ingots in the bilge, adjusting the rake of the mast, and recutting canvas to ensure optimal aerodynamics in varying sea states [4].\"]}]\n30:[\"$\",\"p\",\"p-14\",{\"children\":[\"Aboard \",[\"$\",\"em\",\"em-0\",{\"children\":\"Tida Wave\"}],\", Gray embarked on an awe-inspiring reign that came to be known as the boat's \\\"Golden Era\\\" [3]. During the 1960s and 1970s, Gray steered \",[\"$\",\"em\",\"em-1\",{\"children\":\"Tida Wave\"}],\" through an astonishing eleven-year championship winning streak, turning the National Family Island Regatta into a personal showcase of maritime supremacy [1]. When rival sloops such as \",[\"$\",\"em\",\"em-2\",{\"children\":\"Thunderbird\"}],\", \",[\"$\",\"em\",\"em-3\",{\"children\":\"Red Stripe\"}],\", and \",[\"$\",\"em\",\"em-4\",{\"children\":\"Courageous\"}],\" challenged him, Gray consistently outmaneuvered them at the windward mark, daringly riding the edge of Elizabeth Harbour’s shallow shoals where less experienced captains feared to sail [7].\"]}]\n31:[\"$\",\"p\",\"p-15\",{\"children\":\"His international renown grew so great that when Prince Philip, Duke of Edinburgh, visited the Bahamas, the royal consort requested to sail alongside the Exuma master mariner [10]. Gray took Prince Philip aboard his vessel, guiding the British royal through the subtleties of Bahamian sloop handling. For decades afterward, Gray proudly displayed the wooden tiller handled by the Duke inside his celebrated community establishment, \\\"The Royal Entertainer’s Lounge,\\\" on Staniel Cay [10].\"}]\n32:[\"$\",\"blockquote\",\"blockquote-1\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"In the turquoise waters of Elizabeth Harbour, Captain Rolly Gray was not merely a competitors' skipper; he was a master conductor of the sea. When Rolly laid his hand upon the helm of Tida Wave, the wind itself seemed to answer his call.\\\"\\n— Bahamian Regatta Lore \u0026 Oral History\"}],\"\\n\"]}]\n33:[\"$\",\"h3\",\"h3-5\",{\"children\":\"Lifeline of the Archipelago: Mailboat Service and Island Leadership\"}]\n34:[\"$\",\"p\",\"p-16\",{\"children\":[\"While regatta glory brought Rolly Gray national fame, his daily life was grounded in humble, indispensable service to his fellow islanders [4]. In an era before regular commercial flights and automated container shipping, the Family Islands depended entirely on government mailboats for their economic survival. Captain Gray served for many years as a commercial mailboat captain, commanding vessels such as the \",[\"$\",\"em\",\"em-0\",{\"children\":\"MV Grand Master\"}],\" [11].\"]}]\n35:[\"$\",\"p\",\"p-17\",{\"children\":\"Commanding a mailboat through the shallow, treacherous waters of the Exuma Sound and the Great Bahama Bank required an extraordinary degree of seamanship [6]. With little to no electronic radar or GPS navigation, Gray relied on \\\"piloting by the eye\\\"—reading the subtle color gradations of the turquoise water to determine depth, gauging the speed of tida"])</script><script>self.__next_f.push([1,"l currents through narrow cuts between cays, and navigating by the stars during pitch-black nights [4]. He transported mail, groceries, medical supplies, fuel, livestock, and passengers, braving sudden tropical squalls and gale-force winter cold fronts to ensure that isolated settlements received their lifelines [11].\"}]\n36:[\"$\",\"p\",\"p-18\",{\"children\":\"On Staniel Cay, Gray was universally regarded as a pillar of the community [4]. His establishment, The Royal Entertainer’s Lounge, served not only as a lively social hub where sailors, tourists, and locals gathered to swap sea stories, but also as an informal town hall where disputes were resolved and community welfare initiatives were organized [10]. He mentored countless young Bahamians in the maritime trades, teaching them the ancient disciplines of boatbuilding, sailmaking, and navigation, ensuring that the legacy of wooden boat culture would outlive him [12].\"}]\n37:[\"$\",\"h3\",\"h3-6\",{\"children\":\"Honors, Commemoration, and Lasting Legacy\"}]\n38:[\"$\",\"p\",\"p-19\",{\"children\":[\"Captain Rolly Gray’s lifetime of achievements was recognized at the highest levels of Bahamian society and the Commonwealth [4]. In 1977, he was awarded the Queen's Certificate of Honour, and in the 1983 New Year's Honours, Queen Elizabeth II appointed him a Member of the Most Excellent Order of the British Empire (MBE) in recognition of his outstanding contributions to Bahamian sports, culture, and maritime development [1]. He was subsequently inducted into the Bahamas National Sports Hall of Fame and the National Regatta Hall of Fame, taking his rightful place alongside other Bahamian sporting giants such as Olympic sailing pioneer \",[\"$\",\"code\",\"code-0\",{\"children\":\"[Sir Durward Knowles](/profiles/durward-knowles)\"}],\" [5]. Furthermore, his portrait and legacy were enshrined on the prestigious \\\"Walk of Fame\\\" at Lynden Pindling International Airport in Nassau, named for Father of the Nation \",[\"$\",\"code\",\"code-1\",{\"children\":\"[Sir Lynden Pindling](/profiles/lynden-pindling)\"}],\" [1].\"]}]\n39:[\"$\",\"p\",\"p-20\",{\"children\":\"On February 22, 2008, Captain Rolly Gray passed away at the age of eighty-five, precipitating an outpouring of grief and tribute across the Bahamian nation [1]. Government leaders, regatta skippers, and ordinary Family Islanders hailed him as an irreplaceable national treasure whose life had defined an epoch of Bahamian history [4].\"}]\n3a:[\"$\",\"p\",\"p-21\",{\"children\":[\"To ensure that his name would remain forever intertwined with Bahamian maritime heritage, the Royal Bahamas Defence Force commissioned a 30-meter Legend-class patrol vessel, the \",[\"$\",\"em\",\"em-0\",{\"children\":\"HMBS Rolly Gray\"}],\" (P-62), in 2015 [5]. On his home island of Staniel Cay, the central regatta gathering grounds and waterfront park were named and celebrated in his honor, serving as the permanent venue for local regattas and cultural festivals [12]. Across Exuma, civic organizations continue to advocate for the official renaming of Elizabeth Harbour in George Town to \\\"Rolly Gray Harbour,\\\" commemorating the waters where he achieved his greatest triumphs [4]. Today, the sloop \",[\"$\",\"em\",\"em-1\",{\"children\":\"Tida Wave\"}],\" continues to race in regattas across the Bahamas, carrying the spirit, tactical wisdom, and indomitable legacy of the Grand Master wherever the wind fills her sails [3].\"]}]\n3b:[\"$\",\"$L3e\",null,{\"title\":\"Learn about the legacy of Captain Rolly Gray\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/rolly-gray\"}]\n3f:T663,"])</script><script>self.__next_f.push([1,"Captain Bertram Roland 'Rolly' Gray made monumental contributions to Bahamian culture, sports, and maritime heritage as the preeminent sailing master in the nation's history. As the pioneer and undisputed king of the National Family Island Regatta, Gray elevated the traditional Bahamian working sloop from an endangered utilitarian workboat into the cornerstone of modern Bahamian sporting identity. After winning the inaugural Class A championship at George Town in 1954 aboard The Marie, he went on to dominate the regatta circuit for decades, most notably skippering the legendary Long Island-built Class A sloop Tida Wave to an unprecedented eleven-year championship winning streak. His mastery of dynamic human ballast on pry boards, sail-tuning precision, and intuitive weather tactics established the technical standard for competitive sloop racing across the Caribbean.\n\nBeyond competitive sailing, Captain Gray served as a vital lifeline for the archipelago as a long-standing mailboat captain, navigating treacherous unlit channels across the Exuma Sound and Bahama Banks to deliver food, medicine, and cargo to isolated Out Island communities. As the patriarch of Staniel Cay, he operated the Royal Entertainer's Lounge and mentored generations of younger Bahamian shipwrights and skippers, preserving the craft of wooden shipbuilding. In recognition of his enduring national impact, Gray was appointed an MBE, inducted into the Bahamas National Sports Hall of Fame, commemorated through the Staniel Cay regatta park, and honored by the Royal Bahamas Defence Force with the commissioning of the patrol ship HMBS Rolly Gray."])</script><script>self.__next_f.push([1,"3c:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"$3f\"}]]}]\n"])</script><script>self.__next_f.push([1,"3d:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"alt\":\"A.W. \\\"Art\\\" Saunders\",\"className\":\"w-full h-full object-cover\"}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"font-serif text-lg text-navy line-clamp-1\",\"children\":\"A.W. \\\"Art\\\" Saunders\"}],[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40\",\"children\":\"Turks \u0026 Caicos Islands\"}]]}]]}],[\"$\",\"$L6\",\"c0c62444-53a6-4e76-beb3-50dff472d653\",{\"href\":\"/profiles/adelaide-bernabela\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"div\",null,{\"className\":\"flex items-center justify-center font-bold text-white shadow-lg bg-gradient-to-br from-slate-700 to-slate-500 text-xl w-full h-full rounded-none\",\"aria-label\":\"Profile picture placeholder for Adelaide Bernabela\",\"title\":\"Adelaide Bernabela\",\"children\":[\"$\",\"span\",null,{\"className\":\"drop-shadow-md tracking-wider\",\"children\":\"AB\"}]}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"font-serif text-lg text-navy line-clamp-1\",\"children\":\"Adelaide Bernabela\"}],[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40\",\"children\":\"Bonaire\"}]]}]]}]]}]]}]\n"])</script></body></html>
