}],[\"rect\",{\"width\":\"18\",\"height\":\"18\",\"x\":\"3\",\"y\":\"4\",\"rx\":\"2\",\"key\":\"1hopcy\"}],[\"path\",{\"d\":\"M3 10h18\",\"key\":\"8toen8\"}]],\"className\":\"lucide-calendar h-4 w-4 text-gold mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Life Dates\"}],[\"$\",\"span\",null,{\"className\":\"text-sm font-semibold\",\"children\":[1780,\" – \",1802]}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M12 7v14\",\"key\":\"1akyts\"}],[\"path\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\",\"key\":\"ruj8y\"}]],\"className\":\"lucide-book-open h-4 w-4 text-navy/60 mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Areas of Influence\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2 mt-1\",\"children\":[[\"$\",\"$L6\",\"0\",{\"href\":\"/areas/history\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"History\"}],\"$L1b\"]}]]}]]}]]}]]}]]}],\"$L1c\"]}]}]]}]\n"])</script><script>self.__next_f.push([1,":HL[\"https://upload.wikimedia.org/wikipedia/commons/e/ec/Sanit%C3%A9_Belair_2.jpg\",\"image\"]\n1b:[\"$\",\"$L6\",\"1\",{\"href\":\"/areas/civil-rights\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Civil Rights\"}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Sanité Bélair\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Introduction\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[\"Suzanne Bélair, affectionately known to history as Sanité Bélair, stands as one of the most remarkable and defiant military figures of the Haitian Revolution. Born into a slave society during the height of Saint-Domingue's colonial wealth, she rejected the submissive roles dictated by both her gender and the plantation machine [1]. As a free woman of color, she chose to cast her lot with the uprising of the enslaved masses, rising to become a lieutenant in the army of \",[\"$\",\"code\",\"code-0\",{\"children\":\"[Toussaint Louverture](/profiles/toussaint-louverture)\"}],\" [2]. Alongside her husband, General Charles Bélair, she waged a relentless guerrilla war against the French forces sent by Napoleon Bonaparte to re-establish slavery [3]. Nicknamed the \\\"Tigress\\\" (la tigresse) by her contemporaries for her fierce combat style and tactical intelligence, Sanité Bélair commandingly demonstrated that women were not merely witnesses to the struggle for liberty, but active architects of Haitian freedom [4]. Her execution by French forces in October 1802, marked by a final act of legendary defiance, served as a catalyst that united the revolutionary leadership, cementing her legacy as a founding heroine of the Haitian nation [5].\"]}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/e/ec/Sanit%C3%A9_Belair_2.jpg\",\"alt\":\"Sanité Bélair as depicted on the 10-gourde banknote of the Haitian Gourde.\"}]}],\"\\n\",[\"$\",\"h3\",\"h3-1\",{\"children\":\"Early Life and the Affranchi Caste\"}],\"\\n\",[\"$\",\"p\",\"p-2\",{\"children\":[\"Sanité Bélair was born Suzanne Bélair around 1781 in Verrettes, a settlement in the fertile Artibonite valley of Saint-Domingue [2]. At the time, Saint-Domingue was France's most lucrative colony, powered by the labor of hundreds of thousands of enslaved Africans working under unspeakable conditions on sugar and coffee plantations. Sanité was born into the \",\"$L1d\",\" caste (free people of color), which occupied a complex and precarious middle tier in the colonial hierarchy [6]. While \",\"$L1e\",\" could own property and even own slaves, they were subjected to systemic social segregation, legal disenfranchisement, and daily humiliations under the Code Noir and subsequent racial laws. They were barred from holding public office, practicing certain professions, and wearing European-style luxury clothing.\"]}],\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\",\"\\n\",\"$L37\",\"\\n\",\"$L38\",\"\\n\",\"$L39\",\"\\n\",\"$L3a\",\"\\n\",\"$L3b\",\"\\n\",\"$L3c\",\"\\n\",\"$L3d\",\"\\n\",\"$L3e\"]}]]}],\"$L3f\",\"$L40\",false]}],\"$L41\"]}]\n"])</script><script>self.__next_f.push([1,"42:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1d:[\"$\",\"em\",\"em-0\",{\"children\":\"affranchi\"}]\n1e:[\"$\",\"em\",\"em-1\",{\"children\":\"affranchis\"}]\n1f:[\"$\",\"p\",\"p-3\",{\"children\":[\"Growing up in the Artibonite, a fertile valley framed by steep mountains, Sanité witnessed both the brutality of the slave system and the growing restiveness of the free Black and mixed-race population. When the Haitian Revolution erupted in the northern province in August 1791, initiated by the religious ceremony at Bois Caïman led by \",[\"$\",\"code\",\"code-0\",{\"children\":\"[Dutty Boukman](/profiles/dutty-boukman)\"}],\" and Cécile Fatiman, the Artibonite quickly became a contested theater of war. The conflict dismantled the traditional social order, presenting free people of color with a choice: side with the colonial status quo in hopes of gaining civil rights, or unite with the insurgent enslaved population to destroy the plantation system entirely. Sanité and her family chose the path of total revolution.\"]}]\n20:[\"$\",\"h3\",\"h3-2\",{\"children\":\"Marriage, Command, and the Revolutionary Army\"}]\n21:[\"$\",\"p\",\"p-4\",{\"children\":[\"In 1796, at the young age of fifteen, Suzanne married Charles Bélair, a promising officer in the revolutionary forces [1]. Charles was the nephew of \",[\"$\",\"code\",\"code-0\",{\"children\":\"[Toussaint Louverture](/profiles/toussaint-louverture)\"}],\", the brilliant military strategist who had risen to command the revolutionary army. Louverture, recognizing Charles’s intelligence and loyalty, mentored him closely, eventually promoting him to general of brigade.\"]}]\n22:[\"$\",\"p\",\"p-5\",{\"children\":\"Sanité’s marriage was not a withdrawal into domesticity. Instead, it marked her formal entry into the military life of the revolution. She did not serve in an auxiliary capacity, such as a nurse or camp follower, as was common for women of the era. Rather, she donned the uniform of the revolutionary army, strapped on a sabre, carried a pistol, and rode a horse alongside the male soldiers [7]. Her tactical acumen and raw courage on the battlefield earned her rapid promotion. She rose from sergeant to lieutenant in Toussaint Louverture's forces [2].\"}]\n23:[\"$\",\"p\",\"p-6\",{\"children\":[\"Her contemporaries, including the future Emperor \",[\"$\",\"code\",\"code-0\",{\"children\":\"[Jean-Jacques Dessalines](/profiles/jean-jacques-dessalines)\"}],\", were astonished by her military discipline and fierce demeanor in battle [4]. She was known for personally training recruits, organizing logistics, and leading cavalry charges. In the rugged terrain of the Artibonite and Matheux mountains, she became a master of guerrilla tactics. She understood that the revolutionary army, often outgunned by European forces, had to rely on speed, ambush, and local knowledge of the mountains to defeat their enemies.\"]}]\n24:[\"$\",\"h3\",\"h3-3\",{\"children\":\"The Leclerc Expedition and the Rise of Resistance\"}]\n25:[\"$\",\"p\",\"p-7\",{\"children\":[\"By 1801, \",[\"$\",\"code\",\"code-0\",{\"children\":\"[Toussaint Louverture](/profiles/toussaint-louverture)\"}],\" had consolidated control over the entire island of Hispaniola and promulgated a constitution that declared him governor-general for life and abolished slavery forever. This act of autonomy enraged Napoleon Bonaparte, who had seized power in France. In late 1801, Bonaparte dispatched a massive expeditionary force of over 20,000 veteran French troops under the command of his brother-in-law, General Charles Leclerc. Leclerc's secret instructions were to disarm the Black population, deport the revolutionary leadership, and restore the pre-1789 colonial regime, including slavery.\"]}]\n26:[\"$\",\"p\",\"p-8\",{\"children\":[\"The French invasion began in February 1802 an"])</script><script>self.__next_f.push([1,"d initiated months of savage, scorched-earth warfare. Despite fierce resistance, several of Louverture's top generals, including \",[\"$\",\"code\",\"code-0\",{\"children\":\"[Jean-Jacques Dessalines](/profiles/jean-jacques-dessalines)\"}],\" and \",[\"$\",\"code\",\"code-1\",{\"children\":\"[Henri Christophe](/profiles/henri-christophe)\"}],\", were forced to negotiate peace treaties and submit to Leclerc's authority. In May 1802, Toussaint Louverture himself agreed to lay down his arms in exchange for retirement to his plantation. Charles Bélair, following Louverture's lead, also submitted to the French and was incorporated into the colonial army under Leclerc.\"]}]\n27:[\"$\",\"p\",\"p-9\",{\"children\":\"However, this peace was short-lived. In June 1802, Louverture was treacherously arrested by the French and deported to a cold prison in France, where he would die. Furthermore, rumors began to filter back from the neighboring colony of Guadeloupe that the French had successfully restored slavery there. Leclerc’s forces began a campaign to systematically disarm the Black population of Saint-Domingue.\"}]\n28:[\"$\",\"p\",\"p-10\",{\"children\":\"Sanité Bélair refused to accept submission. She recognized that the French promises of freedom were a ruse to disarm the population before reinstating the whip [3]. She urged her husband Charles to break his ties with Leclerc and return to the mountains to launch a new rebellion. In the late summer of 1802, Charles and Sanité Bélair fled into the Matheux mountains and raised the standard of revolt [8].\"}]\n29:[\"$\",\"h3\",\"h3-4\",{\"children\":\"The Matheux Insurrection and Guerrilla Campaign\"}]\n2a:[\"$\",\"p\",\"p-11\",{\"children\":[\"The insurrection launched by the Bélairs was one of the earliest and most significant responses to the threat of re-enslavement. They mobilized thousands of local agricultural laborers, known as \",[\"$\",\"em\",\"em-0\",{\"children\":\"cultivateurs\"}],\", who were determined to defend their freedom at all costs. Sanité was the driving force behind the rebellion's military operations [2].\"]}]\n2b:[\"$\",\"p\",\"p-12\",{\"children\":\"Operating from hidden camps in the Artibonite department, Sanité led hit-and-run attacks on French outposts, cut off communication lines, and ambushed French supply columns [8]. The French soldiers, unaccustomed to the tropical heat and the mountainous terrain, found themselves constantly harassed by the Bélairs' forces. Leclerc, writing to Napoleon, expressed deep frustration at the persistence of the rebellion, noting that even the women of Saint-Domingue fought with a fanatical devotion to the cause of liberty.\"}]\n2c:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"The women here are even more fearsome than the men. They encourage the soldiers to fight, they carry ammunition, and they will choose death over slavery.\\\"\\n— General Charles Leclerc (in letters to Napoleon Bonaparte)\"}],\"\\n\"]}]\n2d:[\"$\",\"p\",\"p-13\",{\"children\":\"Sanité Bélair’s leadership was characterized by her refusal to show fear. She was always at the front of her troops, her voice calling out commands over the din of battle. Under her direction, the insurrection spread rapidly, threatening the French control of the Artibonite plains.\"}]\n2e:[\"$\",\"h3\",\"h3-5\",{\"children\":\"Betrayal, Capture, and the Military Tribunal\"}]\n2f:[\"$\",\"p\",\"p-14\",{\"children\":\"Alarmed by the spread of the rebellion, Leclerc ordered General Donatien de Rochambeau, a commander notorious for his extreme cruelty, to crush the Bélairs [8]. Rochambeau deployed heavily armed columns and utilized local collaborators who knew the mountain pathways.\"}]\n30:[\"$\",\"p\",\"p-15\",{\"children\":\"In September 1802, French forces launched a surprise multi-pronged attack on the Bélairs' main camp in the Artibonite. Despite a desperate defense led by Sanité, the revolutionary forces were overwhelmed. Sanité fought fiercely to allow her soldiers to retreat, but she was surrounded, overpowered, and captured by the French troops [2].\"}]\n31:[\"$\",\"p\",\"p-16\",{\"children\":\"When Charles Bélair, who had been commanding another division in th"])</script><script>self.__next_f.push([1,"e mountains, learned that his beloved wife had been captured, he was devastated. Knowing the horrific tortures the French routinely inflicted on captured rebels, and refusing to abandon his wife to her fate, Charles made the fateful decision to surrender himself to the French in hopes of negotiating her release or sharing her destiny [1].\"}]\n32:[\"$\",\"p\",\"p-17\",{\"children\":\"The French had no intention of mercy. The Bélairs were bound in chains and taken to Cap-Français, the colonial capital, where they were placed before a military tribunal composed of French officers and colonial collaborators. The trial was brief. On October 5, 1802, both Charles and Sanité Bélair were found guilty of rebellion against the French Republic and sentenced to death [1].\"}]\n33:[\"$\",\"h3\",\"h3-6\",{\"children\":\"The Defiant Martyrdom\"}]\n34:[\"$\",\"p\",\"p-18\",{\"children\":\"The sentencing of the Bélairs highlighted the intersection of colonial racism and gender bias. The tribunal sentenced Charles Bélair, as a military officer, to be executed by a firing squad—a death considered honorable for a soldier. However, because Sanité was a woman, the court decreed that she would not face a firing squad; instead, she was sentenced to be decapitated by the executioner's sword [1].\"}]\n35:[\"$\",\"p\",\"p-19\",{\"children\":\"Sanité Bélair regarded this sentence as an insult to her military rank and her identity as a soldier of liberty. She vehemently protested the court's decision, demanding the right to be shot alongside her husband [7].\"}]\n36:[\"$\",\"p\",\"p-20\",{\"children\":\"On the morning of October 5, 1802, the Bélairs were led to the execution ground in Cap-Français [1]. As she was brought to the scaffold, the executioner approached her with a blindfold and ordered her to kneel and bow her head. Sanité refused. She threw off the blindfold and stood upright, staring directly at the executioner and the gathered crowd. She declared that she had fought as a soldier and would die as one.\"}]\n37:[\"$\",\"p\",\"p-21\",{\"children\":\"Her extraordinary bravery and physical resistance on the scaffold unnerved the executioner and the French officers. Recognizing that forcing her to the block would create a chaotic scene, the French officers relented and ordered that she be executed by firing squad instead [7].\"}]\n38:[\"$\",\"p\",\"p-22\",{\"children\":\"Before she was marched to the firing wall, she watched the execution of her husband, Charles. Rather than breaking down in grief, she called out to him, urging him to die bravely and with the dignity of a revolutionary soldier.\"}]\n39:[\"$\",\"blockquote\",\"blockquote-1\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"Viv libète! A ba esclavaj!\\\"\\n(Long live freedom! Down with slavery!)\\n— Sanité Bélair’s final words before the firing squad\"}],\"\\n\"]}]\n3a:[\"$\",\"p\",\"p-23\",{\"children\":\"When she took her place before the firing squad, she refused to be tied to the post or to have her eyes covered. She looked directly into the barrels of the French muskets. With her final breath, she shouted her defiance. The volley of musketry silenced her voice, but her death sealed her place in the pantheon of revolutionary martyrs.\"}]\n3b:[\"$\",\"h3\",\"h3-7\",{\"children\":\"Legacy and Commemoration\"}]\n3c:[\"$\",\"p\",\"p-24\",{\"children\":[\"The execution of Sanité and Charles Bélair had the opposite effect of what Leclerc had intended. Rather than terrorizing the population into submission, the death of these two prominent figures, particularly the legendary bravery of Sanité, sent shockwaves through Saint-Domingue. It convinced Black officers still serving in the French army, such as \",[\"$\",\"code\",\"code-0\",{\"children\":\"[Jean-Jacques Dessalines](/profiles/jean-jacques-dessalines)\"}],\" and \",[\"$\",\"code\",\"code-1\",{\"children\":\"[Henri Christophe](/profiles/henri-christophe)\"}],\", that the French sought nothing less than the complete destruction of their leadership and the restoration of slavery. Within weeks of her death, Dessalines and Christophe broke permanently with the French, uniting all revolutionary factions to wage the final war of independence.\"]}]\n3d:[\"$\","])</script><script>self.__next_f.push([1,"\"p\",\"p-25\",{\"children\":\"Sanité Bélair is officially recognized by the Republic of Haiti as a National Heroine [2]. She is celebrated alongside Catherine Flon, who sewed the first Haitian flag, as a symbol of the vital role women played in the liberation of the country. In 2004, to mark the Bicentennial of Haitian Independence, the Bank of the Republic of Haiti issued a commemorative 10-gourde banknote featuring Sanité Bélair’s portrait, making her only the second woman in Haitian history to appear on the nation's currency [9].\"}]\n3e:[\"$\",\"p\",\"p-26\",{\"children\":\"Her legacy is a powerful reminder that the Haitian Revolution was not only a struggle led by men, but a collective uprising in which women fought, commanded, and died on the front lines to secure human rights and national sovereignty. Today, streets, schools, and cultural institutions in Haiti bear her name, and she remains a source of inspiration for feminist and anti-colonial movements throughout the Caribbean and the African diaspora.\"}]\n3f:[\"$\",\"$L42\",null,{\"title\":\"Learn about the legacy of Sanité Bélair\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/sanite-belair\"}]\n43:T484,Sanité Bélair made pioneering contributions to the Haitian Revolution as a female combatant, military tactician, and early leader of the anti-colonial resistance. Rising to the rank of lieutenant in the revolutionary army of Toussaint Louverture, she defied the rigid gender norms of the late 18th century by actively training recruits, commanding troops, and participating in direct combat against French forces. During the 1802 Leclerc expedition, she co-led the Matheux insurrection in the Artibonite valley, organizing a highly effective guerrilla campaign against French forces attempting to restore slavery.\n\nHer capture and subsequent execution in October 1802 became a watershed moment for the revolution. Her legendary defiance at the scaffold—where she refused a blindfold, successfully demanded to be shot like a soldier by a firing squad rather than be decapitated, and shouted 'Viv libète! A ba esclavaj!'—galvanized the remaining Black officers in the French army to permanently break with France and launch the final war for independence. Today, she is honored as a National Heroine of Haiti and is featured on the 10-gourde banknote.40:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"$43\"}]]}]\n"])</script><script>self.__next_f.push([1,"41:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"alt\":\"A.W. \\\"Art\\\" Saunders\",\"className\":\"w-full h-full object-cover\"}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"font-serif text-lg text-navy line-clamp-1\",\"children\":\"A.W. \\\"Art\\\" Saunders\"}],[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40\",\"children\":\"Turks \u0026 Caicos Islands\"}]]}]]}],[\"$\",\"$L6\",\"c0c62444-53a6-4e76-beb3-50dff472d653\",{\"href\":\"/profiles/adelaide-bernabela\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div
