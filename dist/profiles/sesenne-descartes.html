"18\",\"height\":\"18\",\"x\":\"3\",\"y\":\"4\",\"rx\":\"2\",\"key\":\"1hopcy\"}],[\"path\",{\"d\":\"M3 10h18\",\"key\":\"8toen8\"}]],\"className\":\"lucide-calendar h-4 w-4 text-gold mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Life Dates\"}],[\"$\",\"span\",null,{\"className\":\"text-sm font-semibold\",\"children\":[1914,\" – \",2010]}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M12 7v14\",\"key\":\"1akyts\"}],[\"path\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\",\"key\":\"ruj8y\"}]],\"className\":\"lucide-book-open h-4 w-4 text-navy/60 mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Areas of Influence\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2 mt-1\",\"children\":[[\"$\",\"$L6\",\"0\",{\"href\":\"/areas/culture\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"Culture\"}]]}]]}]]}]]}]]}]]}],\"$L1b\"]}]}]]}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Sesenne Descartes\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Introduction\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[\"Dame Marie Selipha \\\"Sesenne\\\" Descartes was Saint Lucia’s legendary \\\"Queen of Folk,\\\" a National Cultural Hero, and an enduring symbol of Creole identity [1]. Over a career that spanned nearly nine decades, Sesenne preserved and elevated the traditional folk music, dances, and oral history of Saint Lucia, helping to transform a marginalized rural culture into a source of national pride and unity [2]. As a premier \",[\"$\",\"em\",\"em-0\",{\"children\":\"chantwelle\"}],\" (lead folk singer), her powerful, unamplified voice and brilliant improvisational skills captivated audiences across the Caribbean and the wider world [3]. Operating in a socio-political climate where British colonial authorities and local elites actively discouraged the use of the Kwéyòl (Creole French patois) language and African-derived customs, Sesenne stood as a pillar of cultural resistance [4]. Her artistic triumph at the 1969 CARIFTA Expo in Grenada was a watershed moment, proving that the language and music of the Saint Lucian peasantry possessed immense artistic and historical value [1]. Her life’s work catalyzed a regional cultural renaissance, earning her numerous honors, including a knighthood as Dame Commander of the Order of the British Empire (DBE) [5]. Through her dedication, she showed that the true soul of a nation is found in the voices of its people.\"]}],\"\\n\",[\"$\",\"h3\",\"h3-1\",{\"children\":\"Early Life in Rural Saint Lucia\"}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":\"Marie Selipha Charlery was born on March 28, 1914, in the rural hamlet of La Pointe, near the village of Micoud on the southeastern coast of Saint Lucia [1]. Her parents, Tewannee and Sony Charlery, were subsistence farmers who worked the rugged terrain of the island [1]. At the time of her birth, Saint Lucia was undergoing a complex cultural negotiation. Although the island had been ruled by the British since the 1814 Treaty of Paris, it had changed hands between the French and the British fourteen times, leaving behind a population that was overwhelmingly Roman Catholic and French-Creole speaking [6]. The colonial administration enforced English as the official language and treated Kwéyòl as an illiterate, inferior tongue. Traditional African-derived dances, drumming, and religious practices were frequently banned or stigmatized as backward by both the British administrators and the Catholic Church [4].\"}],\"\\n\",\"$L1c\",\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\"]}]]}],\"$L37\",\"$L38\",false]}],\"$L39\"]}]\n"])</script><script>self.__next_f.push([1,"3a:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/0/05/1758_Bellin_Map_of_Saint_Lucia_%28Sainte_Lucie%29%2C_West_Indies_-_Geographicus_-_SaintLucia-bellin-1758.jpg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/2/2f/Fanm-b%C3%A8l%C3%A8-2.jpg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1c:[\"$\",\"p\",\"p-2\",{\"children\":[\"Growing up in the rural valleys of Micoud, Sesenne was insulated from the anglicized elite culture of the capital, Castries. Instead, she was immersed in the rich oral traditions of the Saint Lucian countryside. Her parents and her aunt, \\\"Ma Chadwick,\\\" who played an influential role in her upbringing, were deeply involved in community folk traditions [1]. From them, Sesenne learned the traditional ring games, work songs (\",[\"$\",\"em\",\"em-0\",{\"children\":\"koudmen\"}],\"), storytelling songs (\",[\"$\",\"em\",\"em-1\",{\"children\":\"cont\"}],\"), and the rhythmic dances that marked the cycles of rural life. She possessed a natural, extraordinary vocal range and a keen ear for pitch and rhythm. Even as a young child, her voice stood out for its resonance and clarity. She later recalled:\"]}]\n1d:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"Everyone was envious of my voice... When I sang I could be heard in Malgretoute.\\\"\\n— Dame Sesenne Descartes\"}],\"\\n\"]}]\n1e:[\"$\",\"h3\",\"h3-2\",{\"children\":\"The Flower Festivals and the Role of the Chantwelle\"}]\n1f:[\"$\",\"p\",\"p-3\",{\"children\":[\"Sesenne’s formal entry into Saint Lucia's cultural landscape occurred in the early 1920s, when she was approximately eight years old [2]. Her father, recognizing her unusual musical talent, appointed her as the \",[\"$\",\"em\",\"em-0\",{\"children\":\"chantwelle\"}],\" (lead singer) for the local \",[\"$\",\"em\",\"em-1\",{\"children\":\"La Rose\"}],\" flower society in Micoud [2].\"]}]\n20:[\"$\",\"p\",\"p-4\",{\"children\":[\"To understand the significance of this role, one must understand the unique institution of the Saint Lucian Flower Festivals: \",[\"$\",\"em\",\"em-0\",{\"children\":\"La Rose\"}],\" (The Rose) and \",[\"$\",\"em\",\"em-1\",{\"children\":\"La Marguerite\"}],\" (The Marguerite). Dating back to the colonial era, these two rival cultural societies represent a mock-monarchy, complete with a King, a Queen, princes, princesses, soldiers, and magistrates [7]. The Rosians and Margueritians engage in elaborate pageantry, holding court meetings and organizing festivals—La Rose on August 30th and La Marguerite on October 17th [7]. These societies are characterized by a unique fusion of European courtly pageantry (imported by French settlers and Catholic clergy) and African musical, dance, and theatrical structures.\"]}]\n21:[\"$\",\"p\",\"p-5\",{\"children\":[\"The \",[\"$\",\"em\",\"em-0\",{\"children\":\"chantwelle\"}],\" is the most critical musical figure in these societies [2]. Standing before the drummers—who play the \",[\"$\",\"em\",\"em-1\",{\"children\":\"tambou bélé\"}],\" (a barrel drum) and the \",[\"$\",\"em\",\"em-2\",{\"children\":\"ka\"}],\"—the \",[\"$\",\"em\",\"em-3\",{\"children\":\"chantwelle\"}],\" leads the call-and-response singing (\",[\"$\",\"em\",\"em-4\",{\"children\":\"lavwa\"}],\") [2]. She must not only have a powerful voice that can project over the thundering drums and the singing crowd, but she must also possess a sharp, improvisational wit. The \",[\"$\",\"em\",\"em-5\",{\"children\":\"chantwelle\"}],\" is expected to compose lyrics on the spot, praising her own flower society, mocking the rival society, and commenting on local events, political developments, and community gossip.\"]}]\n22:[\"$\",\"p\",\"p-6\",{\"children\":[\"Sesenne excelled in this role. Her voice, characterized by its rich, raw, and earthy tone, became legendary. In an era before electronic amplification, her vocals "])</script><script>self.__next_f.push([1,"could slice through the dense forest air, carrying across valleys from Micoud to Malgretoute and Mon Repos. She mastered the complex rhythms of the \",[\"$\",\"em\",\"em-0\",{\"children\":\"bélé\"}],\", the \",[\"$\",\"em\",\"em-1\",{\"children\":\"lakonmet\"}],\" (country dance), and the \",[\"$\",\"em\",\"em-2\",{\"children\":\"quadrille\"}],\", and became a custodian of the \",[\"$\",\"em\",\"em-3\",{\"children\":\"cont\"}],\", the traditional evening storytelling songs that blended narrative with vocal refrains [2]. She married a local laborer, Descartes, and took the name Marie Selipha Descartes, but to the people of the valley, she was simply \\\"Sesenne.\\\"\"]}]\n23:[\"$\",\"p\",\"p-7\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/0/05/1758_Bellin_Map_of_Saint_Lucia_%28Sainte_Lucie%29%2C_West_Indies_-_Geographicus_-_SaintLucia-bellin-1758.jpg\",\"alt\":\"Historical 1758 Bellin Map of Saint Lucia, depicting the geography and rugged terrain of the island where Sesenne preserved the rural Creole culture\"}]}]\n24:[\"$\",\"h3\",\"h3-3\",{\"children\":\"National Prominence and the CARIFTA Expo\"}]\n25:[\"$\",\"p\",\"p-8\",{\"children\":[\"For several decades, Sesenne's fame remained largely regional, confined to the rural communities of southern Saint Lucia. However, the mid-20th century brought a wave of anti-colonial nationalism and a growing interest in documenting indigenous West Indian culture. In the 1950s, pioneering cultural activists and researchers, most notably Harold Simmons (a mentor to the young poet \",[\"$\",\"code\",\"code-0\",{\"children\":\"[Derek Walcott](/profiles/derek-walcott)\"}],\" and painter \",[\"$\",\"code\",\"code-1\",{\"children\":\"[Dunstan St. Omer](/profiles/dunstan-st-omer)\"}],\"), began traveling to the countryside to record Saint Lucia's oral traditions. Simmons was stunned by Sesenne's vocal prowess and her vast repertoire of traditional songs. He began recording her, recognizing that she was a living archive of Saint Lucian folk history.\"]}]\n26:[\"$\",\"p\",\"p-9\",{\"children\":\"This research laid the groundwork for Sesenne's transition to the national stage. The watershed moment of her career came in 1969, when Saint Lucia was preparing to participate in the Caribbean Free Trade Association (CARIFTA) Expo in Grenada, a precursor to the Caribbean Festival of Creative Arts (CARIFESTA) [1]. The organizers wanted to showcase Saint Lucia's authentic folk culture, and they selected Sesenne to represent the island [1].\"}]\n27:[\"$\",\"p\",\"p-10\",{\"children\":[\"In Grenada, Sesenne performed her signature song, \\\"Manmay la dit wai!\\\" (Children, say yes!), entirely in Kwéyòl [1]. Backed by traditional drummers, her performance was an absolute sensation. Her powerful voice, physical presence, and the rhythmic intensity of the \",[\"$\",\"em\",\"em-0\",{\"children\":\"bélé\"}],\" captivated the regional audience. At a time when Creole languages were widely dismissed as unrefined dialects, Sesenne's performance was a triumphant assertion of linguistic and cultural validity. She won the competition, bringing international acclaim to Saint Lucia and establishing herself as a regional cultural icon [1].\"]}]\n28:[\"$\",\"p\",\"p-11\",{\"children\":[\"Her success at the CARIFTA Expo challenged the colonial hierarchy of taste. It forced the urban middle class in Castries to confront and celebrate the African and Creole heritage they had long ignored or suppressed. Her contemporary, Trinidad's legendary cultural dancer \",[\"$\",\"code\",\"code-0\",{\"children\":\"[Beryl McBurnie](/profiles/beryl-mcburnie)\"}],\", recognized Sesenne as a sister-in-arms in the struggle for the preservation of West Indian dance and music.\"]}]\n29:[\"$\",\"p\",\"p-12\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/2/2f/Fanm-b%C3%A8l%C3%A8-2.jpg\",\"alt\":\"A bèlè dancer performing in the traditional Creole dress similar to the style worn by Sesenne Descartes during her folk performances\"}]}]\n2a:[\"$\",\"h3\",\"h3-4\",{\"children\":\"Cultivating Creole Identity and National Honors\"}]\n2b:[\"$\",\"p\",\"p-13\",{\"children\":[\"Following her triumph in 1969, Sesenne became a central figure in Saint Lucia's cultural "])</script><script>self.__next_f.push([1,"policy. As the island moved toward independence, which it achieved in 1979 under Prime Minister \",[\"$\",\"code\",\"code-0\",{\"children\":\"[John Compton](/profiles/john-compton)\"}],\", the government and cultural organizations worked to institutionalize the preservation of folk culture. The Folk Research Centre (FRC), established in 1973, made Sesenne a primary resource for their work, recording her extensively and facilitating her performances at national events, schools, and cultural festivals.\"]}]\n2c:[\"$\",\"p\",\"p-14\",{\"children\":[\"In 1984, the government of Saint Lucia officially designated Dame Sesenne Descartes as the island's \\\"Queen of Culture\\\" [1]. She was no longer just a folk singer; she was a living national monument. Her status was further cemented in the writings of Saint Lucia's intellectual elite. Nobel Laureate \",[\"$\",\"code\",\"code-0\",{\"children\":\"[Derek Walcott](/profiles/derek-walcott)\"}],\" famously immortalized her in his poem \\\"Homecoming,\\\" writing:\"]}]\n2d:[\"$\",\"blockquote\",\"blockquote-1\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"\\\"My country heart, I am not home till Sesenne sings, a voice with woodsmoke and ground-doves in it, that cracks like clay on a road whose tints are the dry season's...\\\"\\n— Derek Walcott, \\\"Homecoming\\\"\"}],\"\\n\"]}]\n2e:[\"$\",\"p\",\"p-15\",{\"children\":\"Walcott's evocative description captured the essence of Sesenne's art: a voice that was not polished in European conservatories but was rooted in the soil, the history, and the daily life of Saint Lucia.\"}]\n2f:[\"$\",\"p\",\"p-16\",{\"children\":\"Her contributions were recognized internationally. In 2000, she was appointed a Dame Commander of the Order of the British Empire (DBE) by Queen Elizabeth II for her services to folk culture [5]. In 2005, the Folk Research Centre officially declared her a National Cultural Hero [2]. She was also inducted into the Caribbean Broadcasting Union Music Hall of Fame and received the Saint Lucia Medal of Merit (Gold) [1].\"}]\n30:[\"$\",\"p\",\"p-17\",{\"children\":[\"Throughout these honors, Sesenne remained deeply humble, continuing to live in her rural community in Mon Repos, Micoud, where she mentored younger generations of \",[\"$\",\"em\",\"em-0\",{\"children\":\"chantwelles\"}],\" and drummers, ensuring that the flame of Saint Lucian folk culture would not be extinguished.\"]}]\n31:[\"$\",\"h3\",\"h3-5\",{\"children\":\"Final Years, Death, and Cultural Legacy\"}]\n32:[\"$\",\"p\",\"p-18\",{\"children\":\"Dame Sesenne Descartes passed away on August 11, 2010, at the age of ninety-six in Mon Repos, Micoud [1]. Her death was met with national mourning. The government of Saint Lucia granted her a state funeral, an honor typically reserved for political leaders, reflecting her status as the spiritual mother of the nation.\"}]\n33:[\"$\",\"p\",\"p-19\",{\"children\":[\"Following her passing, the Saint Lucian government announced the creation of the Dame Sesenne Descartes National Endowment for Creative Industries to support local artists and preserve traditional arts [5]. Additionally, her home in Mon Repos was earmarked to be converted into a cultural museum and heritage site, named \",[\"$\",\"em\",\"em-0\",{\"children\":\"La Plas Sesenne\"}],\" (Sesenne's Place), ensuring that her birthplace would remain a center for Creole cultural education [2].\"]}]\n34:[\"$\",\"p\",\"p-20\",{\"children\":\"Sesenne’s legacy is defined by her role in shifting the national consciousness of Saint Lucia. By dedicating her life to singing in Kwéyòl and dancing the bélé, she helped dismantle the colonial shame associated with African-Caribbean heritage. As cultural writer and activist Monsignor Patrick Anthony noted:\"}]\n35:[\"$\",\"blockquote\",\"blockquote-2\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[\"\\\"Wrapped in that petite little bundle of Marie Descartes is the graceful stiffness of the French Court, the warm folksiness of the Patience soil, the spontaneous gaiety of the St. Lucia countryside and the deep religious fervor of the St. Lucia Catholic – all in all, there is something that represents the quintessence of St. Lucia 'soul' in Sesenne.\\\"\\n— \",[\"$\",\"em\",\"em-0\",{\"children\":\"The Cru"])</script><script>self.__next_f.push([1,"sader\"}],\" (1972)\"]}],\"\\n\"]}]\n36:[\"$\",\"p\",\"p-21\",{\"children\":\"Through her voice, Dame Sesenne Descartes taught generations of Saint Lucians to embrace their language, their history, and their identity, securing her place as the eternal Queen of Saint Lucian culture.\"}]\n37:[\"$\",\"$L3a\",null,{\"title\":\"Learn about the legacy of Sesenne Descartes\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/sesenne-descartes\"}]\n3b:T47b,Dame Sesenne Descartes made monumental contributions to the preservation and validation of Saint Lucian Creole folk culture. As a legendary *chantwelle* (lead singer) of the *La Rose* flower society, she spent nearly nine decades documenting, performing, and teaching traditional Creole dances, songs, and oral histories. Her performance at the 1969 CARIFTA Expo in Grenada brought Saint Lucian folk music to the regional stage, proving that the Kwéyòl language and African-Caribbean arts possessed high aesthetic value and helping to dismantle colonial stigmas associated with the language of the peasantry.\n\nHer work sparked a cultural renaissance across Saint Lucia and the wider Caribbean. Officially recognized as Saint Lucia's 'Queen of Culture' in 1984 and designated a National Cultural Hero in 2005, Sesenne collaborated with leading intellectuals, artists, and researchers to institutionalize folk research. Her legacy is preserved through the Dame Sesenne Descartes National Endowment for Creative Industries and the *La Plas Sesenne* cultural museum, ensuring that Creole identity remains a foundation of Saint Lucian national pride.38:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"$3b\"}]]}]\n"])</script><script>self.__next_f.push([1,"39:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-2
