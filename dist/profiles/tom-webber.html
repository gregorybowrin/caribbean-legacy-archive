",\"key\":\"1hopcy\"}],[\"path\",{\"d\":\"M3 10h18\",\"key\":\"8toen8\"}]],\"className\":\"lucide-calendar h-4 w-4 text-gold mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Life Dates\"}],[\"$\",\"span\",null,{\"className\":\"text-sm font-semibold\",\"children\":[1914,\" – \",1999]}]]}]]}],[\"$\",\"div\",null,{\"className\":\"flex items-start\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M12 7v14\",\"key\":\"1akyts\"}],[\"path\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\",\"key\":\"ruj8y\"}]],\"className\":\"lucide-book-open h-4 w-4 text-navy/60 mr-3 mt-1\"}],[\"$\",\"div\",null,{\"children\":[[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40 block\",\"children\":\"Areas of Influence\"}],[\"$\",\"div\",null,{\"className\":\"flex flex-wrap gap-2 mt-1\",\"children\":[[\"$\",\"$L6\",\"0\",{\"href\":\"/areas/history\",\"className\":\"text-[9px] uppercase tracking-tighter bg-sand px-2 py-1 border border-gold/20 hover:border-gold transition-colors\",\"children\":\"History\"}]]}]]}]]}]]}]]}]]}],\"$L1b\"]}]}]]}]\n"])</script><script>self.__next_f.push([1,"1c:I[62682,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/4/41/Antigua_and_Barbuda_in_its_region.svg\",\"image\"]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"div\",null,{\"className\":\"lg:col-span-8\",\"children\":[[\"$\",\"header\",null,{\"className\":\"mb-12\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"font-serif font-light text-5xl md:text-6xl text-navy mb-4 leading-tight\",\"children\":\"Capt. Tom Webber\"}],[\"$\",\"div\",null,{\"className\":\"w-24 h-[2px] bg-gold\"}]]}],[\"$\",\"section\",null,{\"className\":\"prose prose-navy max-w-none\",\"children\":[[\"$\",\"div\",null,{\"className\":\"relative mb-12\",\"children\":[[\"$\",\"$L1a\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute -left-8 -top-8 h-16 w-16 text-gold/10 pointer-events-none\"}],[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Biography\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed prose prose-navy max-w-none  prose-headings:font-serif prose-headings:font-bold prose-headings:text-navy  prose-h3:text-3xl prose-h3:mt-10 prose-h3:mb-4 prose-a:text-gold hover:prose-a:text-navy prose-a:transition-colors prose-img:rounded-md prose-img:shadow-md prose-img:mx-auto prose-img:border prose-img:border-gold/20 prose-blockquote:border-l-4 prose-blockquote:border-gold prose-blockquote:pl-8  prose-blockquote:italic prose-blockquote:text-navy/80 prose-blockquote:font-serif prose-blockquote:text-2xl prose-blockquote:ml-8 prose-blockquote:my-10 [\u0026_blockquote_p::before]:hidden [\u0026_blockquote_p::after]:hidden\",\"children\":[[\"$\",\"h3\",\"h3-0\",{\"children\":\"Introduction and Maritime Heritage\"}],\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":\"Captain Thomas \\\"Tom\\\" Webber (1914 – 1999) stands as one of the most revered maritime figures in the modern history of Barbuda and the northeastern Caribbean. Celebrated across the Leeward Islands as a peerless reef pilot, master navigator, and community patriarch, Webber embodied the intimate, life-sustaining relationship between Barbudans and the perilous Atlantic and Caribbean waters that encircle their low-lying homeland. For nearly seven decades, in an era before modern satellite positioning, electronic depth sounders, and automated navigation buoys, Webber served as the living navigational compass of Barbuda. His encyclopedic mental chart of the island's treacherous coral heads, shifting sandbars, and narrow barrier reef channels allowed cargo sloops, passenger smacks, and fishing fleets to traverse waters that had claimed hundreds of colonial and merchant vessels over the centuries.\"}],\"\\n\",[\"$\",\"p\",\"p-1\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/4/41/Antigua_and_Barbuda_in_its_region.svg\",\"alt\":\"Map showing Antigua and Barbuda within the Caribbean Sea\"}]}],\"\\n\",[\"$\",\"p\",\"p-2\",{\"children\":[\"Operating in close concert with master shipwrights like \",[\"$\",\"$L1c\",\"a-0\",{\"slug\":\"johnny-george\",\"href\":\"/profiles/johnny-george\",\"children\":\"Capt. Johnny George\"}],\" and visionary community leaders like \",[\"$\",\"$L1c\",\"a-1\",{\"slug\":\"samuel-thomas\",\"href\":\"/profiles/samuel-thomas\",\"children\":\"Samuel Thomas\"}],\" and \",[\"$\",\"$L1c\",\"a-2\",{\"slug\":\"john-codrington-bar\",\"href\":\"/profiles/john-codrington-bar\",\"children\":\"John Codrington\"}],\", Webber transformed traditional oceanic knowledge into a vital shield for his community [1]. On an island defined by geographic isolation, historical administrative neglect under British colonial governance, and a fiercely defended communal land tenure system, maritime navigation was not merely a trade; it was the sole artery connecting Barbuda to Antigua, the wider West Indies, and global commerce. Captain Tom Webber's command of the sea preserved human life, sustained local fisheries, orchestrated perilous rescue operations, and anchored the collective identity of Barbudan seafaring culture throughout the twentieth century.\"]}],\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\",\"\\n\",\"$L28\",\"\\n\",\"$L29\",\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\",\"\\n\",\"$L35\",\"\\n\",\"$L36\",\"\\n\",\"$L37\"]}]]}],\"$L38\",\"$L39\",false]}],\"$L3a\"]}]\n"])</script><script>self.__next_f.push([1,"3b:I[54477,[\"/_next/static/chunks/2i9p3n79r-dbf.js\",\"/_next/static/chunks/2z-jpqdx1wamk.js\",\"/_next/static/chunks/14mrh2-p_w84d.js\",\"/_next/static/chunks/2uyb8-0enc77-.js\",\"/_next/static/chunks/2zpyn7ne_o0vv.js\"],\"default\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Boat_in_Antigua.jpg/800px-Boat_in_Antigua.jpg\",\"image\"]\n:HL[\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"image\"]\n1d:[\"$\",\"h3\",\"h3-1\",{\"children\":\"Early Life and Oceanic Apprenticeship in Codrington (1914–1930s)\"}]\n1e:[\"$\",\"p\",\"p-3\",{\"children\":\"Tom Webber was born in 1914 in the historic village of Codrington, the solitary settlement on Barbuda, just as the rumblings of the First World War began to echo across the British Empire. Unlike mountainous volcanic islands such as Dominica or Saint Kitts, Barbuda is a flat, coralline limestone platform rising barely a few dozen feet above sea level. Because the island lacked the fresh running water and topography necessary for extensive sugar cane monoculture, colonial proprietors—most notably the Codrington family, who held a colonial lease from 1685 until 1870—operated the island largely as an open-range livestock farm and a provisioning station [2]. Following emancipation, Barbudans forged a unique communal way of life where land, wild stock, and coastal fisheries were held collectively by all descendants of the island.\"}]\n1f:[\"$\",\"p\",\"p-4\",{\"children\":\"Growing up within this tightly knit, egalitarian society, young Tom was drawn to the sea almost from infancy. The village of Codrington hugs the eastern rim of the magnificent Codrington Lagoon, an expansive, mangrove-fringed body of water sheltered from the open sea by a fragile barrier sand spit. It was within this nursery of marine life that Webber received his earliest maritime education. As a boy, he worked alongside veteran fishers, poling flat-bottomed wooden dories through shallow flats, setting handmade wicker fish pots, and learning the seasonal migrations of bonefish, mullet, and spiny lobsters.\"}]\n20:[\"$\",\"p\",\"p-5\",{\"children\":[\"By his teenage years, Webber transitioned from the sheltered calm of the lagoon to the open, tumultuous waters of the Atlantic shelf. He served as an apprentice crewman aboard traditional wooden sloops crafted by Barbuda's legendary shipwrights, including the revered \",[\"$\",\"$L1c\",\"a-0\",{\"slug\":\"johnny-george\",\"href\":\"/profiles/johnny-george\",\"children\":\"Capt. Johnny George\"}],\". Under the stern tutelage of elder sea captains, Webber developed the sensory art of Caribbean \\\"eyeball navigation.\\\" He learned to read the sea floor through the variable colors of the water: a blinding white indicated a harmless sandbar of shallow depth; a brilliant, crystalline turquoise marked safe, navigable depths of ten to fifteen feet; a pale, yellowish-green warned of razor-sharp elkhorn and brain coral formations lurking just below the surface; and deep, ink-black indigo revealed the safety of sudden oceanic trenches.\"]}]\n21:[\"$\",\"blockquote\",\"blockquote-0\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[\"\\\"To an outsider, the coral heads look like teeth waiting to tear a ship's belly open. But to someone who knows them, every reef is a signpost. The ocean talks to you through the color of the water and the slap of the swell; you just have to know how to listen.\\\" — \",[\"$\",\"em\",\"em-0\",{\"children\":\"Capt. Tom Webber\"}]]}],\"\\n\"]}]\n22:[\"$\",\"h3\",\"h3-2\",{\"children\":\"Master of the Treacherous Barrier Reefs\"}]\n23:[\"$\",\"p\",\"p-6\",{\"children\":\"Barbuda's marine geography is universally recognized by nautical historians as one of the most hazardous navigation zones in the Western Hemisphere. Encircled by a virtually unbroken labyrinth of barrier reefs—including the notorious Palaster Reef to the south, the extensive Cobb Reef to the north, and treacherous fringe shoals around Spanish Point and Gravenor Bay—the island earned a dark reputation as the \\\"graveyard of"])</script><script>self.__next_f.push([1," the Caribbean\\\" [3]. More than two hundred recorded European ships, from heavily armed Spanish galleons to British naval frigates and French merchant barques, were wrecked upon its hidden coral fangs between the seventeenth and nineteenth centuries.\"}]\n24:[\"$\",\"p\",\"p-7\",{\"children\":\"Where foreign captains saw only terror and disaster, Capt. Tom Webber possessed complete mastery. Over decades of daily immersion, Webber developed an intimate, almost supernatural familiarity with every submerged cut, passage, and coral head ringing the island. He understood how oceanic swells behaved across different phases of the lunar cycle, how the prevailing trade winds interacted with deep-sea currents funneled through the Antigua-Barbuda channel, and how hurricane surges altered the contours of undersea sandbanks.\"}]\n25:[\"$\",\"p\",\"p-8\",{\"children\":\"Webber did not navigate by paper charts, which were notoriously inaccurate and rarely captured the dynamic, living growth of coral colonies. Instead, he relied on an intricate web of terrestrial sightlines known locally as \\\"marks.\\\" By aligning a specific twisted lignum vitae tree on the horizon with the roofline of a stone ruin near the Martello Tower, or aligning two distant coastal dunes, Webber could thread a fully laden thirty-foot sloop through an eight-foot gap in a foaming reef with mere inches of clearance beneath the keel. Even on pitch-black, moonless nights or in driving squalls that blinded the eyes, Webber navigated by ear and instinct. He could judge his vessel's distance from a barrier reef by the acoustic resonance of the breakers crashing against the coral barrier and by the distinct, sulfurous scent of tidal spray released by exposed reef flats.\"}]\n26:[\"$\",\"h3\",\"h3-3\",{\"children\":\"Guiding the Sloop Fleets and Sustaining the Island Economy (1940s–1960s)\"}]\n27:[\"$\",\"p\",\"p-9\",{\"children\":\"During the middle decades of the twentieth century, Barbuda remained almost entirely dependent upon maritime transport for its economic survival. In the 1940s and 1950s, the island possessed no commercial airstrip, no deep-water seaport, and no reliable telecommunications link to the colonial administrative center in St. John's, Antigua. Every sack of flour, barrel of kerosene, medical supply, letter, and piece of lumber had to be transported across the turbulent thirty-mile channel separating Barbuda from Antigua [2].\"}]\n28:[\"$\",\"p\",\"p-10\",{\"children\":[\"$\",\"img\",\"img-0\",{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cc/Boat_in_Antigua.jpg/800px-Boat_in_Antigua.jpg\",\"alt\":\"A traditional Caribbean sailing vessel\"}]}]\n29:[\"$\",\"p\",\"p-11\",{\"children\":\"It was during this critical era that Captain Tom Webber became indispensable to the survival of the island. As captain and master pilot, he took the helm of cargo sloops carrying Barbuda's exports: firewood, charcoal, prized cattle, horses, sea-island cotton, and freshly caught fish destined for the urban markets of Antigua, Montserrat, and Saint Kitts. Navigating the crossing required immense physical endurance and tactical daring. The Antigua-Barbuda passage was notorious for violent, unexpected squalls and cross-currents that could easily dismast a wooden sloop or sweep it westward into the open Caribbean Sea.\"}]\n2a:[\"$\",\"p\",\"p-12\",{\"children\":[\"During the hazardous years of the Second World War, when German U-boats prowled Caribbean shipping lanes and regional maritime trade was severely disrupted, Webber's ability to safely pilot vessels through uncharted reef corridors proved vital in preventing starvation on Barbuda. In the post-war era, as pioneer \",[\"$\",\"$L1c\",\"a-0\",{\"slug\":\"samuel-thomas\",\"href\":\"/profiles/samuel-thomas\",\"children\":\"Samuel Thomas\"}],\" spearheaded the modernization of the commercial spiny lobster fishery, Webber served as a leading navigator and marine consultant [1]. He charted the rich, untamed fishing banks off the northern and eastern reefs, identifying the most fertile lobster grounds and teaching young fishing crews how to set and retrieve their gear in punishing Atlantic swells without shattering"])</script><script>self.__next_f.push([1," their wooden boats against the coral reefs.\"]}]\n2b:[\"$\",\"h3\",\"h3-4\",{\"children\":\"Pilot of the Wrecks and Search-and-Rescue Commodore\"}]\n2c:[\"$\",\"p\",\"p-13\",{\"children\":\"For centuries, the salvage of wrecked vessels was a foundational pillar of Barbuda's domestic economy, codified by colonial custom and fiercely defended by Barbudan villagers against British colonial authorities. When a ship ran aground on the outer reefs, it was customary for local mariners to launch dories to rescue passengers and salvage cargo under the supervision of the resident island magistrate.\"}]\n2d:[\"$\",\"p\",\"p-14\",{\"children\":\"By the mid-twentieth century, as international merchant shipping, oil tankers, and recreational yachts increasingly traversed the Caribbean, strandings on Barbuda's outer shoals remained frequent occurrences. Whenever a distress call or emergency flare lit the night sky over Palaster Reef or the Atlantic windward reefs, the community instinctively turned to Captain Tom Webber. He was universally appointed as the unofficial \\\"Commodore of Search and Rescue\\\" by his fellow mariners.\"}]\n2e:[\"$\",\"p\",\"p-15\",{\"children\":\"Webber possessed the rare courage and tactical brilliance required to lead rescue flotillas into raging surf zones. In situations where foreign naval vessels or colonial patrol cutters feared to approach due to the shallow coral heads, Webber would expertly pilot Barbudan wooden dories directly through the teeth of the breakers. Over his long career, he was credited with saving dozens of stranded sailors, fishermen, and passengers from doomed hulls, never losing a crew member under his command.\"}]\n2f:[\"$\",\"blockquote\",\"blockquote-1\",{\"children\":[\"\\n\",[\"$\",\"p\",\"p-0\",{\"children\":[\"\\\"Whenever a distress flare went up over Palaster Reef in the dead of night, nobody asked what flag the vessel flew. We looked to Captain Tom. If Tom said the channel could be crossed, the boats launched; if he said wait for the turn of the tide, the whole village waited.\\\" — \",[\"$\",\"em\",\"em-0\",{\"children\":\"Barbudan oral tradition\"}]]}],\"\\n\"]}]\n30:[\"$\",\"p\",\"p-16\",{\"children\":[\"His intimate knowledge of maritime salvage customs also made him a formidable defender of local rights. In administrative disputes with colonial officials based in St. John's, Antigua, Webber insisted that Barbudan salvagers receive fair compensation for their perilous labor. Alongside community leaders such as educator \",[\"$\",\"$L1c\",\"a-0\",{\"slug\":\"margaret-burton\",\"href\":\"/profiles/margaret-burton\",\"children\":\"Margaret Burton\"}],\" and political representatives like \",[\"$\",\"$L1c\",\"a-1\",{\"slug\":\"mcchesney-george\",\"href\":\"/profiles/mcchesney-george\",\"children\":\"McChesney George\"}],\", Webber upheld the dignity of the Barbudan working class, ensuring that the wealth wrenched from the sea benefited the islanders whose lives were constantly on the line.\"]}]\n31:[\"$\",\"h3\",\"h3-5\",{\"children\":\"Mentorship, Technological Change, and Cultural Guardianship (1970s–1990s)\"}]\n32:[\"$\",\"p\",\"p-17\",{\"children\":\"The final quarter of the twentieth century brought rapid technological, social, and political transformations to Barbuda. With the introduction of fiberglass skiffs, high-powered outboard engines, radar, and eventually satellite-based GPS systems, traditional seamanship across the Caribbean began to decline. Yet Captain Tom Webber remained an unwavering advocate for the primacy of experiential, sensory navigation. He cautioned younger mariners that electronic equipment was vulnerable to battery failure, salt corrosion, and electrical shorts, while an intimate understanding of the living sea would never fail them.\"}]\n33:[\"$\",\"p\",\"p-18\",{\"children\":\"Throughout the 1970s and 1980s, Webber devoted his golden years to mentoring the rising generation of Barbudan mariners. He instructed young skippers in the delicate arts of reading the wind, observing cloud formations over Antigua's volcanic hills to predict weather changes, and steering by the constellations of the Caribbean night sky. He was also a passionate pioneer of marine conservation long before it became an international "])</script><script>self.__next_f.push([1,"movement. Webber taught fishermen to respect the reproductive cycles of the spiny lobster and conch, warned against anchoring on fragile elkhorn corals, and vigorously defended the ecological health of the Codrington Lagoon—the breeding ground of Barbuda's world-renowned frigatebird sanctuary.\"}]\n34:[\"$\",\"p\",\"p-19\",{\"children\":[\"During the contentious political debates surrounding the independence of Antigua and Barbuda in 1981, led nationally by \",[\"$\",\"$L1c\",\"a-0\",{\"slug\":\"vere-cornwall-bird\",\"href\":\"/profiles/vere-cornwall-bird\",\"children\":\"Vere Cornwall Bird\"}],\", Barbudans mobilized under leaders like \",[\"$\",\"$L1c\",\"a-1\",{\"slug\":\"hilbourne-frank\",\"href\":\"/profiles/hilbourne-frank\",\"children\":\"Hilbourne Frank\"}],\" to protect their communal land and maritime patrimony. Webber stood as a respected elder statesman within this civic resistance. He argued passionately that the waters, reefs, and coastal ecosystems surrounding Barbuda belonged to the Barbudan people in common, just as the land did, and could never be ceded to foreign corporate developers or centralized political interests without destroying the soul of the island.\"]}]\n35:[\"$\",\"h3\",\"h3-6\",{\"children\":\"Death and Enduring Legacy\"}]\n36:[\"$\",\"p\",\"p-20\",{\"children\":\"Captain Tom Webber passed away peacefully in Codrington in 1999 at the age of 85, marking the close of an epic chapter in Leeward Islands maritime history. His passing was mourned by generations of Barbudans, whose lives, livelihoods, and ancestors had been safeguarded by his steady hand at the helm.\"}]\n37:[\"$\",\"p\",\"p-21\",{\"children\":\"Today, Captain Tom Webber is remembered as the quintessential archetype of the Barbudan reef master—a man whose mind held an entire marine kingdom of coral, tide, and wind. His life's work stands as an immortal monument to the maritime resilience of the African diaspora in the Caribbean. By mastering one of the most treacherous oceanic environments on Earth, Webber did not merely conquer the sea; he nurtured a community, sustained an island economy, and preserved an invaluable reservoir of indigenous seafaring knowledge that continues to inspire Barbudans to navigate their future with courage, unity, and profound reverence for the ocean.\"}]\n38:[\"$\",\"$L3b\",null,{\"title\":\"Learn about the legacy of Capt. Tom Webber\",\"url\":\"https://caribbeanlegacyarchive.com/profiles/tom-webber\"}]\n3c:T6d0,"])</script><script>self.__next_f.push([1,"Capt. Tom Webber made monumental contributions to the maritime development, economic survival, and cultural preservation of Barbuda and the northeastern Caribbean as the island's preeminent twentieth-century reef pilot and master navigator. Navigating the treacherous barrier reefs, shifting sandbars, and unpredictable channels that encircle Barbuda—historically notorious as the 'graveyard of the Caribbean'—Webber served as the indispensable guide for cargo sloops, fishing fleets, and inter-island passenger smacks. In an era preceding satellite navigation and modern communications, his encyclopedic mastery of 'eyeball navigation' and traditional seafaring maintained the vital trade and provisioning lifeline between isolated Barbuda and Antigua. During World War II and the post-war expansion of the commercial lobster trade, his navigational expertise sustained local livelihoods, charted productive fishing banks, and protected vessels from destruction.\n\nEqually consequential was Webber's leadership in marine search-and-rescue and community advocacy. Serving as the unofficial commodore of maritime emergency response for decades, he led daring rescue missions through perilous surf zones to save stranded international mariners from wrecked vessels without losing a single crew member. Webber fiercely defended Barbudan customary salvage rights and maritime commons against colonial encroachment, insisting that the wealth of the sea belong to the islanders. By mentoring generations of young sailors in sustainable fishing, reef conservation, and traditional astronomical navigation, Captain Tom Webber preserved Barbuda's intangible maritime heritage and solidified the community's sovereign connection to its coastal waters."])</script><script>self.__next_f.push([1,"39:[\"$\",\"div\",null,{\"className\":\"mb-12 pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-3xl text-navy mb-6\",\"children\":\"Major Contributions\"}],[\"$\",\"div\",null,{\"className\":\"text-navy/80 text-xl leading-relaxed bg-white p-8 border-l-4 border-tropical-green shadow-sm\",\"children\":\"$3c\"}]]}]\n"])</script><script>self.__next_f.push([1,"3a:[\"$\",\"section\",null,{\"className\":\"pt-12 border-t border-gold/10\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-serif font-bold text-2xl text-navy mb-8\",\"children\":\"Related Figures\"}],[\"$\",\"div\",null,{\"className\":\"grid grid-cols-1 md:grid-cols-2 gap-6\",\"children\":[[\"$\",\"$L6\",\"a7bf58e8-e37b-439f-b67c-13b575bca9cb\",{\"href\":\"/profiles/art-saunders\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"img\",null,{\"src\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/John_R._Neill%2C_noted_illustrator.jpg/960px-John_R._Neill%2C_noted_illustrator.jpg?utm_source=en.wikipedia.org\u0026utm_campaign=api\u0026utm_content=thumbnail\",\"alt\":\"A.W. \\\"Art\\\" Saunders\",\"className\":\"w-full h-full object-cover\"}]}],[\"$\",\"div\",null,{\"className\":\"p-4\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"font-serif text-lg text-navy line-clamp-1\",\"children\":\"A.W. \\\"Art\\\" Saunders\"}],[\"$\",\"span\",null,{\"className\":\"text-[10px] uppercase tracking-widest text-navy/40\",\"children\":\"Turks \u0026 Caicos Islands\"}]]}]]}],[\"$\",\"$L6\",\"c0c62444-53a6-4e76-beb3-50dff472d653\",{\"href\":\"/profiles/adelaide-bernabela\",\"className\":\"flex bg-white border border-gold/10 overflow-hidden hover:shadow-lg transition-all\",\"children\":[[\"$\",\"div\",null,{\"className\":\"w-24 h-24 flex-shrink-0 grayscale hover:grayscale-0 transition-all\",\"children\":[\"$\",\"div\",null,{\"className\":\"flex items-center justify-center font-bold text-white shadow-lg bg-gradient-to-br from-slate-700 to-slate-500 text-xl w-full h-full rounded-none\",\"aria-label\":\"Profile picture pla
